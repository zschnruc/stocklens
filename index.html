/* ---------------- 五维评分（纯函数，可离线单测） ---------------- */

/* 波动率健康度：加密资产 40%–80% 年化波动较健康；
   过低说明流动性/关注度不足，过高说明风险失控。 */
function cryptoVolScore(vol) {
  if (!Number.isFinite(vol)) return null;
  if (vol < 15) return 30;
  if (vol < 25) return 45;
  if (vol < 40) return 48 + ((vol - 25) / 15) * 32;
  if (vol <= 80) return 88 - ((vol - 40) / 40) * 4;
  if (vol <= 120) return 84 - ((vol - 80) / 40) * 30;
  return clamp(54 - ((vol - 120) / 80) * 34, 12, 54);
}

/* 换手率：1%–15% 为健康活跃区；>50% 多为投机换手，扣分但不归零。 */
function cryptoTurnoverScore(turnover) {
  if (!Number.isFinite(turnover)) return null;
  if (turnover > 80) return 38;
  if (turnover > 50) return 48;
  if (turnover > 30) return 58;
  if (turnover > 15) return 72;
  if (turnover > 8) return 88;
  if (turnover > 3) return 92;
  if (turnover > 1) return 84;
  if (turnover > 0.3) return 68;
  return 52;
}

/* 资金费率：极端正值=多头拥挤；负值=空头拥挤，按逆向情绪小幅加分。 */
function cryptoFundingScore(funding) {
  if (!Number.isFinite(funding)) return null;
  if (funding > 0.0008) return 20;
  if (funding > 0.0004) return 34;
  if (funding > 0.00015) return 48;
  if (funding >= -0.00005) return 60;
  if (funding >= -0.0003) return 70;
  if (funding >= -0.0008) return 82;
  return 62;
}

function cryptoBasisScore(basisPct) {
  const abs = Number.isFinite(basisPct) ? Math.abs(basisPct) : null;
  if (abs === null) return null;
  if (abs > 2) return 30;
  if (abs > 1) return 45;
  if (abs > 0.5) return 60;
  if (abs > 0.2) return 76;
  return 88;
}

function scoreCryptoTrend(kline, btcKline) {
  const m = kline && kline.metrics;
  if (!m || !Number.isFinite(m.r30)) {
    return { available: false, note: '日 K 数据不足，趋势动量不计入', reasons: [] };
  }
  const r30s = band(m.r30, [[60, 98], [35, 92], [15, 82], [5, 72], [-5, 60], [-15, 46], [-30, 28]], 14);
  const r90s = Number.isFinite(m.r90)
    ? band(m.r90, [[150, 98], [80, 92], [30, 82], [0, 68], [-25, 50], [-50, 30]], 14)
    : null;
  let align = null;
  if (Number.isFinite(m.ma20) && Number.isFinite(m.ma60)) {
    if (m.last > m.ma20 && m.ma20 > m.ma60) align = 92;
    else if (m.last < m.ma20 && m.ma20 < m.ma60) align = 24;
    else align = 55;
  }
  const bm = btcKline && btcKline.metrics;
  const excess =
    bm && Number.isFinite(bm.r60) && Number.isFinite(m.r60) ? m.r60 - bm.r60 : null;
  const excessS = excess === null
    ? null
    : band(excess, [[60, 96], [30, 88], [10, 76], [0, 60], [-15, 44], [-35, 26]], 14);
  let sum = 0;
  let w = 0;
  if (r30s !== null) { sum += r30s * 0.35; w += 0.35; }
  if (r90s !== null) { sum += r90s * 0.25; w += 0.25; }
  if (align !== null) { sum += align * 0.2; w += 0.2; }
  if (excessS !== null) { sum += excessS * 0.2; w += 0.2; }
  const score = w > 0 ? Math.round(sum / w) : 50;
  const reasons = [
    `30 日收益 ${fmtPct(m.r30)}，90 日收益 ${fmtPct(m.r90)}，收益分分别为 ${r30s} / ${r90s ?? '—'}。`,
    Number.isFinite(m.ma20) && Number.isFinite(m.ma60)
      ? `现价 ${fmtPrice(m.last, m.last < 1 ? 4 : 2)}，MA20 ${fmtPrice(m.ma20, m.ma20 < 1 ? 4 : 2)}、MA60 ${fmtPrice(m.ma60, m.ma60 < 1 ? 4 : 2)}，均线形态「${m.trend}」。`
      : '均线数据不足，均线排列子项按中性处理。',
    excess === null
      ? 'BTC 基准数据不可用，相对强弱子项未计入。'
      : `相对 BTC 的 60 日超额收益 ${fmtPct(excess)}，超额分 ${excessS}。`,
    '子项权重：30 日收益 35% / 90 日收益 25% / 均线排列 20% / 相对 BTC 超额 20%。',
  ];
  return {
    available: true,
    score: clamp(score, 0, 100),
    note: `30日 ${fmtPct(m.r30)} · 90日 ${fmtPct(m.r90)}${excess !== null ? ` · 超额 ${fmtPct(excess)}` : ''}`,
    reasons,
  };
}

function scoreCryptoLiquidity(quote, meta) {
  const volume = num(quote && (quote.amount ?? quote.quoteVolume));
  if (!Number.isFinite(volume)) {
    return { available: false, note: '24h 成交额数据缺失', reasons: [] };
  }
  const cap = num(meta && meta.marketCap);
  const rank = num(meta && meta.rank);
  const turnover = Number.isFinite(cap) && cap > 0 ? (volume / cap) * 100 : null;
  const volS = band(volume, [
    [5e9, 98], [1e9, 92], [3e8, 84], [1e8, 76], [3e7, 64], [1e7, 52], [3e6, 38], [5e5, 24],
  ], 12);
  const turnS = cryptoTurnoverScore(turnover);
  const rankS = Number.isFinite(rank)
    ? rank <= 10 ? 95 : rank <= 30 ? 84 : rank <= 50 ? 74 : rank <= 100 ? 62 : 50
    : null;
  let sum = 0;
  let w = 0;
  if (volS !== null) { sum += volS * 0.5; w += 0.5; }
  if (turnS !== null) { sum += turnS * 0.3; w += 0.3; }
  if (rankS !== null) { sum += rankS * 0.2; w += 0.2; }
  const reasons = [`24h 成交额约 ${fmtUsdCompact(volume)}，成交额分 ${volS}。`];
  if (turnover !== null) {
    reasons.push(`换手率（24h 成交额 ÷ 市值）约 ${turnover.toFixed(2)}%，换手分 ${turnS}；1%–15% 为健康活跃区，>50% 多为投机换手。`);
  } else {
    reasons.push('市值数据缺失，换手率子项未计入。');
  }
  if (rankS !== null) reasons.push(`CoinLore 市值排名第 ${rank}，排名分 ${rankS}。`);
  else reasons.push('市值排名数据缺失，排名子项未计入。');
  reasons.push('子项权重：成交额 50% / 换手率 30% / 市值排名 20%。');
  return {
    available: true,
    score: Math.round(w > 0 ? sum / w : 50),
    note: `24h ${fmtUsdCompact(volume)}${turnover !== null ? ` · 换手 ${turnover.toFixed(2)}%` : ''}${Number.isFinite(rank) ? ` · #${rank}` : ''}`,
    reasons,
  };
}

function scoreCryptoVolatility(kline) {
  const m = kline && kline.metrics;
  if (!m || !Number.isFinite(m.vol30)) {
    return { available: false, note: '波动率数据不足', reasons: [] };
  }
  const volS = cryptoVolScore(m.vol30);
  /* FR-18.2：band 按阈值降序匹配，回撤越深得分越低；<10% 视为极浅回撤给 98 分 */
  const mddS = Number.isFinite(m.maxDrawdown90)
    ? band(m.maxDrawdown90, [[80, 24], [65, 40], [50, 58], [35, 76], [20, 88], [10, 96]], 98)
    : null;
  const atrS = Number.isFinite(m.atrPct)
    ? band(m.atrPct, [[12, 50], [9, 66], [6, 88], [4, 92], [2.5, 82], [1.5, 66]], 40)
    : null;
  let sum = 0;
  let w = 0;
  if (volS !== null) { sum += volS * 0.45; w += 0.45; }
  if (mddS !== null) { sum += mddS * 0.35; w += 0.35; }
  if (atrS !== null) { sum += atrS * 0.2; w += 0.2; }
  return {
    available: true,
    score: Math.round(w > 0 ? sum / w : 50),
    note: `30日波动 ${volS !== null ? m.vol30.toFixed(1) + '%' : '—'} · 90日回撤 ${Number.isFinite(m.maxDrawdown90) ? m.maxDrawdown90.toFixed(1) + '%' : '—'}`,
    reasons: [
      `30 日年化波动率约 ${m.vol30.toFixed(1)}%，波动分 ${volS}；40%–80% 为相对健康区间。`,
      Number.isFinite(m.maxDrawdown90)
        ? `90 日最大回撤约 ${m.maxDrawdown90.toFixed(1)}%，回撤分 ${mddS}；回撤越深说明此前的下行风险越大。`
        : '90 日回撤数据不足，回撤子项未计入。',
      Number.isFinite(m.atrPct)
        ? `ATR(14)/价格 约 ${m.atrPct.toFixed(2)}%，ATR 分 ${atrS}；2%–6% 属于加密常态波动。`
        : 'ATR 数据不足，ATR 子项未计入。',
      '子项权重：波动率 45% / 最大回撤 35% / ATR 20%。波动低不等于风险低，极端行情下历史波动会失效。',
    ],
  };
}

function scoreCryptoDerivatives(derivatives, meta) {
  const d = derivatives;
  if (!d || !Number.isFinite(d.funding)) {
    return { available: false, note: '暂无 U 本位合约数据', reasons: [] };
  }
  const fundS = cryptoFundingScore(d.funding);
  const cap = num(meta && meta.marketCap);
  const ratio = Number.isFinite(d.oiUsd) && Number.isFinite(cap) && cap > 0 ? (d.oiUsd / cap) * 100 : null;
  const oiS = Number.isFinite(ratio)
    ? band(ratio, [[25, 30], [15, 42], [8, 56], [4, 72], [1.5, 84], [0.5, 70]], 55)
    : null;
  const basisS = cryptoBasisScore(d.basisPct);
  let sum = 0;
  let w = 0;
  if (fundS !== null) { sum += fundS * 0.45; w += 0.45; }
  if (oiS !== null) { sum += oiS * 0.3; w += 0.3; }
  if (basisS !== null) { sum += basisS * 0.25; w += 0.25; }
  const reasons = [
    `当前 8h 资金费率 ${(d.funding * 100).toFixed(4)}%，费率分 ${fundS}；极端正费率代表多头拥挤，负费率代表空头拥挤（逆向情绪小幅加分）。`,
  ];
  if (Number.isFinite(ratio)) {
    reasons.push(`持仓量约 ${fmtUsdCompact(d.oiUsd)}，占市值 ${ratio.toFixed(2)}%，杠杆分 ${oiS}；1%–5% 相对健康，>15% 需警惕高杠杆清算风险。`);
  } else {
    reasons.push('市值或持仓量数据缺失，持仓量占市值子项未计入。');
  }
  if (Number.isFinite(d.basisPct)) {
    reasons.push(`标记价 ${fmtPrice(d.mark, 2)} / 指数价 ${fmtPrice(d.index, 2)}，基差 ${d.basisPct.toFixed(3)}%，基差分 ${basisS}。`);
  } else {
    reasons.push('基差数据缺失，基差子项未计入。');
  }
  reasons.push('子项权重：资金费率 45% / 持仓量÷市值 30% / 期现基差 25%。合约数据来自 Gate，仅覆盖有 U 本位合约的币种。');
  return {
    available: true,
    score: Math.round(w > 0 ? sum / w : 50),
    note: `费率 ${(d.funding * 100).toFixed(4)}%${Number.isFinite(ratio) ? ` · OI/市值 ${ratio.toFixed(1)}%` : ''}`,
    reasons,
  };
}

function scoreCryptoSentiment(fng, chainTvl) {
  const value = num(fng && fng.current);
  if (!Number.isFinite(value)) {
    return { available: false, note: '恐慌贪婪指数不可用', reasons: [] };
  }
  const fngS = clamp(100 - value, 0, 100);
  const tvlS = chainTvl && Number.isFinite(chainTvl.change30d)
    ? band(chainTvl.change30d, [[60, 94], [30, 88], [10, 78], [0, 64], [-15, 52], [-35, 36]], 22)
    : null;
  let sum = fngS * 0.6;
  let w = 0.6;
  if (tvlS !== null) {
    sum += tvlS * 0.4;
    w += 0.4;
  }
  const reasons = [
    `恐慌贪婪指数 ${Math.round(value)}（${fng.classification || '—'}），按逆向口径换算 ${Math.round(fngS)} 分；极度恐慌偏加分、极度贪婪偏扣分。`,
  ];
  if (tvlS !== null) {
    reasons.push(
      `主链 ${chainTvl.chain} TVL 约 ${fmtUsdCompact(chainTvl.current)}，30 日变化 ${fmtPct(chainTvl.change30d)}，生态分 ${tvlS}。`
    );
  } else {
    reasons.push('该币种没有可用的主链 TVL 映射，生态子项未计入，仅使用恐慌贪婪指数。');
  }
  reasons.push('子项权重：恐慌贪婪指数 60% / 主链 TVL 30 日变化 40%。情绪指标是逆向参考，不代表价格即将反转。');
  return {
    available: true,
    score: Math.round(sum / w),
    note: `F&G ${Math.round(value)} · ${fng.classification || '—'}${tvlS !== null ? ` · TVL ${fmtPct(chainTvl.change30d)}` : ''}`,
    reasons,
  };
}

function cryptoVerdict(score) {
  if (score >= 80) return { label: '强势', cls: 'strong', tone: 'gold', desc: '多维共振，趋势与流动性优势较突出' };
  if (score >= 65) return { label: '偏强', cls: 'bull', tone: 'teal', desc: '多数维度偏向积极，仍需关注波动与杠杆' };
  if (score >= 50) return { label: '中性', cls: 'neutral', tone: 'blue', desc: '多空与风险因素相对均衡' };
  if (score >= 35) return { label: '偏弱', cls: 'bear', tone: 'orange', desc: '部分维度存在压力，波动或流动性偏弱' };
  return { label: '弱势', cls: 'weak', tone: 'red', desc: '风险因素占主导，数据覆盖或流动性不足' };
}

/* 主入口：加密五维综合评分。覆盖惩罚 0.7 + 0.3 × 覆盖率 */
function computeCryptoScore({ quote, kline, btcKline, meta, derivatives, fng, chainTvl } = {}) {
  const results = {
    trend: scoreCryptoTrend(kline, btcKline),
    liquidity: scoreCryptoLiquidity(quote, meta),
    volatility: scoreCryptoVolatility(kline),
    derivatives: scoreCryptoDerivatives(derivatives, meta),
    sentiment: scoreCryptoSentiment(fng, chainTvl),
  };
  const dims = CRYPTO_DIM_META.map((m) => {
    const r = results[m.key];
    return {
      ...m,
      available: !!r.available && Number.isFinite(r.score),
      score: r.available && Number.isFinite(r.score) ? clamp(Math.round(r.score), 0, 100) : null,
      note: r.note || '数据不可用',
      reasons: r.reasons || [],
    };
  });
  const available = dims.filter((d) => d.available);
  const weightSum = available.reduce((a, d) => a + d.weight, 0);
  const cov = coverageMeta(weightSum);
  const coverage = cov.coverage;
  let total = null;
  if (weightSum > 0) {
    const weighted = available.reduce((a, d) => a + d.score * d.weight, 0) / weightSum;
    /* FR-18.4：与个股 / ETF 共用同一覆盖度折算 */
    total = clamp(Math.round(weighted * cov.factor), 0, 100);
  }
  const verdict = cryptoVerdict(total === null ? 0 : total);
  const sorted = available.slice().sort((a, b) => b.score - a.score);
  let desc = total === null ? '有效数据不足，暂不给出综合分。' : verdict.desc + '。';
  if (sorted.length >= 2) {
    desc += `最强项为${sorted[0].name}（${sorted[0].score}），最弱项为${sorted[sorted.length - 1].name}（${sorted[sorted.length - 1].score}）。`;
  }
  if (coverage < 100) desc += `当前权重覆盖 ${coverage}%，缺失维度已按覆盖度折算。`;
  return {
    total,
    verdict,
    dims,
    coverage,
    comparable: cov.comparable,
    availableCount: available.length,
    dimCount: dims.length,
    desc,
    missing: dims.filter((d) => !d.available).map((d) => d.short),
    createdAt: new Date(),
    kind: 'coin',
  };
}

/* ---------------- 展示格式 ---------------- */

function fmtUsdCompact(n) {
  if (!Number.isFinite(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e12) return `$${(n / 1e12).toFixed(2)}T`;
  if (abs >= 1e9) return `$${(n / 1e9).toFixed(2)}B`;
  if (abs >= 1e6) return `$${(n / 1e6).toFixed(2)}M`;
  if (abs >= 1e3) return `$${(n / 1e3).toFixed(2)}K`;
  return `$${n.toFixed(2)}`;
}

function fmtCryptoPrice(n) {
  if (!Number.isFinite(n)) return '—';
  if (n >= 1) return fmtPrice(n, 2);
  if (n >= 0.01) return n.toFixed(4);
  if (n >= 0.0001) return n.toFixed(6);
  return n.toFixed(8);
}

function fmtCryptoSupply(n, symbol = '') {
  if (!Number.isFinite(n)) return '—';
  const unit = n >= 1e9 ? `${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : fmtInt(n);
  return unit + (symbol ? ` ${symbol}` : '');
}

/* 别名只收中文名与 3 字母以上的英文词：两个字母的 CL / GC / SI 等继续按美股代码解析 */
const COMMODITY_ALIASES = {
  gold: ['黄金', '金价', '纽约黄金', '伦敦金', '现货黄金', 'comex黄金', 'gold', 'xau', 'xauusd'],
  silver: ['白银', '银价', '纽约白银', '伦敦银', '现货白银', 'comex白银', 'silver', 'xag', 'xagusd'],

  gas: ['天然气', '美国天然气', 'nymex天然气', '亨利港', 'natgas', 'naturalgas'],
};
const COMMODITY_ALIAS_MAP = new Map();
Object.keys(COMMODITY_ALIASES).forEach((key) => {
  COMMODITY_ALIASES[key].forEach((alias) => COMMODITY_ALIAS_MAP.set(alias.toLowerCase(), key));
});

function commodityByKey(key) {
  const k = String(key || '').trim().toLowerCase();
  if (!k) return null;
  return COMMODITY_BY_KEY.get(k) || COMMODITY_BY_CODE.get(k.toUpperCase()) || null;
}

function commodityFields(def) {
  return {
    market: 'COMMODITY',
    kind: 'commodity',
    code: def.key,
    rawCode: def.key,
    name: def.name,
    quoteKey: 'commodity:' + def.key,
    klineCode: 'commodity:' + def.key,
  };
}

function normalizeCommodityStock(input) {
  const s = typeof input === 'string' ? { key: input } : input || {};
  const def =
    commodityByKey(s.key) ||
    commodityByKey(s.code) ||
    commodityByKey(s.rawCode) ||
    (s.name ? commodityByKey(COMMODITY_ALIAS_MAP.get(String(s.name).trim().toLowerCase()) || '') : null);
  if (!def) return null;
  return Object.assign(commodityFields(def), { name: s.name || def.name });
}

/* 手输 / 搜索：只匹配别名表，避免劫持 CL、GC 等两字母美股代码 */
function commodityResolveQuery(query) {
  const raw = String(query || '').trim().toLowerCase();
  if (!raw) return null;
  const key = COMMODITY_ALIAS_MAP.get(raw);
  return key ? normalizeCommodityStock({ key }) : null;
}

function searchCommodities(query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return [];
  const out = [];
  const seen = new Set();
  COMMODITY_LIST.forEach((def) => {
    if (out.length >= 4) return;
    const aliases = COMMODITY_ALIASES[def.key] || [];
    const hit =
      def.key.startsWith(q) ||
      def.name.toLowerCase().includes(q) ||
      def.en.toLowerCase().includes(q) ||
      aliases.some((a) => a.toLowerCase().startsWith(q) || a.toLowerCase().includes(q));
    if (!hit || seen.has(def.key)) return;
    seen.add(def.key);
    out.push(normalizeCommodityStock({ key: def.key }));
  });
  return out;
}

/* ---------------- 行情 ---------------- */

function parseCommodityQuoteFields(def, f) {
  if (!def || !Array.isArray(f) || f.length < 14) return null;
  const price = num(f[0]);
  if (!Number.isFinite(price) || price <= 0) return null;
  const prevClose = num(f[7]);
  const change = Number.isFinite(prevClose) ? price - prevClose : null;
  const date = String(f[12] || '');
  const clock = String(f[6] || '');
  return Object.assign(commodityFields(def), {
    price,
    change,
    changePct: num(f[1]),
    prevClose,
    open: num(f[8]),
    high: num(f[4]),
    low: num(f[5]),
    date,
    quoteTime: clock,
    time: [date, clock].filter(Boolean).join(' '),
    currency: 'USD',
    unit: def.unit,
    digits: def.digits,
    group: def.group,
    contract: def.contract,
    secid: def.secid,
    tencentCode: def.tencent,
    source: '腾讯财经',
  });
}

function parseCommoditySpot(def, f) {
  if (!def || !def.spot || !Array.isArray(f)) return null;
  const price = num(f[0]);
  if (!Number.isFinite(price) || price <= 0) return null;
  return {
    code: def.spot,
    name: String(f[13] || ''),
    price,
    changePct: num(f[1]),
    date: String(f[12] || ''),
    time: String(f[6] || ''),
  };
}

async function fetchCommodityQuoteMap() {
  const keys = COMMODITY_LIST.map((c) => c.tencent).concat(['hf_XAU', 'hf_XAG']);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(API.quote + keys.join(','), { signal: ctrl.signal, cache: 'no-store' });
    if (!res.ok) throw new Error(`商品行情 HTTP ${res.status}`);
    const text = decodeGBK(await res.arrayBuffer());
    const map = new Map();
    const re = /v_([^=]+)="([^"]*)"/g;
    let m;
    while ((m = re.exec(text))) map.set(m[1], m[2].split(','));
    if (!map.size) throw new Error('商品行情数据为空');
    return map;
  } finally {
    clearTimeout(timer);
  }
}

function commodityBoardRows(map) {
  return COMMODITY_LIST.map((def) => {
    const quote = parseCommodityQuoteFields(def, map.get(def.tencent));
    if (!quote) return Object.assign(commodityFields(def), { price: null, changePct: null, unit: def.unit });
    quote.spot = parseCommoditySpot(def, map.get(def.spot));
    return quote;
  });
}

function getCommodityBoard(force = false) {
  return cached('commodity:board', COMMODITY_TTL.board, async () => commodityBoardRows(await fetchCommodityQuoteMap()), force);
}

function getCommodityQuote(stock, force = false) {
  const def = commodityByKey(stock && (stock.code || stock.rawCode));
  if (!def) return Promise.reject(new Error('未知的大宗商品品种'));
  return getCommodityBoard(force).then((rows) => {
    const hit = rows.find((r) => r && r.code === def.key);
    if (!hit || !Number.isFinite(hit.price)) throw new Error('商品行情数据为空');
    return hit;
  });
}

/* ---------------- K 线 ---------------- */

function getCommodityKline(stock, period = 'day') {
  const def = commodityByKey(stock && (stock.code || stock.rawCode));
  if (!def) return Promise.reject(new Error('未知的大宗商品品种'));
  const p = normalizeKlinePeriod(period);
  const count = KLINE_COUNT[p] || 320;
  return cached(`commodity:kline:${p}:${def.secid}`, klineTtl(p), async () => {
    const params = new URLSearchParams({
      secid: def.secid,
      fields1: 'f1,f2,f3,f4,f5,f6',
      fields2: 'f51,f52,f53,f54,f55,f56',
      klt: String(EM_KLT[p]),
      /* 商品无复权概念，传 1 与东财默认口径一致，页面不展示「前复权」字样 */
      fqt: '1',
      beg: emBegDate(p),
      end: '20500101',
      lmt: String(count),
    });
    const data = await emJsonp(`${API.emKline}?${params}`);
    const lines = data && data.data && data.data.klines;
    if (!Array.isArray(lines) || !lines.length) throw new Error('商品 K 线数据暂不可用');
    const points = parseEmKlines(lines.slice(-count));
    if (points.length < 5) throw new Error('商品 K 线数据不足');
    return {
      key: 'commodity:' + def.secid,
      period: p,
      points,
      metrics: p === 'day' ? klineMetrics(points) : null,
      source: '东方财富',
    };
  });
}

/* 榜单 UI 元信息：body/time 容器与可读名称（FR-15） */
const BOARD_UI = {
  hot: { body: '#hotBoardBody', time: '#hotBoardTime', label: '成交热门榜' },
  inflow: { body: '#inflowBoardBody', time: '#inflowBoardTime', label: '主力净流入榜' },

  commodity: { body: '#commodityBoardBody', time: '#commodityBoardTime', label: '大宗商品行情' },
};
const BOARD_LOADING = { hot: false, inflow: false, etf: false, crypto: false, commodity: false };
const BOARD_LAST_OK = {}; /* kind → 最近一次成功更新的毫秒时间戳（用于失败时提示） */

/* 更新时间与刷新按钮的加载/成功/失败态 */
function setBoardStatus(kind, status, at) {
  const meta = BOARD_UI[kind];
  if (!meta) return;
  const timeEl = $(meta.time);
  if (timeEl) {
    timeEl.classList.toggle('error', status === 'error');
    if (status === 'loading') {
      timeEl.textContent = '更新中…';
      timeEl.removeAttribute('title');
    } else if (status === 'error') {
      const last = BOARD_LAST_OK[kind];
      timeEl.textContent = last ? `更新失败 · 上次 ${fmtClock(last)}` : '更新失败';
      if (last) timeEl.title = '上次成功更新 ' + fmtClock(last, true);
      else timeEl.removeAttribute('title');
    } else {
      const ts = Number.isFinite(Number(at)) ? Number(at) : Date.now();
      BOARD_LAST_OK[kind] = ts;
      timeEl.textContent = '最后更新 ' + fmtClock(ts);
      timeEl.title = '最后成功更新 ' + fmtClock(ts, true);
    }
  }
  const btn = document.querySelector(`.board-refresh[data-board="${kind}"]`);
  if (btn) {
    const loading = status === 'loading';
    btn.disabled = loading;
    btn.classList.toggle('loading', loading);
    btn.setAttribute('aria-busy', loading ? 'true' : 'false');
  }
}

async function loadRankBoard(kind, force = false) {
  const body = $(BOARD_UI[kind].body);
  if (!body) return; /* 用户已离开首页 */
  setBoardStatus(kind, 'loading');
  try {
    const rows =
      kind === 'inflow'
        ? await getInflowBoard(HOTLIST_SIZE, force)
        : await getHotBoard(HOTLIST_SIZE, force);
    if (!body.isConnected) return;
    if (!rows.length) throw new Error('empty');
    body.innerHTML = rows.map((s, i) => boardRowHTML(s, i, kind)).join('');
    body.dataset.loaded = '1';
    setBoardStatus(kind, 'ok', Date.now());
  } catch (e) {
    if (!body.isConnected) return;
    /* 手动刷新失败时保留上一次成功列表，只标记时间失败 */
    if (!(force && body.dataset.loaded === '1')) body.innerHTML = boardEmptyHTML(kind);
    setBoardStatus(kind, 'error');
  }
}

function loadHomeBoards(force = false) {
  return Promise.all([loadRankBoard('hot', force), loadRankBoard('inflow', force)]);
}

async function refreshHomeBoard(kind) {
  if (!BOARD_UI[kind] || BOARD_LOADING[kind]) return;
  BOARD_LOADING[kind] = true;
  try {
    if (kind === 'hot' || kind === 'inflow') await loadRankBoard(kind, true);
    else if (kind === 'etf') await loadEtfBoard(true);
    else if (kind === 'crypto') await loadCryptoBoard(true);
    else if (kind === 'commodity') await loadCommodityBoard(true);
  } finally {
    BOARD_LOADING[kind] = false;
  }
}

  const stocks = list.filter((s) => s.market !== 'CRYPTO');
  const coins = list.filter((s) => s.market === 'CRYPTO');
  if (stocks.length) {
    const keys = stocks.map((s) => s.quoteKey).filter(Boolean);
    try {
      const map = await getQuoteBatch(keys);
      stocks.forEach((s) => {
        const q = map.get(s.quoteKey);
        if (!q) return;
        $$(`[data-wq="${s.quoteKey}"]`).forEach((el) => {
          const cls = pctClass(q.changePct);
          el.innerHTML = `<b class="${cls}">${fmtPrice(q.price, q.price < 10 ? 3 : 2)}</b><span class="${cls}">${fmtPct(
            q.changePct
          )}</span>`;
        });
      });
    } catch (e) {
      /* FR-6.5：失败显示占位，不阻塞其他标的 */
      keys.forEach((key) => {
        $$(`[data-wq="${key}"]`).forEach((el) => {
          el.textContent = '—';
        });
      });
    }
  }
  coins.forEach(async (s) => {
    try {
      const q = await getCryptoQuote(s);
      $$(`[data-wq="${s.quoteKey}"]`).forEach((el) => {
        const cls = pctClass(q.changePct);
        el.innerHTML = `<b class="${cls}">${fmtCryptoPrice(q.price)}</b><span class="${cls}">${fmtPct(q.changePct)}</span>`;
      });
    } catch (e) {
      $$(`[data-wq="${s.quoteKey}"]`).forEach((el) => {
        el.textContent = '—';
      });
    }
  });
}

/* 热门股行情：复用批量接口一次拉取（与自选股一致），并回填内存缓存保持 getQuote 口径一致 */
async function loadHotQuotes() {
  const keys = HOT_STOCKS.map((s) => s.quoteKey).filter(Boolean);
  if (!keys.length) return;
  try {
    const map = await getQuoteBatch(keys);
    keys.forEach((key) => {
      const q = map.get(key);
      if (!q) return;
      memCache.set('quote:' + key, { t: Date.now(), d: q });
      $$(`[data-chg="${key}"]`).forEach((el) => {
        el.textContent = fmtPct(q.changePct);
        el.classList.remove('up', 'down', 'flat');
        el.classList.add(pctClass(q.changePct));
      });
    });
  } catch (e) {
    /* 首页热门行情失败不影响主流程 */
  }
}

  if (sub === 'kdj') return `<span class="kline-legend" aria-hidden="true"><i class="a"></i>K<i class="b"></i>D<i class="c"></i>J</span>`;
  if (sub === 'rsi') return `<span class="kline-legend" aria-hidden="true"><i class="a"></i>RSI6<i class="b"></i>RSI12</span>`;
  if (sub === 'volume') return `<span class="kline-legend" aria-hidden="true"><i class="vol"></i>成交量</span>`;
  return '';

/* FR-5.1：从研报数据提取目标价 高/中/低 三档锚点 */
function targetAnchors() {
  const list = Array.isArray(state.reports)
    ? state.reports.map((r) => num(r.target)).filter((v) => Number.isFinite(v) && v > 0)
    : [];
  if (!list.length) return null;
  const sorted = [...list].sort((a, b) => a - b);
  return {
    low: sorted[0],
    mid: sorted[Math.floor((sorted.length - 1) / 2)],
    high: sorted[sorted.length - 1],
    count: list.length,
  };
}

function renderChartSection(kline) {
  /* 指标事实区始终基于日线数据（周/月线仅用于蜡烛展示） */
  const dayK = (state.periodKlines && state.periodKlines.day) || (state.core && state.core.kline) || null;
  const m = dayK && dayK.metrics;
  const pts = kline.points;
  const period = kline.period || 'day';
  const intraday = isIntradayPeriod(period);
  const periodLabel = KLINE_PERIOD_META[period] || '日K';
  const first = pts[0];
  const last = pts[pts.length - 1];
  /* FR-3.6：蜡烛渲染条件不满足时降级为原有 sparkline */
  const anchors = targetAnchors();
  const chartKey = `${(state.stock && state.stock.market) || 'X'}_${(state.stock && state.stock.code) || 'x'}_${period}`;
  const isCoin = !!(state.stock && (state.stock.kind === 'coin' || state.stock.market === 'CRYPTO'));
  const isCommodity = !!(state.stock && (state.stock.kind === 'commodity' || state.stock.market === 'COMMODITY'));
  const isEtf = !!(state.stock && (state.stock.kind === 'etf' || isEtfCode(state.stock.code || '')));
  const adjusted = !isCoin && !isEtf && !isCommodity;
  const candles = renderCandlestick(pts, {
    key: chartKey,
    period,
    window: KLINE_WINDOW[period] || 240,
    sub: state.subChart || 'volume',
    boll: !!state.bollOn,
    targets: anchors,
  });
  const chartBody = candles
    ? `<div class="kline-wrap">${candles}</div>`
    : `<div class="spark-wrap">${renderSparkline(pts)}</div>`;
  const facts = m
    ? `<div class="chart-facts">
    <div class="chart-fact"><label>近 20 日</label><strong class="${pctClass(m.r20)}">${fmtPct(m.r20)}</strong></div>
    <div class="chart-fact"><label>近 60 日</label><strong class="${pctClass(m.r60)}">${fmtPct(m.r60)}</strong></div>
    <div class="chart-fact"><label>近 120 日</label><strong class="${pctClass(m.r120)}">${fmtPct(m.r120)}</strong></div>
    <div class="chart-fact"><label>最大回撤</label><strong class="down">${fmtPct(m.maxDrawdown)}</strong></div>
    <div class="chart-fact"><label>均线形态</label><strong>${esc(m.trend)}</strong></div>
    <div class="chart-fact"><label>年化波动</label><strong>${ratioText(m.volatility)}</strong></div>
    <div class="chart-fact"><label>区间位置</label><strong>${fmtPrice(m.last)}</strong></div>
  </div>`
    : '';
  return `<article class="card chart-card">
    <div>
      <div class="chart-head"><strong>${isCoin || isCommodity ? '价格 K 线' : '股价 K 线'}</strong>${chartPeriodTabs()}${chartZoomControls(pts.length)}
        <span class="kline-legend" aria-hidden="true"><i class="ma20"></i>MA20<i class="ma60"></i>MA60</span>
        <span class="kline-meta" data-role="kline-range">${esc(fmtDate(first.date, intraday))} — ${esc(fmtDate(last.date, intraday))} · ${pts.length} 根</span>
        <span class="kline-meta">${adjusted ? '前复权 · ' : ''}${periodLabel}${isCoin ? ' · UTC' : ''}</span></div>
      ${chartSubControls(pts.length)}
      ${anchors ? '<span class="kline-note">目标价为研报发布口径，前复权 K 线在最新交易日与实际价格基本一致</span>' : ''}
      ${chartBody}
    </div>
    ${facts}
  </article>`;
}

/* ---------------- reports ---------------- */
function reportItemHTML(r, showStock = false) {
  const title = r.pdf
    ? `<a href="${esc(r.pdf)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`
    : esc(r.title);
  const meta = [];
  if (r.org) meta.push(`<span class="org">${esc(r.org)}</span>`);
  if (showStock && r.stockName) meta.push(`<span>覆盖 ${esc(r.stockName)}</span>`);
  if (r.analyst) meta.push(`<span class="analyst">${esc(r.analyst)}</span>`);
  if (Number.isFinite(r.eps)) meta.push(`<span>预测 EPS ${fmtPrice(r.eps, 2)}</span>`);
  if (Number.isFinite(r.pe)) meta.push(`<span>预测 PE ${fmtPrice(r.pe, 1)}</span>`);
  if (Number.isFinite(r.target)) meta.push(`<span class="target">目标价 ${fmtPrice(r.target)}</span>`);
  const days = daysSince(r.rawDate);
  return `<div class="report-item" data-search="${esc(
    `${r.title} ${r.org} ${r.analyst} ${r.rating} ${r.stockName}`.toLowerCase()
  )}">
    <div class="report-date"><b>${esc(r.date)}</b><span>${days !== null && days >= 0 ? `${days} 天前` : ''}</span></div>
    <div class="report-main">
      <div class="report-title">${title}</div>
      <div class="report-meta">${meta.join('<span class="dot"></span>')}</div>
    </div>
    <div class="report-side">
      ${r.rating ? `<span class="rating-badge ${r.ratingCls}">${esc(r.ratingLabel)}</span>` : ''}
      ${
        r.pdf
          ? `<a class="pdf-link" href="${esc(r.pdf)}" target="_blank" rel="noopener noreferrer">${ico(
              'file',
              'sm'
            )}PDF${r.pages ? ' ' + r.pages + '页' : ''}</a>`
          : ''
      }
    </div>
  </div>`;
}

  const yi = n / 1e8;
  if (currency === 'HKD') return fmtBig(yi) + '港元';
  if (currency === 'USD') return fmtBig(yi) + '美元';
  return fmtBig(yi) + '元';
}

function updateFilter(input) {

/* ===== js/32-render-technical.js ===== */
/* ============================================================
   Technical module renderer — 独立技术研判章节
   展示五维度信号矩阵、综合研判与各维度可解释依据。
   ============================================================ */
'use strict';

function techSignalBadge(dim) {
  const meta = SIGNAL_META[dim.dir] || SIGNAL_META.unavailable;
  return `<span class="tech-sig ${meta.cls}">${ico(dim.dir === 'bullish' ? 'trendUp' : dim.dir === 'bearish' ? 'trendDown' : 'info', 'sm')}${meta.label}</span>`;
}

/* 五维信号雷达：复用现有 radarPoints 思路，按维度方向映射为 0-100 的强度 */
function techRadarSVG(dims) {
  const usable = dims.filter((d) => d.available);
  if (usable.length < 3) return '';
  const cx = 118, cy = 108, r = 74;
  const vals = dims.map((d) => (d.available ? d.score : 0));
  const angle = (i) => (Math.PI * 2 * i) / dims.length - Math.PI / 2;
  const rings = [25, 50, 75, 100]
    .map((level) => `<polygon class="tech-radar-grid" points="${radarPoints(cx, cy, r, dims.map(() => level))}"></polygon>`)
    .join('');
  const axes = dims
    .map((_, i) => `<line class="tech-radar-axis" x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(angle(i)) * r).toFixed(1)}" y2="${(cy + Math.sin(angle(i)) * r).toFixed(1)}"></line>`)
    .join('');
  const consensusDir = signalDir(usable.reduce((a, d) => a + d.score, 0) / usable.length);
  const area = `<polygon class="tech-radar-area ${SIGNAL_META[consensusDir].cls}" points="${radarPoints(cx, cy, r, vals)}"></polygon>`;
  const dots = dims.map((d, i) => {
    const rr = r * (clamp(vals[i], 0, 100) / 100);
    return `<circle class="tech-radar-dot" cx="${(cx + Math.cos(angle(i)) * rr).toFixed(1)}" cy="${(cy + Math.sin(angle(i)) * rr).toFixed(1)}" r="2.8"></circle>`;
  }).join('');
  const labels = dims.map((d, i) => {
    const x = cx + Math.cos(angle(i)) * (r + 16);
    const y = cy + Math.sin(angle(i)) * (r + 14);
    const anchor = Math.abs(Math.cos(angle(i))) < 0.1 ? 'middle' : Math.cos(angle(i)) > 0 ? 'start' : 'end';
    return `<text class="tech-radar-label" x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="${anchor}">${esc(d.short)}</text>`;
  }).join('');
  return `<div class="tech-radar-wrap"><svg viewBox="0 0 236 226" role="img" aria-label="五维技术信号雷达图">${rings}${axes}${area}${dots}${labels}</svg></div>`;
}

/* 综合研判卡：得分环 + 结论 + 分歧提示 */
function techConsensusCard(result) {
  const c = result.consensus;
  if (!c.available) {
    return `<article class="card tech-consensus">
      <div class="card-kicker">${ico('pulse')}技术综合研判</div>
      <div class="tech-consensus-empty">${esc(c.summary)}</div>
    </article>`;
  }
  const meta = SIGNAL_META[c.dir];
  const usable = result.dims.filter((d) => d.available);
  const bulls = usable.filter((d) => d.dir === 'bullish').length;
  const bears = usable.filter((d) => d.dir === 'bearish').length;
  const neutrals = usable.length - bulls - bears;
  return `<article class="card tech-consensus">
    <div class="card-kicker">${ico('pulse')}技术综合研判 <span class="tech-source">基于 ${result.rows} 根日 K · 前复权</span></div>
    <div class="tech-consensus-main">
      <div class="tech-score-ring ${meta.cls}">
        <svg viewBox="0 0 132 132" role="img" aria-label="技术综合信号 ${c.score} 分">
          <circle class="tech-ring-track" cx="66" cy="66" r="55"></circle>
          <circle class="tech-ring-fill" cx="66" cy="66" r="55"
            stroke-dasharray="${((c.score / 100) * 2 * Math.PI * 55).toFixed(1)} ${(2 * Math.PI * 55).toFixed(1)}"></circle>
        </svg>
        <div class="tech-score-inner"><strong>${c.score}</strong><span>${esc(c.label)}</span></div>
      </div>
      <div class="tech-consensus-text">
        <p>${esc(c.summary)}</p>
        <div class="tech-votes">
          <span class="bullish">偏多 ${bulls}</span>
          <span class="neutral">中性 ${neutrals}</span>
          <span class="bearish">偏空 ${bears}</span>
          <span class="muted">可用 ${usable.length}/${result.dims.length}</span>
        </div>
        <div class="tech-divergence ${c.divergence >= 2 ? 'warn' : ''}">
          ${ico(c.divergence >= 2 ? 'alert' : 'shield', 'sm')}
          ${c.divergence >= 2 ? `维度分歧度 ${c.divergence}，信号一致性较弱，请谨慎解读` : '维度信号一致性较好'}
        </div>
      </div>
    </div>
  </article>`;
}

/* 单维度详细卡片 */
function techDimCard(dim) {
  const head = `<div class="tech-dim-head">
    <span class="tech-dim-icon">${ico(dim.icon)}</span>
    <div class="tech-dim-title"><h4>${esc(dim.name)}</h4><p>${esc(dim.desc)}</p></div>
    ${dim.available ? `<div class="tech-dim-score ${SIGNAL_META[dim.dir].cls}"><b>${dim.score}</b><small>/100</small></div>` : ''}
  </div>`;
  if (!dim.available) {
    return `<article class="card tech-dim unavailable">
      ${head}
      <p class="tech-unavailable">${esc(dim.reason || '数据不足，本维度不计入研判')}</p>
    </article>`;
  }
  const details = (dim.details || [])
    .map((line) => `<li>${esc(line)}</li>`)
    .join('');
  return `<article class="card tech-dim ${SIGNAL_META[dim.dir].cls}">
    ${head}
    <div class="tech-dim-signal">${techSignalBadge(dim)}<span>${esc(dim.note || '')}</span></div>
    <ul class="tech-details">${details}</ul>
  </article>`;
}

/* 更新已渲染章节（K 线到达后异步调用） */
function updateTechnicalSection(result) {

  slot.innerHTML = renderTechnicalSectionInner(result);

/* 渲染 section 内部：综合卡 + 雷达 + 五维详情 */
function renderTechnicalSectionInner(result) {
  const isCommodity = !!(state.stock && (state.stock.kind === 'commodity' || state.stock.market === 'COMMODITY'));
  if (!result) {
    return emptyState({
      icon: 'chart',
      title: '技术数据暂不可用',
      desc: isCommodity
        ? '历史 K 线数据不足，无法生成技术研判。商品行情与价格 K 线不受影响。'
        : '历史 K 线数据不足，无法生成技术研判。行情、研报与新闻等其他模块不受影响。',
    });
  }
  return `${techConsensusCard(result)}
    <div class="tech-overview-grid">
      ${techRadarSVG(result.dims) ? `<article class="card tech-radar-card"><div class="card-kicker">${ico('target')}信号雷达</div>${techRadarSVG(result.dims)}</article>` : ''}
      <article class="card tech-summary-card">
        <div class="card-kicker">${ico('spark')}研判说明</div>
        <ul class="tech-summary-list">
          ${result.dims.map((d) => `<li><span class="tech-sum-dot ${SIGNAL_META[d.dir].cls}"></span><b>${esc(d.short)}</b>${d.available ? `${esc(SIGNAL_META[d.dir].label)} · ${d.score} 分` : '数据不足'}</li>`).join('')}
        </ul>
        <p class="tech-note">五维度等权合成综合信号；数据不足的维度自动剔除。技术指标基于历史价格的机械化计算，存在滞后与钝化可能，不构成买卖建议。</p>

    <div class="source-note" style="margin-top:12px">计算口径：MA(5/10/20/60) · MACD(12,26,9) · RSI(6,12) · KDJ(9,3,3) · BOLL(20,2) · OBV · 量比(5/20)。全部基于${isCommodity ? '商品连续合约日 K' : '前复权日 K'}本地计算，无额外网络请求。</div>`;

/* 单只候选股的一行 */
function screenerRowHTML(row, threshold) {
  const stock = row.stock || {};
  const quote = row.quote || {};
  const score = row.score || {};
  const total = Number.isFinite(score.total) ? score.total : null;
  const hit = total !== null && total >= threshold;
  const verdict = total !== null ? verdictFor(total) : { label: '数据不足', cls: 'muted' };
  const cls = hit ? 'hit' : total !== null ? 'miss' : 'nodata';
  const dims = Array.isArray(score.dims) ? score.dims : [];
  const dimCells = dims
    .map(
      (d) => `
      <div class="sd-cell" title="${esc(d.name)}${d.available ? `：${d.score} 分（${esc(d.note || '')}）` : '：数据不足'}">
        <span class="sd-label">${esc(d.short)}</span>
        <span class="sd-bar"><i class="${d.available ? scoreColorClass(d.score) : 'muted'}" style="width:${
          d.available ? clamp(d.score, 0, 100) : 0
        }%"></i></span>
        <span class="sd-num ${d.available ? '' : 'muted'}">${d.available ? d.score : '—'}</span>
      </div>`
    )
    .join('');
  return `
  <tr class="screener-row ${cls}" ${stockDataset(stock)}>
    <td class="sr-rank"><span class="rank-num ${hit ? 'gold' : ''}">${row.rank || '—'}</span>${hit ? '<span class="hit-mark">达标</span>' : ''}</td>
    <td class="sr-name">
      ${stockButton(stock, 'sr-stock-btn')}
      <span class="sr-meta">${esc(stock.code)} · ${esc(stock.name)}</span>
    </td>
    <td class="sr-price">
      <b class="${pctClass(quote.changePct)}">${fmtPrice(quote.price)}</b>
      <span class="${pctClass(quote.changePct)}">${fmtPct(quote.changePct)}</span>
    </td>
    <td class="sr-score">
      <div class="sr-score-num ${scoreColorClass(total)}">${total === null ? '—' : total}</div>
      <span class="verdict-pill ${verdict.cls}">${esc(verdict.label)}</span>
    </td>
    <td class="sr-dims">${dimCells || '<span class="muted">—</span>'}</td>
    <td class="sr-cover"><span class="badge ${score.coverage === 100 ? 'teal' : ''}" title="${score.coverage === 100 ? '权重覆盖 100%' : `权重覆盖 ${score.coverage}% · 综合分已按覆盖度折算，不宜横向比较`}">${Number.isFinite(score.coverage) ? score.coverage + '%' : '—'}</span></td>
    <td class="sr-action"><button class="btn sm" type="button" data-action="screener-open">查看研判 ${ico('arrow', 'sm')}</button></td>
  </tr>`;
}

/* 汇总 + 全榜（达标高亮 + 未达标降序保留） */
function screenerResultsHTML(rows, threshold, meta = {}) {
  const list = rankScreenerRows(rows);
  const hits = filterScreenerRows(list, threshold);
  const scored = list.filter((r) => r && r.score && Number.isFinite(r.score.total));
  const best = scored.length ? scored[0].score.total : null;
  const avg = scored.length
    ? Math.round(scored.reduce((a, r) => a + r.score.total, 0) / scored.length)
    : null;
  const ranAt = meta.ranAt ? fmtDate(meta.ranAt, true) : '';
  const stopped = meta.stopped ? '<span class="badge orange">已停止</span>' : '';
  const summary = `
    <div class="screener-summary">
      <div class="ss-card"><span>扫描标的</span><b>${scored.length}</b><small>只${meta.candidates ? ` / 候选 ${meta.candidates}` : ''}</small></div>
      <div class="ss-card gold"><span>达标 (≥${threshold})</span><b>${hits.length}</b><small>只</small></div>
      <div class="ss-card teal"><span>最高分</span><b>${best === null ? '—' : best}</b><small>${best === null ? '' : esc(verdictFor(best).label)}</small></div>
      <div class="ss-card"><span>平均分</span><b>${avg === null ? '—' : avg}</b><small>全体候选</small></div>
    </div>`;
  const notice = hits.length
    ? `<div class="screener-notice ok">${ico('check', 'sm')}当前门槛 ${threshold} 分，共 <b>${hits.length}</b> 只达标，已置顶高亮；下方保留全榜便于对照。</div>`
    : `<div class="screener-notice warn">${ico('info', 'sm')}当前门槛 ${threshold} 分下暂无达标标的，最高分为 <b>${best === null ? '—' : best}</b>。可下调左侧门槛查看接近达标的股票。</div>`;
  if (!list.length) {
    return `${summary}<div class="card screener-empty">${emptyState({
      icon: 'alert',
      title: '未能完成扫描',
      desc: (meta.error || '热门榜单或行情接口暂不可用，请稍后重试。'),
    })}</div>`;
  }
  return `
    ${summary}
    <div class="screener-meta">${ico('clock', 'sm')}更新于 ${esc(ranAt)} · 门槛 ${threshold} 分${stopped}</div>
    ${notice}
    <div class="card screener-table-card">
      <div class="screener-table-scroll">
        <table class="screener-table">
          <thead><tr>
            <th>#</th><th>股票</th><th>现价 / 涨跌</th><th>综合分</th>
            <th>四维分（研报 / 盈利 / 技术 / 舆情）</th><th>覆盖</th><th></th>
          </tr></thead>
          <tbody>${list.map((r) => screenerRowHTML(r, threshold)).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

/* 更新进度条与文字 */
function updateScreenerProgress(done, total, row) {
  const s = state.screener;
  const bar = $('#screenerProgressBar');
  const text = $('#screenerProgressText');
  const wrap = $('#screenerProgress');
  if (wrap) wrap.hidden = false;
  if (bar) bar.style.width = `${Math.round((done / Math.max(total, 1)) * 100)}%`;
  s.progressPct = Math.round((done / Math.max(total, 1)) * 100);
  s.progressText = `已完成 ${done} / ${total} 只${row && row.stock ? ` · 最近：${row.stock.name}` : ''}`;
  if (text) text.textContent = s.progressText;
}

/* 仅更新结果区（扫描过程中增量刷新 / 阈值变更后重绘） */
function refreshScreenerResult() {
  const box = $('#screenerResult');
  if (!box) return;
  const s = state.screener;
  box.innerHTML = s.rows.length
    ? screenerResultsHTML(s.rows, s.threshold, { ranAt: s.ranAt, stopped: s.stopped, error: s.error })
    : loadingCard('正在获取候选池与行情…', 4);
  hydrateIcons(box);
}

/* 更新门槛：只重绘结果，不重复请求 */
function updateScreenerThreshold(value) {
  const v = clamp(Math.round(Number(value) || SCREENER_DEFAULT_THRESHOLD), 60, 95);
  state.screener.threshold = v;
  const label = $('#screenerThresholdVal');
  if (label) label.textContent = String(v);
  if (state.screener.rows.length) refreshScreenerResult();
}

  if (!(quote.prevClose > 0) || !Number.isFinite(quote.high) || !Number.isFinite(quote.low)) return '—';

}

/* 单只 ETF 候选的一行 */
function etfScreenerRowHTML(row, threshold) {
  const stock = row.stock || {};
  const quote = row.quote || {};
  const score = row.score || {};
  const total = Number.isFinite(score.total) ? score.total : null;
  const hit = total !== null && total >= threshold;
  const verdict = total !== null ? verdictFor(total) : { label: '数据不足', cls: 'muted' };
  const cls = hit ? 'hit' : total !== null ? 'miss' : 'nodata';
  const dims = Array.isArray(score.dims) ? score.dims : [];
  const dimCells = dims
    .map(
      (d) => `
      <div class="sd-cell" title="${esc(d.name)}${d.available ? `：${d.score} 分（${esc(d.note || '')}）` : '：数据不足'}">
        <span class="sd-label">${esc(d.short)}</span>
        <span class="sd-bar"><i class="${d.available ? scoreColorClass(d.score) : 'muted'}" style="width:${
          d.available ? clamp(d.score, 0, 100) : 0
        }%"></i></span>
        <span class="sd-num ${d.available ? '' : 'muted'}">${d.available ? d.score : '—'}</span>
      </div>`
    )
    .join('');
  const cap = num(row.boardMeta && row.boardMeta.marketCap);
  const capText = Number.isFinite(cap) ? (cap >= 1e8 ? (cap / 1e8).toFixed(1) + '亿' : (cap / 1e4).toFixed(0) + '万') : '—';
  return `
  <tr class="screener-row ${cls}" ${stockDataset(stock)}>
    <td class="sr-rank"><span class="rank-num ${hit ? 'gold' : ''}">${row.rank || '—'}</span>${hit ? '<span class="hit-mark">达标</span>' : ''}</td>
    <td class="sr-name">
      ${stockButton(stock, 'sr-stock-btn')}
      <span class="sr-meta">${esc(stock.code)} · ETF · ${esc(capText)}</span>
    </td>
    <td class="sr-price">
      <b class="${pctClass(quote.changePct)}">${fmtPrice(quote.price, quote.price < 10 ? 3 : 2)}</b>
      <span class="${pctClass(quote.changePct)}">${fmtPct(quote.changePct)}</span>
    </td>
    <td class="sr-score">
      <div class="sr-score-num ${scoreColorClass(total)}">${total === null ? '—' : total}</div>
      <span class="verdict-pill ${verdict.cls}">${esc(verdict.label)}</span>
    </td>
    <td class="sr-dims">${dimCells || '<span class="muted">—</span>'}</td>
    <td class="sr-cover"><span class="badge ${score.coverage === 100 ? 'teal' : ''}" title="${score.coverage === 100 ? '权重覆盖 100%' : `权重覆盖 ${score.coverage}% · 综合分已按覆盖度折算，不宜横向比较`}">${Number.isFinite(score.coverage) ? score.coverage + '%' : '—'}</span></td>
    <td class="sr-action"><button class="btn sm" type="button" data-action="etf-screener-open">查看研判 ${ico('arrow', 'sm')}</button></td>
  </tr>`;
}

/* 汇总 + 全榜（达标高亮 + 未达标降序保留） */
function etfScreenerResultsHTML(rows, threshold, meta = {}) {
  const list = rankScreenerRows(rows);
  const hits = filterScreenerRows(list, threshold);
  const scored = list.filter((r) => r && r.score && Number.isFinite(r.score.total));
  const best = scored.length ? scored[0].score.total : null;
  const avg = scored.length
    ? Math.round(scored.reduce((a, r) => a + r.score.total, 0) / scored.length)
    : null;
  const ranAt = meta.ranAt ? fmtDate(meta.ranAt, true) : '';
  const stopped = meta.stopped ? '<span class="badge orange">已停止</span>' : '';
  const summary = `
    <div class="screener-summary">
      <div class="ss-card"><span>扫描标的</span><b>${scored.length}</b><small>只${meta.candidates ? ` / 候选 ${meta.candidates}` : ''}</small></div>
      <div class="ss-card gold"><span>达标 (≥${threshold})</span><b>${hits.length}</b><small>只</small></div>
      <div class="ss-card teal"><span>最高分</span><b>${best === null ? '—' : best}</b><small>${best === null ? '' : esc(verdictFor(best).label)}</small></div>
      <div class="ss-card"><span>平均分</span><b>${avg === null ? '—' : avg}</b><small>全体候选</small></div>
    </div>`;
  const notice = hits.length
    ? `<div class="screener-notice ok">${ico('check', 'sm')}当前门槛 ${threshold} 分，共 <b>${hits.length}</b> 只 ETF 达标，已置顶高亮；下方保留全榜便于对照。</div>`
    : `<div class="screener-notice warn">${ico('info', 'sm')}当前门槛 ${threshold} 分下暂无达标 ETF，最高分为 <b>${best === null ? '—' : best}</b>。可下调门槛查看接近达标的标的，或按 ETF 榜单直接进入五维研判。</div>`;
  if (!list.length) {
    return `${summary}<div class="card screener-empty">${emptyState({
      icon: 'alert',
      title: '未能完成扫描',
      desc: meta.error || 'ETF 榜单或行情接口暂不可用，请稍后重试。',
    })}</div>`;
  }
  return `
    ${summary}
    <div class="screener-meta">${ico('clock', 'sm')}更新于 ${esc(ranAt)} · 门槛 ${threshold} 分${stopped}</div>
    ${notice}
    <div class="card screener-table-card">
      <div class="screener-table-scroll">
        <table class="screener-table etf-screener-table">
          <thead><tr>
            <th>#</th><th>ETF</th><th>现价 / 涨跌</th><th>综合分</th>
            <th>五维分（技术 / 规模 / 行业 / 量能 / 舆情）</th><th>覆盖</th><th></th>
          </tr></thead>
          <tbody>${list.map((r) => etfScreenerRowHTML(r, threshold)).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

/* 更新门槛：只重绘结果，不重复请求 */
function updateEtfScreenerThreshold(value) {
  const v = clamp(Math.round(Number(value) || ETF_SCREENER_DEFAULT_THRESHOLD), 60, 95);
  state.etfScreener.threshold = v;
  const label = $('#etfScreenerThresholdVal');

function renderCryptoDerivatives(stock, derivatives, meta) {

function fngLabel(raw) {
  const s = String(raw || '');

  if (/Fear/i.test(s)) return '恐慌';
  if (/Extreme Greed/i.test(s)) return '极度贪婪';
  if (/Greed/i.test(s)) return '贪婪';
  if (/Neutral/i.test(s)) return '中性';
  return s || '—';
}

/* ---------------- stock objects ---------------- */
function normalizeStock(input) {
  const s = input || {};
  const market = String(s.market || 'A').toUpperCase();
  let code = String(s.code || s.rawCode || '').trim();
  let rawCode = String(s.rawCode || code).trim();
  let quoteKey = s.quoteKey || '';
  let klineCode = s.klineCode || '';
  let name = s.name || code;
  /* 标的类型：'etf' 走 ETF 专属研判，'coin' 走加密研判，'commodity' 走商品轻量研判，其余为个股 */
  let kind =
    s.kind === 'etf'
      ? 'etf'
      : s.kind === 'coin'
      ? 'coin'
      : s.kind === 'commodity' || market === 'COMMODITY'
      ? 'commodity'
      : 'stock';

  if (market === 'CRYPTO') {
    const symbol = (code || rawCode).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 15);
    code = symbol;
    rawCode = symbol;
    kind = 'coin';
    if (!quoteKey) quoteKey = 'crypto:' + symbol;
    if (!klineCode) klineCode = 'crypto:' + symbol;
    name = s.name || (typeof CRYPTO_NAMES !== 'undefined' && CRYPTO_NAMES[symbol]) || symbol;
  } else if (market === 'A') {
    code = code.replace(/\D/g, '').slice(0, 6);
    rawCode = code;
    if (isEtfCode(code)) kind = 'etf'; /* 以代码为准，避免数据集丢失 kind 时误判 */
    if (!quoteKey) quoteKey = aSharePrefix(code) + code;
    if (!klineCode) klineCode = quoteKey;
  } else if (market === 'HK') {
    code = code.replace(/\D/g, '').padStart(5, '0').slice(-5);
    rawCode = code;
    if (!quoteKey) quoteKey = 'hk' + code;
    if (!klineCode) klineCode = 'hk' + code;
  } else if (market === 'COMMODITY' || kind === 'commodity') {
    const c =
      typeof normalizeCommodityStock === 'function'
        ? normalizeCommodityStock({ key: code, code, rawCode, name: s.name })
        : null;
    kind = 'commodity';
    code = c ? c.code : String(code || rawCode || '').toLowerCase();
    rawCode = code;
    name = s.name || (c && c.name) || code;
    if (!quoteKey) quoteKey = 'commodity:' + code;
    if (!klineCode) klineCode = 'commodity:' + code;
  } else {
    const f = usStockFields(rawCode || code);
    code = f.code;
    rawCode = f.rawCode;
    name = s.name || code;
    if (!quoteKey) quoteKey = f.quoteKey;
    if (!klineCode) klineCode = f.klineCode;
  }
  return { market, code, name, quoteKey, klineCode, rawCode, kind };
}

function stockFromDataset(ds) {
  return normalizeStock({
    market: ds.market,
    code: ds.code,
    name: ds.name,
    quoteKey: ds.quotekey,
    klineCode: ds.klinecode,
    rawCode: ds.rawcode,
    kind: ds.kind,
  });
}

function hashForStock(stock) {
  const raw = stock.market === 'US' ? stock.rawCode || stock.code : stock.code;
  /* 商品 / ETF / 加密使用独立路由，与个股研判分流 */
  if (stock.kind === 'commodity' || stock.market === 'COMMODITY') {
    return `#/commodity/${encodeURIComponent(stock.code)}`;
  }
  if (stock.kind === 'coin' || stock.market === 'CRYPTO') {
    return `#/coin/${encodeURIComponent(stock.code)}`;
  }
  if (stock.kind === 'etf' && stock.market === 'A') {
    return `#/etf/A/${encodeURIComponent(raw)}`;
  }
  return `#/stock/${stock.market}/${encodeURIComponent(raw)}`;
}

function lookupKnownStock(market, code) {
  const pending = state.pendingStock;
  if (pending && pending.market === market && pending.code === code) return pending;
  const recent = store.get('recent', []);
  if (Array.isArray(recent)) {
    const hit = recent.find((s) => s && s.market === market && s.code === code);
    if (hit) return normalizeStock(hit);
  }
  return null;
}

function stockFromHash() {
  const hash = location.hash || '';
  /* 大宗商品独立路由优先识别 */
  const commodityHash = hash.match(/^#\/commodity\/([a-z][a-z0-9_-]*)/i);
  if (commodityHash) {
    const key = decodeURIComponent(commodityHash[1]).toLowerCase();
    const hit = typeof normalizeCommodityStock === 'function' ? normalizeCommodityStock({ key }) : null;
    if (!hit) return null;
    const known = lookupKnownStock('COMMODITY', hit.code);
    return known ? normalizeStock(known) : normalizeStock(hit);
  }
  /* 加密独立路由优先识别 */
  const coinHash = hash.match(/^#\/coin\/([A-Za-z0-9]{2,15})/i);
  if (coinHash) {
    const symbol = decodeURIComponent(coinHash[1]).toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!symbol) return null;
    const known = lookupKnownStock('CRYPTO', symbol);
    if (known) return normalizeCoinStock(known);
    return normalizeCoinStock({ symbol });
  }
  /* ETF 独立路由优先识别 */
  const etfHash = hash.match(/^#\/etf\/A\/([^/?#]+)/i);
  if (etfHash) {
    const code = decodeURIComponent(etfHash[1]).replace(/\D/g, '');
    if (code.length !== 6) return null;
    const known = lookupKnownStock('A', code);
    if (known) return normalizeStock({ ...known, kind: 'etf' });
    return normalizeStock({ market: 'A', code, name: code, kind: 'etf' });
  }
  const m = hash.match(/^#\/stock\/(A|HK|US)\/([^/?#]+)/i);
  if (!m) return null;
  const market = m[1].toUpperCase();
  const raw = decodeURIComponent(m[2]);
  if (market === 'A') {
    const code = raw.replace(/\D/g, '');
    if (code.length !== 6) return null;
    const known = lookupKnownStock('A', code);
    if (known) return known;
    return normalizeStock({ market: 'A', code, name: code });
  }
  if (market === 'HK') {
    const code = raw.replace(/\D/g, '').padStart(5, '0').slice(-5);
    const known = lookupKnownStock('HK', code);
    if (known) return known;
    return normalizeStock({ market: 'HK', code, name: code });
  }
  const fields = usStockFields(raw);
  const known = lookupKnownStock('US', fields.code);
  if (known) return normalizeStock({ ...known, rawCode: fields.rawCode });
  return normalizeStock(fields);
}

function goStock(input) {
  const stock = normalizeStock(input);
  state.pendingStock = stock;
  closeSuggestions();
  const hash = hashForStock(stock);
  if (location.hash === hash) {

  if ((location.hash || '').startsWith('#/screener')) {

    enterScreener();
    return;
  }
  const stock = stockFromHash();
  if (!stock) {
    if (
      (location.hash || '').startsWith('#/stock/') ||
      (location.hash || '').startsWith('#/etf/') ||
      (location.hash || '').startsWith('#/coin/') ||
      (location.hash || '').startsWith('#/commodity/')
    ) {
      toast('链接中的代码无效，已返回首页', 'error');
      try {
        history.replaceState(null, '', location.pathname + location.search);
      } catch (e) {
        location.hash = '';

      state.pendingStock = null;
      state.route = 'home';
      renderHome();
      return;

    state.route = 'home';

async function runScreenerFlow() {
  const sc = state.screener;
  const token = ++sc.token;
  sc.running = true;
  sc.rows = [];
  sc.stopped = false;
  sc.error = '';
  sc.progressPct = 0;
  sc.progressText = '正在获取候选池…';
  syncScreenerButtons(true);
  refreshScreenerResult();
  try {
    const result = await runScreener({
      size: sc.size,
      onProgress: (done, total, row) => {
        if (token !== sc.token) return;
        updateScreenerProgress(done, total, row);
        if (row) sc.rows.push(row);
        refreshScreenerResult();
      },
      shouldStop: () => token !== sc.token,
    });
    if (token !== sc.token) return;
    sc.rows = result.rows;
    sc.ranAt = result.ranAt;
    sc.stopped = !!result.stopped;
    refreshScreenerResult();
  } catch (err) {
    if (token !== sc.token) return;
    sc.error = err && err.message ? err.message : '扫描失败，请稍后重试';
    sc.rows = [];
    refreshScreenerResult();
  } finally {
    if (token !== sc.token) return;
    sc.running = false;
    syncScreenerButtons(false);
  }
}

/* ---------------- analysis orchestration ---------------- */
async function analyzeStock(inputStock, opts = {}) {
  /* 加密/ETF 标的统一分流到专属编排（覆盖搜索/榜单/路由/刷新所有入口） */
  const normalized = normalizeStock(inputStock);
  if (normalized.kind === 'coin' || normalized.market === 'CRYPTO') {
    return analyzeCoin(inputStock, opts);
  }
  if (normalized.kind === 'etf') {
    return analyzeEtf(inputStock, opts);
  }
  if (normalized.kind === 'commodity') {
    return analyzeCommodity(inputStock, opts);
  }
  const token = ++state.token;
  const stock = normalizeStock(inputStock);
  state.route = 'analysis';
  state.stock = stock;
  state.quote = null;
  state.core = {};
  state.coreSettled = new Set();
  state.score = null;
  state.profile = null;
  state.profileReady = false;
  state.reports = null;
  state.peers = null;
  state.industryName = '';
  state.industryCode = '';
  state.industryStarted = false;
  state.klinePeriod = 'day';
  state.periodKlines = {};
  state.technical = null;
  renderAnalysisSkeleton(stock);
  if (!opts.keepScroll) scrollTopSmooth();

  try {
    const quote = await getQuote(stock);
    if (token !== state.token) return;
    stock.name = quote.name || stock.name;
    stock.rawCode = quote.rawCode || stock.rawCode;
    stock.quoteKey = quote.key || stock.quoteKey;
    if (stock.market === 'US') stock.code = usBaseCode(quote.rawCode || stock.rawCode) || stock.code;
    state.stock = stock;
    state.quote = quote;
    addRecent(stock);
    renderStockHeader(stock, quote, null);
    document.title = `${stock.name} ${stock.code} · 研值 StockLens`;
    bindCoreData(token, quote);
  } catch (err) {
    if (token !== state.token) return;
    renderFatal(stock, quoteErrorText(err));
    toast('行情获取失败：' + quoteErrorText(err), 'error');
  }
}

function quoteErrorText(err) {
  if (!err) return '行情接口无响应';
  if (err.name === 'AbortError') return '行情接口超时，请检查网络后重试';
  return err.message || '行情接口无响应';
}

function markCoreSettled(key, value) {
  state.core[key] = value;
  state.coreSettled.add(key);
  if (['kline', 'reports', 'financials', 'news'].every((k) => state.coreSettled.has(k))) {
    refreshScore();
  }
}

function bindCoreData(token, quote) {
  const stock = state.stock;

  getKline(stock, quote)
    .then((kline) => {
      if (token !== state.token) return;
      state.periodKlines.day = kline;
      markCoreSettled('kline', kline);
      updateChart(kline);
      /* 技术研判模块：基于完整日 K 纯本地计算，零新增网络请求 */
      const technical = analyzeTechnical(kline && kline.points);
      state.technical = technical;
      updateTechnicalSection(technical);
    })
    .catch(() => {
      if (token !== state.token) return;
      markCoreSettled('kline', null);
      updateChart(null);
      state.technical = null;
      updateTechnicalSection(null);
    });

  getStockReports(stock)
    .then((reports) => {
      if (token !== state.token) return;
      state.reports = reports;
      markCoreSettled('reports', reports);
      renderStockReports(reports, stock.market);
      /* FR-5.1：研报（含目标价）到达后刷新 K 线，绘制目标价锚点 */
      const k = state.periodKlines[state.klinePeriod] || state.core.kline;
      if (k) updateChart(k);
    })
    .catch(() => {
      if (token !== state.token) return;
      state.reports = null;
      markCoreSettled('reports', null);
      renderStockReports(null, stock.market);
    })
    .finally(() => {
      if (token !== state.token) return;
      maybeStartIndustry();
    });

  getFinancials(stock)
    .then((financials) => {
      if (token !== state.token) return;
      markCoreSettled('financials', financials);
      renderFinancialSection(financials, stock.market);
    })
    .catch((err) => {
      if (token !== state.token) return;
      markCoreSettled('financials', null);
      const body = $('#financialBody');
      if (body) {
        body.innerHTML = errorBox('财务数据获取失败', err && err.message ? err.message : '接口未响应，请稍后重试。', 'financial');
      }
      updateStatus('financial', 'error', '财务 获取失败');
    });

  getNews(stock)
    .then((news) => {
      if (token !== state.token) return;
      markCoreSettled('news', news);
      renderNewsSection(news, stock.market);
    })
    .catch(() => {
      if (token !== state.token) return;
      markCoreSettled('news', []);
      renderNewsSection([], stock.market);
    });

  getOrgProfile(stock, quote)
    .then((profile) => {
      if (token !== state.token) return;
      state.profile = profile;
      if (profile && profile.industryName) {
        updateHeaderIndustry(profile);
        setIndustryBadge(profile.industryName);
      }
    })
    .catch(() => {
      if (token !== state.token) return;
      state.profile = null;
    })
    .finally(() => {
      if (token !== state.token) return;
      state.profileReady = true;
      maybeStartIndustry();
    });
}

function setIndustryBadge(name) {
  const el = $('#industryBadge');
  if (el && name) el.innerHTML = `<span class="badge">${esc(name)}</span>`;
}

function refreshScore() {
  if (!state.quote || !state.stock) return;
  if (!['kline', 'reports', 'financials', 'news'].every((k) => state.coreSettled.has(k))) return;
  const score = computeScore({
    market: state.stock.market,
    quote: state.quote,
    kline: state.core.kline,
    reports: state.core.reports,
    financials: state.core.financials,
    news: state.core.news,
  });
  state.score = score;
  /* 优先使用用户当前所选周期（周/月K），避免评分刷新时图表被重置回日K */
  renderOverview(score, state.periodKlines[state.klinePeriod] || state.core.kline);
}

function bindEtfData(token, quote, stock) {
  /* 榜单指标（规模/成交额）：从缓存读取，零新增请求 */
  findEtfBoardMeta(stock.code)
    .then((meta) => {
      if (token !== state.token) return;
      state.etf.boardMeta = meta;
      /* 榜单指标到达后，若评分已算过则重算以纳入规模/量能维度 */
      if (state.etf.score) maybeRefreshEtfScore(token);
    })
    .catch(() => {});

  /* 技术研判：复用个股流程，日 K 到达即渲染五维技术 */
  getKline(stock, quote)
    .then((kline) => {
      if (token !== state.token) return;
      state.periodKlines.day = kline;
      state.core.kline = kline;
      state.coreSettled.add('kline');
      updateChart(kline);
      const technical = analyzeTechnical(kline && kline.points);
      state.technical = technical;
      updateTechnicalSection(technical);
      maybeRefreshEtfScore(token);
    })
    .catch(() => {
      if (token !== state.token) return;
      state.core.kline = null;
      state.coreSettled.add('kline');
      updateChart(null);
      state.technical = null;
      updateTechnicalSection(null);
      maybeRefreshEtfScore(token);
    });

  /* 行业研报 + 新闻：ETF 专属五维中的两维 */
  getEtfFundamentals(stock, quote)
    .then((result) => {
      if (token !== state.token) return;
      state.etf.fundamentals = result;
      renderEtfIndustrySection(result, stock);
      if (result.news) {
        state.core.news = result.news;
        state.coreSettled.add('news');
        renderNewsSection(result.news, stock.market);
      }
      renderEtfHeader(stock, quote, result);
      maybeRefreshEtfScore(token);
    })
    .catch(() => {
      if (token !== state.token) return;
      state.coreSettled.add('news');
      renderEtfIndustrySection(null, stock);
      maybeRefreshEtfScore(token);
    });
}

function maybeRefreshEtfScore(token) {
  if (token !== state.token) return;
  if (!state.quote || !state.stock) return;
  /* 等待技术(K线)与行业/舆情两路都结算后再算分，避免早算导致覆盖偏低 */
  if (!state.coreSettled.has('kline') || !state.coreSettled.has('news')) return;
  const board = state.etf.boardMeta;
  const score = computeEtfScore({
    quote: state.quote,
    kline: state.core.kline,
    technical: state.technical,
    fundamentals: state.etf.fundamentals,
    boardMeta: board,
  });
  state.etf.score = score;
  state.score = score;
  renderEtfOverview(score, state.core.kline);
}
