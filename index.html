async function getHKUSPeersFromPush2(stock, industryName) {
  if (!industryName) throw new Error('未识别到所属行业');
  const isHK = stock.market === 'HK';
  const fs = isHK ? 'm:128' : 'm:105,m:106,m:107';
  const collect = async (sortField) => {
    const matched = [];
    for (let page = 1; page <= 3; page++) {
      const { rows, total } = await fetchMarketPeerPage(fs, sortField, page);
      rows.forEach((r) => {
        if (sameIndustry(r.industry, industryName)) matched.push(r);
      });
      if (matched.length >= 3 || page * 100 >= total) break;
    }
    return matched
      .filter((r) => r.code && r.code !== stock.code)
      .slice(0, 3)
      .map((r) => ({
        market: stock.market,
        code: isHK ? String(r.code).padStart(5, '0') : String(r.code).replace(/\..*$/, ''),
        name: r.name,
        marketCap: Number.isFinite(r.marketCap) ? r.marketCap : null,
        profit: Number.isFinite(r.profit) ? r.profit : null,
        pe: r.pe,
        pb: r.pb,
        quoteKey: isHK ? 'hk' + String(r.code).padStart(5, '0') : 'us' + String(r.code).replace(/\..*$/, ''),
        klineCode: isHK ? 'hk' + String(r.code).padStart(5, '0') : 'us' + String(r.code),
      }));
  };
  const [cap, profit] = await Promise.all([collect('f20'), collect('f105')]);
  const hasProfit = profit.some((p) => Number.isFinite(p.profit) && p.profit > 0);
  return {
    supported: true,
    boardCode: '',
    boardName: industryName,
    cap,
    profit: hasProfit ? profit : [],
    profitPeriod: '',
    source: '东方财富市场列表',
    note: `按「${industryName}」行业标签匹配，覆盖可能不完整`,
  };
}

function dcQuoteString(s) {
  return String(s || '').replace(/["\\]/g, '');
}
function dcCodeInFilter(codes) {
  const unique = [...new Set((codes || []).map((c) => dcQuoteString(c)).filter(Boolean))];
  if (!unique.length) return '';
  return `(SECURITY_CODE in (${unique.map((c) => `"${c}"`).join(',')}))`;
}
function usBaseCode(raw) {
  return String(raw || '')
    .toUpperCase()
    .replace(/^US/, '')
    .replace(/\.(OQ|N|PS|A|AMEX|NYSE)$/i, '');
}
function peerCurrencyLabel(currency) {
  const c = String(currency || '').toUpperCase();
  if (c === 'HKD') return '港元';
  if (c === 'USD') return '美元';
  if (c === 'TWD') return '新台币';
  if (c === 'CNY' || c === 'RMB') return '元';
  return c || '元';
}
function peerMoney(yi, currency) {
  if (!Number.isFinite(yi)) return '—';
  const label = peerCurrencyLabel(currency);
  if (Math.abs(yi) >= 10000) return `${(yi / 10000).toFixed(2)}万亿${label}`;
  return `${fmtBig(yi)}${label}`;
}

async function getHKUSPeersFromDataCenter(stock, industryName) {
  if (!industryName) throw new Error('未识别到所属行业');
  const isHK = stock.market === 'HK';
  const profileReport = isHK ? 'RPT_HKF10_INFO_ORGPROFILE' : 'RPT_USF10_INFO_ORGPROFILE';
  const profiles = await dcQuery(
    profileReport,
    'SECURITY_CODE,SECURITY_NAME_ABBR,ORG_CODE,BELONG_INDUSTRY',
    `(BELONG_INDUSTRY="${dcQuoteString(industryName)}")`,
    'SECURITY_CODE',
    '1',
    500
  );
  const rows = (profiles || []).filter((r) => r && r.SECURITY_CODE);
  if (!rows.length) throw new Error(`未找到「${industryName}」行业成分股`);

  const orgMap = new Map();
  rows.forEach((r) => {
    const org = r.ORG_CODE || String(r.SECURITY_CODE);
    if (!orgMap.has(org)) {
      orgMap.set(org, {
        org,
        code: String(r.SECURITY_CODE),
        name: stripTags(r.SECURITY_NAME_ABBR || r.SECURITY_CODE),
      });
    }
  });
  const filter = dcCodeInFilter(rows.map((r) => r.SECURITY_CODE));

  if (isHK) {
    const finRows = await dcQuery(
      'RPT_HKF10_FN_MAININDICATOR',
      'SECURITY_CODE,SECURITY_NAME_ABBR,ORG_CODE,TOTAL_MARKET_CAP,HOLDER_PROFIT,REPORT_DATE,CURRENCY',
      filter,
      'REPORT_DATE',
      '-1',
      500
    );
    const latest = new Map();
    finRows.forEach((r) => {
      const org = r.ORG_CODE || String(r.SECURITY_CODE);
      if (!latest.has(org)) latest.set(org, r);
    });
    const peers = [...latest.entries()].map(([org, r]) => {
      const pref = orgMap.get(org) || { code: String(r.SECURITY_CODE), name: r.SECURITY_NAME_ABBR };
      const marketCap = num(r.TOTAL_MARKET_CAP);
      const profit = num(r.HOLDER_PROFIT);
      return {
        market: 'HK',
        code: pref.code,
        name: stripTags(pref.name || r.SECURITY_NAME_ABBR || pref.code),
        marketCap: marketCap != null ? marketCap / 1e8 : null,
        profit: profit != null ? profit / 1e8 : null,
        pe: null,
        pb: null,
        currency: 'HKD',
        reportDate: r.REPORT_DATE,
        quoteKey: 'hk' + pref.code,
        klineCode: 'hk' + pref.code,
      };
    });
    const cap = peers
      .filter((p) => p.code !== stock.code && Number.isFinite(p.marketCap) && p.marketCap > 0)
      .sort((a, b) => b.marketCap - a.marketCap)
      .slice(0, 3);
    const profit = peers
      .filter((p) => p.code !== stock.code && Number.isFinite(p.profit) && p.profit > 0)
      .sort((a, b) => b.profit - a.profit)
      .slice(0, 3);
    if (!cap.length && !profit.length) throw new Error('港股 F10 暂无行业排行数据');
    const dates = [...new Set(profit.map((p) => String(p.reportDate || '').slice(0, 10)).filter(Boolean))];
    return {
      supported: true,
      boardCode: '',
      boardName: industryName,
      cap,
      profit,
      profitPeriod: dates.length === 1 ? dates[0] : '',
      source: '东方财富港股 F10',
      note: `按「${industryName}」行业分类匹配，报告期以各公司最新可得数据为准`,
    };
  }

  const quoteMap = await getQuoteBatch([...orgMap.values()].map((p) => 'us' + p.code));
  const peerFromQuote = (org) => {
    const pref = orgMap.get(org);
    if (!pref) return null;
    const q = quoteMap.get('us' + pref.code);
    const rawCode = (q && q.rawCode) || pref.code;
    const code = usBaseCode(rawCode || pref.code);
    return {
      market: 'US',
      code,
      name: stripTags((q && q.name) || pref.name || code),
      rawCode: String(rawCode).toUpperCase(),
      marketCap: q && Number.isFinite(q.marketCap) ? q.marketCap : null,
      profit: null,
      pe: q ? q.pe : null,
      pb: q ? q.pb : null,
      currency: 'USD',
      quoteKey: 'us' + code,
      klineCode: 'us' + String(rawCode).toUpperCase(),
    };
  };

  const cap = [...orgMap.keys()]
    .map(peerFromQuote)
    .filter((p) => p && p.code !== stock.code && Number.isFinite(p.marketCap) && p.marketCap > 0)
    .sort((a, b) => b.marketCap - a.marketCap)
    .slice(0, 3);

  const incomeRows = await dcQuery(
    'RPT_USF10_FN_INCOME',
    'SECURITY_CODE,SECURITY_NAME_ABBR,ORG_CODE,REPORT_DATE,REPORT_TYPE,AMOUNT,CURRENCY,CURRENCY_ABBR',
    `${filter}(REPORT_TYPE in ("累计季报","年报"))(ITEM_NAME="归属于母公司股东净利润")`,
    'REPORT_DATE',
    '-1',
    500
  );
  const latestProfit = new Map();
  incomeRows.forEach((r) => {
    const org = r.ORG_CODE || String(r.SECURITY_CODE);
    if (!latestProfit.has(org)) latestProfit.set(org, r);
  });
  const profit = [...latestProfit.entries()]
    .map(([org, r]) => {
      const p = peerFromQuote(org);
      if (!p) return null;
      return {
        ...p,
        profit: num(r.AMOUNT) != null ? num(r.AMOUNT) / 1e8 : null,
        currency: r.CURRENCY_ABBR || r.CURRENCY || 'USD',
        reportDate: r.REPORT_DATE,
      };
    })
    .filter(
      (p) =>
        p &&
        p.code !== stock.code &&
        Number.isFinite(p.profit) &&
        p.profit > 0 &&
        String(p.currency).toUpperCase() === 'USD'
    )
    .sort((a, b) => b.profit - a.profit)
    .slice(0, 3);

  if (!cap.length && !profit.length) throw new Error('美股 F10 暂无行业排行数据');
  const dates = [...new Set(profit.map((p) => String(p.reportDate || '').slice(0, 10)).filter(Boolean))];
  return {
    supported: true,
    boardCode: '',
    boardName: industryName,
    cap,
    profit,
    profitPeriod: dates.length === 1 ? dates[0] : '',
    source: '东方财富美股 F10 / 腾讯财经',
    note: `按「${industryName}」行业分类匹配；利润榜仅统计美元口径，报告期以各公司最新累计数据为准`,
  };
}

async function getHKUSPeers(stock, industryName) {
  try {
    const dc = await getHKUSPeersFromDataCenter(stock, industryName);
    if (dc && (dc.cap.length || dc.profit.length)) return dc;
  } catch (e) {}
  return getHKUSPeersFromPush2(stock, industryName);
}

async function getPeers(stock, industryName, opts = {}) {
  const cacheKey = `peers:${stock.market}:${stock.code}:${industryName}:${opts.industryCode || ''}`;
  return cached(cacheKey, TTL.peers, async () => {
    if (stock.market === 'A') return getASharePeers(stock, industryName, opts.industryCode);
    return getHKUSPeers(stock, industryName);
  });
}

async function getPeerReports(peer) {
  if (peer.market !== 'A') return [];
  try {
    const data = await getStockReports(peer, { pageSize: 3, months: 6 });
    return data.list.slice(0, 3);
  } catch (e) {
    return [];
  }
}


/* ===== js/20-scoring.js ===== */
/* ============================================================
   Scoring engine — explainable, missing data never invented
   ============================================================ */
'use strict';

const DIM_META = [
  { key: 'reports', name: '研报与机构评级', short: '研报', weight: 30, icon: 'book' },
  { key: 'financial', name: '盈利与成长', short: '盈利', weight: 25, icon: 'trendUp' },
  { key: 'technical', name: '技术面动量', short: '技术', weight: 25, icon: 'activity' },
  { key: 'news', name: '新闻舆情', short: '舆情', weight: 20, icon: 'news' },
];

const SENTIMENT_POS = [
  '增长', '上涨', '大涨', '涨停', '新高', '突破', '增持', '回购', '中标', '签约', '合作', '获批',
  '利好', '超预期', '盈利', '扭亏', '提价', '扩产', '上调', '买入', '推荐', '创新高', '订单',
  '分红', '收购', '落地', '放量', '领先', '强劲', '改善',
];
const SENTIMENT_NEG = [
  '下跌', '大跌', '跌停', '新低', '亏损', '下滑', '减持', '处罚', '立案', '调查', '风险', '暴跌',
  '裁员', '下调', '终止', '退市', '诉讼', '违约', '造假', '爆雷', '警示', '冻结', '承压', '放缓',
  '低于预期', '计提', '商誉', '停牌', '负面', '召回',
];

function band(value, rows, fallback = 50) {
  if (!Number.isFinite(value)) return null;
  for (const [min, score] of rows) {
    if (value >= min) return score;
  }
  return fallback;
}

function growthScore(v) {
  return band(v, [
    [50, 100], [30, 94], [20, 86], [10, 76], [5, 68], [0, 56], [-10, 38], [-25, 24],
  ], 12);
}
function roeScore(v) {
  return band(v, [
    [25, 100], [20, 94], [15, 84], [10, 72], [6, 60], [3, 48], [0, 34],
  ], 20);
}
function returnScore(r, scale) {
  if (!Number.isFinite(r)) return null;
  return clamp(50 + (r / scale) * 50, 0, 100);
}

function analyzeSentiment(news) {
  const rows = Array.isArray(news) ? news.filter((n) => n && n.title) : [];
  let pos = 0;
  let neg = 0;
  const details = [];
  rows.forEach((n) => {
    const text = `${n.title || ''} ${n.content || ''}`;
    let p = 0;
    let q = 0;
    SENTIMENT_POS.forEach((w) => {
      if (text.includes(w)) p += 1;
    });
    SENTIMENT_NEG.forEach((w) => {
      if (text.includes(w)) q += 1;
    });
    const cls = p > q ? 'pos' : q > p ? 'neg' : 'neu';
    if (cls === 'pos') pos += 1;
    else if (cls === 'neg') neg += 1;
    details.push({ ...n, senti: cls });
  });
  const total = rows.length;
  const neu = total - pos - neg;
  const score = total ? clamp(50 + ((pos - neg) / total) * 50, 0, 100) : null;
  return { total, pos, neu, neg, score, details };
}

function scoreReports(data, quote) {
  const { market, reports } = data;
  if (market !== 'A') {
    return { available: false, note: '港股 / 美股暂无免费中文研报源', reasons: [] };
  }
  const list = (reports && reports.list) || [];
  if (!list.length) {
    return { available: false, note: '近 6 个月未检索到个股研报', reasons: [] };
  }
  const rated = list.filter((r) => Number.isFinite(r.ratingScore));
  const buys = rated.filter((r) => r.ratingScore >= 0.75).length;
  const neutrals = rated.filter((r) => r.ratingScore > 0.25 && r.ratingScore < 0.75).length;
  const sells = rated.filter((r) => r.ratingScore <= 0.25).length;
  const coverage = band(list.length, [
    [16, 100], [12, 92], [9, 84], [6, 74], [4, 62], [2, 48], [1, 34],
  ], 35);

  let rating = null;
  if (rated.length) {
    const now = Date.now();
    let weighted = 0;
    let weights = 0;
    rated.forEach((r) => {
      const days = daysSince(r.rawDate);
      const w = days !== null && days <= 30 ? 1.5 : 1;
      weighted += r.ratingScore * w;
      weights += w;
    });
    rating = (weighted / weights) * 100;
  }

  const targets = list
    .map((r) => r.target)
    .filter((n) => Number.isFinite(n) && n > 0)
    .slice(0, 8);
  let targetScore = null;
  let targetUpside = null;
  if (targets.length && quote && quote.price > 0) {
    const avg = targets.reduce((a, b) => a + b, 0) / targets.length;
    targetUpside = (avg / quote.price - 1) * 100;
    targetScore = band(targetUpside, [
      [25, 100], [15, 92], [8, 82], [2, 70], [-5, 52], [-15, 34],
    ], 22);
  }

  let sum = coverage * 0.3 + (rating !== null ? rating * 0.45 : 0);
  let weight = 0.75;
  if (targetScore !== null) {
    sum += targetScore * 0.25;
    weight += 0.25;
  }
  const score = Math.round(sum / weight);
  const reasons = [`近 6 个月共 ${list.length} 篇研报，覆盖度打分 ${coverage}。`];
  if (rated.length) {
    reasons.push(`已评级 ${rated.length} 篇：买入/增持 ${buys} 篇，中性 ${neutrals} 篇，减持/卖出 ${sells} 篇；按近 30 天加权，评级均值 ${Math.round(rating)}。`);
  } else {
    reasons.push('研报未给出可识别评级，评级子项不计入。');
  }
  if (targetUpside !== null) {
    reasons.push(`目标价均值 ${fmtPrice(targets.reduce((a, b) => a + b, 0) / targets.length)}，较现价 ${fmtPct(targetUpside)}。`);
  } else {
    reasons.push('研报未提供目标价，目标价子项不计入并按剩余权重折算。');
  }
  const note = `近 6 个月 ${list.length} 篇 · 买入/增持 ${buys} 篇${targetUpside !== null ? ` · 目标空间 ${fmtPct(targetUpside)}` : ''}`;
  return { available: true, score, note, reasons };
}

function scoreFinancial(data) {
  const f = data.financials;
  if (!f || !f.supported) {
    return {
      available: false,
      note: (f && f.reason) || '盈利与成长数据暂不可用',
      reasons: [],
    };
  }
  if (f.empty || (!Number.isFinite(f.revenueYoY) && !Number.isFinite(f.profitYoY) && !Number.isFinite(f.roe))) {
    return { available: false, note: '财务接口未返回有效指标', reasons: [] };
  }
  const rev = growthScore(f.revenueYoY);
  const profit = growthScore(f.profitYoY);
  const roe = roeScore(f.roe);
  const parts = [];
  if (rev !== null) parts.push([rev, 0.35, '营收增速']);
  if (profit !== null) parts.push([profit, 0.35, '净利增速']);
  if (roe !== null) parts.push([roe, 0.3, 'ROE']);
  const totalW = parts.reduce((a, p) => a + p[1], 0);
  if (!totalW) return { available: false, note: '财务接口未返回有效指标', reasons: [] };
  const score = Math.round(parts.reduce((a, p) => a + p[0] * p[1], 0) / totalW);
  const reasons = [`报告期 ${f.period || f.reportDate || '—'}。`];
  if (Number.isFinite(f.revenueYoY)) reasons.push(`营收同比 ${fmtPct(f.revenueYoY)}，增速子项 ${rev}。`);
  else reasons.push('营收增速缺失，子项不计入。');
  if (Number.isFinite(f.profitYoY)) reasons.push(`归母净利同比 ${fmtPct(f.profitYoY)}，增速子项 ${profit}。`);
  else reasons.push('净利增速缺失，子项不计入。');
  if (Number.isFinite(f.roe)) reasons.push(`ROE ${ratioText(f.roe)}，盈利质量子项 ${roe}。`);
  else reasons.push('ROE 缺失，子项不计入。');
  if (Number.isFinite(f.grossMargin)) reasons.push(`毛利率 ${ratioText(f.grossMargin)}，仅作参考，不直接计分。`);
  const noteParts = [];
  if (Number.isFinite(f.revenueYoY)) noteParts.push(`营收 ${fmtPct(f.revenueYoY)}`);
  if (Number.isFinite(f.profitYoY)) noteParts.push(`净利 ${fmtPct(f.profitYoY)}`);
  if (Number.isFinite(f.roe)) noteParts.push(`ROE ${ratioText(f.roe)}`);
  return { available: true, score, note: noteParts.join(' · ') || f.period || '财务指标已获取', reasons };
}

function scoreTechnical(data) {
  const k = data.kline && data.kline.metrics;
  if (!k) return { available: false, note: '历史 K 线数据不足', reasons: [] };
  const r20 = returnScore(k.r20, 20);
  const r60 = returnScore(k.r60, 40);
  const parts = [];
  if (r20 !== null) parts.push([r20, 0.45]);
  if (r60 !== null) parts.push([r60, 0.45]);
  if (k.trend === '多头排列') parts.push([95, 0.1]);
  else if (k.trend === '空头排列') parts.push([15, 0.1]);
  else parts.push([50, 0.1]);
  const totalW = parts.reduce((a, p) => a + p[1], 0);
  let score = parts.reduce((a, p) => a + p[0] * p[1], 0) / totalW;
  if (Number.isFinite(k.maxDrawdown) && k.maxDrawdown < -10) {
    score += Math.max(-18, (k.maxDrawdown + 10) * 0.6);
  }
  score = Math.round(clamp(score, 0, 100));
  const reasons = [
    `近 20 日 ${fmtPct(k.r20)}，近 60 日 ${fmtPct(k.r60)}，近 120 日 ${fmtPct(k.r120)}。`,
    `均线形态：${k.trend}；20 日均线 ${fmtPrice(k.ma20)}，60 日均线 ${fmtPrice(k.ma60)}。`,
    `近 120 日最大回撤 ${fmtPct(k.maxDrawdown)}，年化波动约 ${ratioText(k.volatility)}。`,
    Number.isFinite(k.maxDrawdown) && k.maxDrawdown < -10
      ? `回撤超过 10%，已按幅度扣分 ${Math.min(18, Math.round((-10 - k.maxDrawdown) * 0.6))} 分。`
      : '回撤在 10% 以内，未触发回撤扣分。',
  ];
  const note = `20日 ${fmtPct(k.r20)} · 60日 ${fmtPct(k.r60)} · ${k.trend}`;
  return { available: true, score, note, reasons };
}

function scoreNews(data) {
  const s = analyzeSentiment(data.news);
  if (!s.total) return { available: false, note: '暂未获取到相关新闻', reasons: [] };
  const score = Math.round(s.score);
  const reasons = [
    `共 ${s.total} 条相关新闻：正面 ${s.pos} 条、中性 ${s.neu} 条、负面 ${s.neg} 条。`,
    '按标题与摘要中的正负面关键词计数，标题与正文同权，属于粗略情绪指标。',
    s.pos || s.neg
      ? `情绪净值 ${s.pos - s.neg}，换算得分 ${score}。`
      : '未命中明显正负面关键词，按中性处理。',
  ];
  return {
    available: true,
    score,
    note: `${s.total} 条 · 正 ${s.pos} / 中 ${s.neu} / 负 ${s.neg}`,
    reasons,
  };
}

function computeScore({ market, quote, kline, reports, financials, news }) {
  const data = { market, quote, kline, reports, financials, news };
  const results = {
    reports: scoreReports(data, quote),
    financial: scoreFinancial(data),
    technical: scoreTechnical(data),
    news: scoreNews(data),
  };
  const dims = DIM_META.map((meta) => {
    const r = results[meta.key];
    return {
      ...meta,
      available: !!r.available && Number.isFinite(r.score),
      score: r.available && Number.isFinite(r.score) ? r.score : null,
      note: r.note,
      reasons: r.reasons || [],
    };
  });
  const available = dims.filter((d) => d.available);
  const weightSum = available.reduce((a, d) => a + d.weight, 0);
  let total = null;
  if (weightSum > 0) {
    total = Math.round(available.reduce((a, d) => a + d.score * d.weight, 0) / weightSum);
  }
  const coverage = Math.round((weightSum / 100) * 100);
  const verdict = verdictFor(total === null ? 0 : total);
  const sorted = available.slice().sort((a, b) => b.score - a.score);
  let desc = total === null ? '有效数据不足，暂不给出综合分。' : verdict.desc + '。';
  if (sorted.length >= 2) {
    desc += `最强项为${sorted[0].name}（${sorted[0].score}），最弱项为${sorted[sorted.length - 1].name}（${
      sorted[sorted.length - 1].score
    }）。`;
  }
  if (coverage < 100) {
    desc += `当前数据覆盖 ${coverage}%，缺失维度已从权重中剔除。`;
  }
  return {
    total,
    verdict,
    dims,
    coverage,
    desc,
    missing: dims.filter((d) => !d.available).map((d) => d.short),
    createdAt: new Date(),
  };
}

/* ---------------- shared presentation helpers ---------------- */
function dimByKey(score, key) {
  return score && score.dims ? score.dims.find((d) => d.key === key) : null;
}
function scoreColorClass(score) {
  if (!Number.isFinite(score)) return 'muted';
  if (score >= 65) return 'teal';
  if (score >= 50) return 'blue';
  if (score >= 35) return 'orange';
  return 'red';
}
function sentimentLabel(score) {
  if (!Number.isFinite(score)) return '暂无数据';
  if (score >= 65) return '偏正面';
  if (score >= 55) return '略偏正面';
  if (score > 45) return '中性';
  if (score > 35) return '略偏负面';
  return '偏负面';
}


/* ===== js/21-charts.js ===== */
/* ============================================================
   Charts — gauge, radar, sparkline, sentiment bars
   ============================================================ */
'use strict';

function renderGauge(score, verdict, coverage) {
  const value = Number.isFinite(score) ? score : 0;
  const r = 88;
  const circ = 2 * Math.PI * r;
  const target = (circ * value) / 100;
  return `
  <div class="gauge" id="scoreGauge">
    <svg viewBox="0 0 210 210" role="img" aria-label="综合评分 ${Number.isFinite(score) ? score : '暂无'} 分">
      <circle class="gauge-track" cx="105" cy="105" r="${r}"></circle>
      <circle class="gauge-fill ${verdict.cls}" cx="105" cy="105" r="${r}"
        stroke-dasharray="0 ${circ.toFixed(1)}" stroke-dashoffset="0">
        <animate attributeName="stroke-dasharray" from="0 ${circ.toFixed(1)}" to="${target.toFixed(1)} ${circ.toFixed(
    1
  )}" dur="1.05s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      </circle>
    </svg>
    <div class="gauge-center">
      <div class="score-num">${Number.isFinite(score) ? score : '—'}<small>${Number.isFinite(score) ? '/ 100' : ''}</small></div>
      <span class="verdict-pill ${verdict.cls}">${Number.isFinite(score) ? verdict.label : '数据不足'}</span>
    </div>
  </div>`;
}

function radarPoints(cx, cy, r, values) {
  return values
    .map((v, i) => {
      const angle = (Math.PI * 2 * i) / values.length - Math.PI / 2;
      const rr = r * (clamp(v, 0, 100) / 100);
      return `${(cx + Math.cos(angle) * rr).toFixed(1)},${(cy + Math.sin(angle) * rr).toFixed(1)}`;
    })
    .join(' ');
}

function renderRadar(dims) {
  const cx = 130;
  const cy = 122;
  const r = 80;
  const vals = dims.map((d) => (d.available ? d.score : 0));
  const rings = [25, 50, 75, 100]
    .map(
      (level) =>
        `<polygon class="radar-grid" points="${radarPoints(
          cx,
          cy,
          r,
          dims.map(() => level)
        )}"></polygon>`
    )
    .join('');
  const axes = dims
    .map((_, i) => {
      const angle = (Math.PI * 2 * i) / dims.length - Math.PI / 2;
      return `<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(angle) * r).toFixed(
        1
      )}" y2="${(cy + Math.sin(angle) * r).toFixed(1)}"></line>`;
    })
    .join('');
  const area = `<polygon class="radar-area" points="${radarPoints(cx, cy, r, vals)}"></polygon>`;
  const dots = dims
    .map((d, i) => {
      const angle = (Math.PI * 2 * i) / dims.length - Math.PI / 2;
      const rr = r * (clamp(vals[i], 0, 100) / 100);
      return `<circle class="radar-dot" cx="${(cx + Math.cos(angle) * rr).toFixed(1)}" cy="${(
        cy +
        Math.sin(angle) * rr
      ).toFixed(1)}" r="3.2"></circle>`;
    })
    .join('');
  const labels = dims
    .map((d, i) => {
      const angle = (Math.PI * 2 * i) / dims.length - Math.PI / 2;
      const x = cx + Math.cos(angle) * (r + 17);
      const y = cy + Math.sin(angle) * (r + 15);
      const anchor = Math.abs(Math.cos(angle)) < 0.1 ? 'middle' : Math.cos(angle) > 0 ? 'start' : 'end';
      const dy = i === 0 ? -6 : i === 2 ? 8 : 0;
      const text = d.available ? d.score : '—';
      return `<text class="radar-label" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}">${
        d.short
      }</text><text class="radar-value" x="${x.toFixed(1)}" y="${(y + dy + 12).toFixed(1)}" text-anchor="${anchor}">${text}</text>`;
    })
    .join('');
  return `<svg viewBox="0 0 260 250" role="img" aria-label="四维因子雷达图">${rings}${axes}${area}${dots}${labels}</svg>`;
}

function renderSparkline(points) {
  if (!Array.isArray(points) || points.length < 2) return '';
  const rows = points.slice(-240);
  const closes = rows.map((p) => p.close).filter(Number.isFinite);
  if (closes.length < 2) return '';
  const w = 640;
  const h = 112;
  const pad = 5;
  const min = Math.min(...closes);
  const max = Math.max(...closes);
  const span = max - min || 1;
  const x = (i) => (i / (rows.length - 1)) * (w - pad * 2) + pad;
  const y = (v) => h - pad - ((v - min) / span) * (h - pad * 2);
  const line = rows.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.close).toFixed(1)}`).join(' ');
  const area = `${line} L${x(rows.length - 1).toFixed(1)} ${h - pad} L${x(0).toFixed(1)} ${h - pad} Z`;
  const id = uid('spark');
  const lastX = x(rows.length - 1);
  const lastY = y(rows[rows.length - 1].close);
  const guides = [25, 50, 75]
    .map((pct) => {
      const gy = (h - pad * 2) * (pct / 100) + pad;
      return `<line class="spark-guide" x1="${pad}" y1="${gy.toFixed(1)}" x2="${w - pad}" y2="${gy.toFixed(1)}"/>`;
    })
    .join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="近一年股价走势">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--gold)" stop-opacity=".24"/>
      <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
    </linearGradient></defs>
    ${guides}
    <path class="spark-area" d="${area}" fill="url(#${id})"></path>
    <path class="spark-line" d="${line}" vector-effect="non-scaling-stroke"></path>
    <circle class="spark-dot" cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3"></circle>
  </svg>`;
}

function renderScoreMiniBars(coverage) {
  const on = Math.round((clamp(coverage, 0, 100) / 100) * 10);
  return Array.from({ length: 10 }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('');
}

function renderSentimentBar(s) {
  if (!s || !s.total) return '';
  const p = (n) => ((n / s.total) * 100).toFixed(1);
  return `<div class="senti-bar"><i class="pos" style="width:${p(s.pos)}%"></i><i class="neu" style="width:${p(
    s.neu
  )}%"></i><i class="neg" style="width:${p(s.neg)}%"></i></div>
  <div class="senti-legend">
    <span><i style="background:var(--red)"></i>正面 ${s.pos}</span>
    <span><i style="background:rgba(137,150,173,.6)"></i>中性 ${s.neu}</span>
    <span><i style="background:var(--green)"></i>负面 ${s.neg}</span>
  </div>`;
}

/* ============================================================
   Candlestick chart (FR-3.1 ~ FR-3.5, FR-3.8, FR-3.9)
   纯 SVG：蜡烛 + MA20/MA60 + 成交量副图 + 十字光标悬浮详情
   ============================================================ */

const CANDLE_STORE = new Map(); // uid -> { pts, geom }
const CANDLE_W = 660;
const CANDLE_H = 312;

function fmtVolCompact(v) {
  if (!Number.isFinite(v) || v <= 0) return '—';
  if (v >= 1e8) return (v / 1e8).toFixed(2) + '亿';
  if (v >= 1e4) return (v / 1e4).toFixed(1) + '万';
  return String(Math.round(v));
}

function maSeries(closes, n) {
  const out = new Array(closes.length).fill(null);
  let sum = 0;
  for (let i = 0; i < closes.length; i++) {
    sum += closes[i];
    if (i >= n) sum -= closes[i - n];
    if (i >= n - 1) out[i] = sum / n;
  }
  return out;
}

function maPath(vals, x, y) {
  let d = '';
  let open = false;
  vals.forEach((v, i) => {
    if (!Number.isFinite(v)) {
      open = false;
      return;
    }
    d += `${open ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)} `;
    open = true;
  });
  return d.trim();
}

function sliceSeries(series, n) {
  const out = {};
  for (const key in series) out[key] = series[key].slice(-n);
  return out;
}

function bandAreaPath(upper, lower, x, y) {
  const fwd = [];
  const rev = [];
  for (let i = 0; i < upper.length; i++) {
    if (!Number.isFinite(upper[i]) || !Number.isFinite(lower[i])) continue;
    fwd.push(`${fwd.length ? 'L' : 'M'}${x(i).toFixed(1)} ${y(upper[i]).toFixed(1)}`);
    rev.push(`L${x(i).toFixed(1)} ${y(lower[i]).toFixed(1)}`);
  }
  if (fwd.length < 2) return '';
  return `${fwd.join(' ')} ${rev.reverse().join(' ')} Z`;
}

/* 副图绘制：量 / MACD / KDJ / RSI（FR-4.1 ~ FR-4.4） */
function renderSubPanel(sub, series, points, x, top, h, bodyW) {
  const x0 = 8;
  const right = CANDLE_W - 58;
  const guide = (yy) => `<line class="candle-guide" x1="${x0}" y1="${yy.toFixed(1)}" x2="${right}" y2="${yy.toFixed(1)}"/>`;
  const label = (t, yy) => `<text class="candle-vol-max" x="${right + 6}" y="${yy.toFixed(1)}">${t}</text>`;
  const bx = (i) => (x(i) - bodyW / 2).toFixed(1);

  if (sub === 'volume') {
    const volMax = Math.max(...points.map((p) => p.volume), 1);
    const yV = (v) => top + h - (v / volMax) * h;
    const bars = points
      .map((p, i) => {
        const vh = Math.max(0.5, h * (p.volume / volMax));
        return `<rect class="vol-bar ${p.close >= p.open ? 'up' : 'down'}" x="${bx(i)}" y="${yV(p.volume).toFixed(
          1
        )}" width="${bodyW.toFixed(1)}" height="${vh.toFixed(1)}"/>`;
      })
      .join('');
    return `${guide(top)}${bars}${label(fmtVolCompact(volMax), top + 9)}`;
  }

  if (sub === 'macd') {
    const vals = [...series.dif, ...series.dea, ...series.hist].filter(Number.isFinite);
    const scale = Math.max(...vals.map(Math.abs), 1e-9);
    const yS = (v) => top + h / 2 - (v / scale) * (h / 2);
    const y0 = yS(0);
    const bars = series.hist
      .map((v, i) => {
        if (!Number.isFinite(v)) return '';
        const yv = yS(v);
        const bh = Math.max(0.5, Math.abs(yv - y0));
        return `<rect class="sub-hist ${v >= 0 ? 'up' : 'down'}" x="${bx(i)}" y="${Math.min(y0, yv).toFixed(
          1
        )}" width="${bodyW.toFixed(1)}" height="${bh.toFixed(1)}"/>`;
      })
      .join('');
    return `${guide(y0)}${bars}<path class="sub-line a" d="${maPath(series.dif, x, yS)}"></path><path class="sub-line b" d="${maPath(
      series.dea,
      x,
      yS
    )}"></path>${label('±' + fmtSigned(scale, 2), top + 9)}`;
  }

  /* KDJ / RSI：固定 0-100 刻度 */
  const yS = (v) => top + h - (clamp(v, 0, 100) / 100) * h;
  if (sub === 'kdj') {
    return `${guide(yS(80))}${guide(yS(20))}<path class="sub-line c" d="${maPath(series.j, x, yS)}"></path><path class="sub-line a" d="${maPath(
      series.k,
      x,
      yS
    )}"></path><path class="sub-line b" d="${maPath(series.d, x, yS)}"></path>${label('100', top + 9)}${label('0', top + h)}`;
  }
  /* rsi */
  return `${guide(yS(70))}${guide(yS(30))}<path class="sub-line a" d="${maPath(series.fast, x, yS)}"></path><path class="sub-line b" d="${maPath(
    series.slow,
    x,
    yS
  )}"></path>${label('100', top + 9)}${label('0', top + h)}`;
}

/* 悬浮详情里当前档位副图与 BOLL 的数值（FR-4.6） */
function candleIndicatorTip(data, i) {
  const { sub, subSeries, boll } = data;
  const sign = (v, digits = 2) => (Number.isFinite(v) ? `<b class="${v >= 0 ? 'up' : 'down'}">${fmtSigned(v, digits)}</b>` : '—');
  const plain = (v, digits = 2) => (Number.isFinite(v) ? fmtPrice(v, digits) : '—');
  let html = '';
  if (sub === 'macd' && subSeries) {
    html += `<span>DIF ${sign(subSeries.dif[i])}</span><span>DEA ${sign(subSeries.dea[i])}</span><span>MACD ${sign(subSeries.hist[i])}</span>`;
  } else if (sub === 'kdj' && subSeries) {
    html += `<span>K ${plain(subSeries.k[i], 1)}</span><span>D ${plain(subSeries.d[i], 1)}</span><span>J ${plain(subSeries.j[i], 1)}</span>`;
  } else if (sub === 'rsi' && subSeries) {
    html += `<span>RSI6 ${plain(subSeries.fast[i], 1)}</span><span>RSI12 ${plain(subSeries.slow[i], 1)}</span>`;
  }
  if (boll && Number.isFinite(boll.mid[i])) {
    html += `<span>布林 ${plain(boll.low[i])} / ${plain(boll.mid[i])} / ${plain(boll.up[i])}</span>`;
  }
  return html;
}

function renderCandlestick(points, opts = {}) {
  const rows = (Array.isArray(points) ? points : [])
    .map((p) => ({
      date: p.date,
      open: num(p.open),
      close: num(p.close),
      high: num(p.high),
      low: num(p.low),
      volume: num(p.volume, 0),
    }))
    .filter((p) => p.date && Number.isFinite(p.open) && Number.isFinite(p.close) && Number.isFinite(p.high) && Number.isFinite(p.low) && p.high >= p.low);

  const want = Math.min(opts.window || 240, 300);
  const pts = rows.slice(-Math.max(2, want));
  if (pts.length < 2) return '';

  /* 指标与几何：均线/BOLL/副图指标均基于完整历史计算，再截取窗口（FR-4） */
  const sub = normalizeSubMode(opts.sub);
  const subOk = subAvailable(sub, rows.length);
  const bollOn = !!opts.boll && rows.length >= 20;
  const allCloses = rows.map((p) => p.close);
  const allHighs = rows.map((p) => p.high);
  const allLows = rows.map((p) => p.low);
  const ma20Full = maSeries(allCloses, 20).slice(-pts.length);
  const ma60Full = maSeries(allCloses, 60).slice(-pts.length);
  const bollFull = bollOn ? bollCalc(allCloses) : null;
  const boll = bollFull
    ? { up: bollFull.up.slice(-pts.length), mid: bollFull.mid.slice(-pts.length), low: bollFull.low.slice(-pts.length) }
    : null;
  const subSeries =
    subOk && sub !== 'volume'
      ? sliceSeries(computeSubSeries(sub, { closes: allCloses, highs: allHighs, lows: allLows }), pts.length)
      : null;

  const padL = 8;
  const padR = 58;
  const mainTop = 10;
  const mainH = 208;
  const subTop = mainTop + mainH + 18;
  const subH = 58;
  const usableW = CANDLE_W - padL - padR;
  const n = pts.length;
  const slot = usableW / n;
  const bodyW = Math.max(1, Math.min(slot * 0.62, 13));
  const x = (i) => padL + slot * (i + 0.5);

  const lows = pts.map((p) => p.low);
  const highs = pts.map((p) => p.high);
  const mas = [...ma20Full, ...ma60Full, ...(boll ? [...boll.up, ...boll.low] : [])].filter(Number.isFinite);
  /* FR-5.1 目标价锚点：离现价区间超过 60% 跨度的目标价不参与缩放（避免压缩蜡烛） */
  let lo = Math.min(...lows, ...mas);
  let hi = Math.max(...highs, ...mas);
  const span0 = hi - lo || 1;
  const anchors = [];
  const anchorLabels = { high: '目标高', mid: '目标中', low: '目标低' };
  if (opts.targets) {
    ['high', 'mid', 'low'].forEach((k) => {
      const v = opts.targets[k];
      if (Number.isFinite(v) && v > 0 && v >= lo - span0 * 0.6 && v <= hi + span0 * 0.6) {
        anchors.push({ key: k, value: v });
      }
    });
    if (anchors.length) {
      lo = Math.min(lo, ...anchors.map((a) => a.value));
      hi = Math.max(hi, ...anchors.map((a) => a.value));
    }
  }
  const span = hi - lo || 1;
  const yP = (v) => mainTop + mainH - ((v - lo) / span) * mainH;

  const ticks = [0, 0.25, 0.5, 0.75, 1].map((r) => {
    const v = lo + span * (1 - r);
    return `<line class="candle-grid" x1="${padL}" y1="${(mainTop + mainH * r).toFixed(1)}" x2="${padL + usableW}" y2="${(
      mainTop +
      mainH * r
    ).toFixed(1)}"/><text class="candle-tick" x="${padL + usableW + 6}" y="${(mainTop + mainH * r + 3.5).toFixed(1)}">${fmtPrice(v)}</text>`;
  }).join('');

  const candles = pts
    .map((p, i) => {
      const up = p.close >= p.open;
      const bodyTop = yP(Math.max(p.open, p.close));
      const bodyH = Math.max(1, Math.abs(yP(p.open) - yP(p.close)));
      return `<g class="candle ${up ? 'up' : 'down'}" data-i="${i}"><line x1="${x(i).toFixed(1)}" y1="${yP(p.high).toFixed(
        1
      )}" x2="${x(i).toFixed(1)}" y2="${yP(p.low).toFixed(1)}"/><rect x="${(x(i) - bodyW / 2).toFixed(
        1
      )}" y="${bodyTop.toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bodyH.toFixed(1)}"/></g>`;
    })
    .join('');

  const ma20Path = maPath(ma20Full, x, yP);
  const ma60Path = maPath(ma60Full, x, yP);
  const bollSvg = boll
    ? `<path class="candle-boll-area" d="${bandAreaPath(boll.up, boll.low, x, yP)}"></path><path class="candle-boll" d="${maPath(
        boll.up,
        x,
        yP
      )}"></path><path class="candle-boll" d="${maPath(boll.low, x, yP)}"></path>`
    : '';
  /* FR-4.7：请求的副图档位数据不足时，降级为成交量副图 */
  const subSvg = subOk
    ? renderSubPanel(sub, subSeries, pts, x, subTop, subH, bodyW)
    : renderSubPanel('volume', null, pts, x, subTop, subH, bodyW);
  /* FR-5.1：目标价锚线（虚线 + 左上角标签） */
  const anchorsSvg = anchors
    .map(
      (a) => `<line class="target-line" x1="${padL}" y1="${yP(a.value).toFixed(1)}" x2="${padL + usableW}" y2="${yP(a.value).toFixed(
        1
      )}"/><text class="target-label" x="${padL + 4}" y="${(yP(a.value) - 3).toFixed(1)}">${esc(anchorLabels[a.key])} ${fmtPrice(a.value)}</text>`
    )
    .join('');

  const dateIdx = [0, Math.round((n - 1) / 3), Math.round(((n - 1) * 2) / 3), n - 1]
    .filter((v, i, a) => a.indexOf(v) === i)
    .map((i) => `<text class="candle-tick date" x="${x(i).toFixed(1)}" y="${subTop + subH + 15}">${esc(pts[i].date)}</text>`)
    .join('');

  const id = uid('cndl');
  CANDLE_STORE.set(id, {
    pts,
    geom: { padL, slot, n, mainTop, mainH, yP, subTop, subH },
    sub: subOk ? sub : 'volume',
    subSeries,
    boll,
  });

  const subLabel = KLINE_SUBS.find((s) => s.key === sub).label;
  return `<div class="candle-wrap">
    <svg class="candle-svg" viewBox="0 0 ${CANDLE_W} ${CANDLE_H}" preserveAspectRatio="none" role="img" data-candle-id="${id}"
      aria-label="K 线图：${n} 根蜡烛，副图 ${esc(subLabel)}${boll ? '，叠加布林带' : ''}">
      ${ticks}
      ${bollSvg}
      <path class="candle-ma ma60" d="${ma60Path}"></path>
      <path class="candle-ma ma20" d="${ma20Path}"></path>
      ${candles}
      ${anchorsSvg}
      ${subSvg}
      ${dateIdx}
      <line class="candle-cross-v" data-role="v" x1="0" y1="${mainTop}" x2="0" y2="${subTop + subH}" hidden></line>
      <line class="candle-cross-h" data-role="h" x1="${padL}" y1="0" x2="${padL + usableW}" y2="0" hidden></line>
      <rect class="candle-hover-layer" x="${padL}" y="${mainTop}" width="${usableW}" height="${subTop + subH - mainTop}" fill="transparent"></rect>
    </svg>
    <div class="candle-tip" hidden></div>
  </div>`;
}

/* 悬浮/点选交互：十字光标 + 详情浮层（FR-3.5，触屏点选 FR-3.8） */
function candleShowIndex(svg, i) {
  const data = CANDLE_STORE.get(svg.dataset.candleId);
  const wrap = svg.parentElement;
  if (!data || !wrap) return;
  const tip = wrap.querySelector('.candle-tip');
  const vline = svg.querySelector('[data-role="v"]');
  const hline = svg.querySelector('[data-role="h"]');
  const hot = svg.querySelector('.candle-hot');
  if (hot) hot.classList.remove('candle-hot');
  const { pts, geom } = data;

  if (i < 0 || i >= pts.length || !tip) {
    if (tip) tip.hidden = true;
    if (vline) vline.hidden = true;
    if (hline) hline.hidden = true;
    return;
  }

  const bar = svg.querySelector(`.candle[data-i="${i}"]`);
  if (bar) bar.classList.add('candle-hot');
  const gx = geom.padL + geom.slot * (i + 0.5);
  const p = pts[i];
  const prev = pts[i - 1];
  const chg = prev && Number.isFinite(prev.close) ? (p.close / prev.close - 1) * 100 : null;
  const up = p.close >= p.open;
  if (vline) {
    vline.setAttribute('x1', gx.toFixed(1));
    vline.setAttribute('x2', gx.toFixed(1));
    vline.hidden = false;
  }
  if (hline) {
    hline.setAttribute('y1', geom.yP(p.close).toFixed(1));
    hline.setAttribute('y2', geom.yP(p.close).toFixed(1));
    hline.hidden = false;
  }
  tip.innerHTML = `<b class="${up ? 'up' : 'down'}">${esc(p.date)}</b>
    <span>开 ${fmtPrice(p.open)}</span><span>收 <b class="${up ? 'up' : 'down'}">${fmtPrice(p.close)}</b></span>
    <span>高 ${fmtPrice(p.high)}</span><span>低 ${fmtPrice(p.low)}</span>
    ${chg !== null ? `<span class="${pctClass(chg)}">涨跌 ${fmtPct(chg)}</span>` : ''}
    <span>量 ${fmtVolCompact(p.volume)}</span>${candleIndicatorTip(data, i)}`;
  tip.hidden = false;
  const svgW = svg.clientWidth || CANDLE_W;
  const scale = svgW / CANDLE_W;
  const left = clamp(gx * scale - tip.offsetWidth / 2, 4, Math.max(4, wrap.clientWidth - tip.offsetWidth - 4));
  tip.style.left = `${left}px`;
}

function candleIndexFromEvent(svg, e) {
  const rect = svg.getBoundingClientRect();
  const vx = ((e.clientX - rect.left) / rect.width) * CANDLE_W;
  const data = CANDLE_STORE.get(svg.dataset.candleId);
  if (!data) return -1;
  const { padL, slot, n } = data.geom;
  return clamp(Math.floor((vx - padL) / slot), 0, n - 1);
}

function hydrateCandles(root = document) {
  /* 先清理已离开 DOM 的缓存，避免 Map 无限增长 */
  const alive = new Set($$('.candle-svg', root).map((svg) => svg.dataset.candleId));
  Array.from(CANDLE_STORE.keys()).forEach((id) => {
    if (!alive.has(id)) CANDLE_STORE.delete(id);
  });

  $$('.candle-svg', root).forEach((svg) => {
    if (svg.dataset.candleBound) return;
    svg.dataset.candleBound = '1';
    svg.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      candleShowIndex(svg, candleIndexFromEvent(svg, e));
    });
    svg.addEventListener('pointerdown', (e) => candleShowIndex(svg, candleIndexFromEvent(svg, e)));
    svg.addEventListener('pointerleave', () => candleShowIndex(svg, -1));
  });
}


/* ===== js/22-indicators.js ===== */
/* ============================================================
   Indicators — MACD / KDJ / RSI / BOLL，纯前端计算（FR-4）
   全部返回与输入等长的数组；数据不足的位置为 null，绝不产生 NaN
   ============================================================ */
'use strict';

/* 副图档位定义：min 为可用的最少数据条数（FR-4.7） */
const KLINE_SUBS = [
  { key: 'volume', label: '量', min: 2 },
  { key: 'macd', label: 'MACD', min: 34 },
  { key: 'kdj', label: 'KDJ', min: 9 },
  { key: 'rsi', label: 'RSI', min: 14 },
];

function normalizeSubMode(sub) {
  return KLINE_SUBS.some((s) => s.key === sub) ? sub : 'volume';
}

function subAvailable(sub, rowsCount) {
  const def = KLINE_SUBS.find((s) => s.key === sub);
  return !!def && rowsCount >= def.min;
}

/* 标准 EMA：首值作种子 */
function emaSeries(values, n) {
  const out = new Array(values.length).fill(null);
  if (!values.length || !Number.isFinite(values[0])) return out;
  let prev = values[0];
  out[0] = prev;
  const k = 2 / (n + 1);
  for (let i = 1; i < values.length; i++) {
    if (!Number.isFinite(values[i])) {
      out[i] = prev;
      continue;
    }
    prev = values[i] * k + prev * (1 - k);
    out[i] = prev;
  }
  return out;
}

/* MACD(12,26,9)：DIF=EMA12-EMA26，DEA=EMA9(DIF)，柱=(DIF-DEA)*2（国内口径） */
function macdCalc(closes, fast = 12, slow = 26, signal = 9) {
  const ef = emaSeries(closes, fast);
  const es = emaSeries(closes, slow);
  const dif = closes.map((_, i) => (Number.isFinite(ef[i]) && Number.isFinite(es[i]) ? ef[i] - es[i] : null));
  const allFinite = dif.every(Number.isFinite);
  const deaOut = allFinite ? emaSeries(dif, signal) : new Array(closes.length).fill(null);
  const hist = dif.map((v, i) => (Number.isFinite(v) && Number.isFinite(deaOut[i]) ? (v - deaOut[i]) * 2 : null));
  return { dif, dea: deaOut, hist };
}

/* KDJ(9,3,3)：RSV 后 K/D 平滑，J=3K-2D，初始 50 */
function kdjCalc(highs, lows, closes, n = 9) {
  const k = [];
  const d = [];
  const j = [];
  let pk = 50;
  let pd = 50;
  for (let i = 0; i < closes.length; i++) {
    const from = Math.max(0, i - n + 1);
    let hh = -Infinity;
    let ll = Infinity;
    for (let t = from; t <= i; t++) {
      if (Number.isFinite(highs[t])) hh = Math.max(hh, highs[t]);
      if (Number.isFinite(lows[t])) ll = Math.min(ll, lows[t]);
    }
    const rsv = hh === ll || !Number.isFinite(hh) ? 50 : ((closes[i] - ll) / (hh - ll)) * 100;
    pk = (2 / 3) * pk + (1 / 3) * rsv;
    pd = (2 / 3) * pd + (1 / 3) * pk;
    k.push(pk);
    d.push(pd);
    j.push(3 * pk - 2 * pd);
  }
  return { k, d, j };
}

/* RSI（Wilder 平滑口径）：前 n 期简单均值起算 */
function rsiSeries(closes, n) {
  const out = new Array(closes.length).fill(null);
  if (closes.length <= n) return out;
  let gain = 0;
  let loss = 0;
  for (let i = 1; i <= n; i++) {
    const c = closes[i] - closes[i - 1];
    if (c >= 0) gain += c;
    else loss -= c;
  }
  let ag = gain / n;
  let al = loss / n;
  out[n] = al === 0 ? 100 : (100 * ag) / (ag + al);
  for (let i = n + 1; i < closes.length; i++) {
    const c = closes[i] - closes[i - 1];
    ag = (ag * (n - 1) + Math.max(c, 0)) / n;
    al = (al * (n - 1) + Math.max(-c, 0)) / n;
    out[i] = al === 0 ? 100 : (100 * ag) / (ag + al);
  }
  return out;
}

function rsiCalc(closes, fast = 6, slow = 12) {
  return { fast: rsiSeries(closes, fast), slow: rsiSeries(closes, slow) };
}

/* BOLL(20,2)：中轨=MA20，上下轨=中轨±2σ（总体标准差） */
function bollCalc(closes, n = 20, mult = 2) {
  const up = [];
  const mid = [];
  const low = [];
  let sum = 0;
  let sum2 = 0;
  for (let i = 0; i < closes.length; i++) {
    sum += closes[i];
    sum2 += closes[i] * closes[i];
    if (i >= n) {
      sum -= closes[i - n];
      sum2 -= closes[i - n] * closes[i - n];
    }
    if (i >= n - 1) {
      const m = sum / n;
      const sd = Math.sqrt(Math.max(0, sum2 / n - m * m));
      mid.push(m);
      up.push(m + mult * sd);
      low.push(m - mult * sd);
    } else {
      mid.push(null);
      up.push(null);
      low.push(null);
    }
  }
  return { up, mid, low };
}

/* 按当前档位计算指标（基于完整历史，调用方自行截取窗口） */
function computeSubSeries(sub, data) {
  const { closes, highs, lows } = data;
  switch (sub) {
    case 'macd':
      return macdCalc(closes);
    case 'kdj':
      return kdjCalc(highs, lows, closes);
    case 'rsi':
      return rsiCalc(closes);
    default:
      return null; /* volume 直接用 points.volume */
  }
}

/* FR-6.2：自选股行情速览，批量接口一次拉取 */
async function loadWatchQuotes() {
  const list = watchlistGet();
  if (!list.length) return;
  const keys = list.map((s) => s.quoteKey).filter(Boolean);
  if (!keys.length) return;
  try {
    const map = await getQuoteBatch(keys);
    list.forEach((s) => {
      const q = map.get(s.quoteKey);
      if (!q) return;
      $$(`[data-wq="${s.quoteKey}"]`).forEach((el) => {
        const cls = pctClass(q.changePct);
        el.innerHTML = `<b class="${cls}">${fmtPrice(q.price, q.price < 10 ? 3 : 2)}</b><span class="${cls}">${fmtPct(
          q.changePct
        )}</span>`;
      });
    });
  } catch (e) {
    /* FR-6.5：失败显示占位，不阻塞其他标的 */
    $$('[data-wq]').forEach((el) => {
      el.textContent = '—';
    });
  }
}

/* 热门股行情：复用批量接口一次拉取（与自选股一致），并回填内存缓存保持 getQuote 口径一致 */
async function loadHotQuotes() {
  const keys = HOT_STOCKS.map((s) => s.quoteKey).filter(Boolean);
  if (!keys.length) return;
  try {
    const map = await getQuoteBatch(keys);
    keys.forEach((key) => {
      const q = map.get(key);
      if (!q) return;
      memCache.set('quote:' + key, { t: Date.now(), d: q });
      $$(`[data-chg="${key}"]`).forEach((el) => {
        el.textContent = fmtPct(q.changePct);
        el.classList.remove('up', 'down', 'flat');
        el.classList.add(pctClass(q.changePct));
      });
    });
  } catch (e) {
    /* 首页热门行情失败不影响主流程 */
  }
}

function dimRow(d) {
  return `<div class="dim-row ${d.available ? '' : 'unavailable'}">

  }</b>/100</span></div>

    <div class="dim-note" title="${esc(d.note)}">${esc(d.available ? d.note : '不可用 · ' + d.note)}</div>
  </div>`;
}

function renderFactorCard(score) {
  const explain = score.dims
    .map(
      (d) => `<div class="explain-item ${d.available ? '' : 'unavailable'}">
        <h4>${esc(d.name)} <span>权重 ${d.weight}% · ${d.available ? d.score + ' 分' : '不可用'}</span></h4>
        ${
          d.available
            ? `<ul>${d.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`
            : `<p>${esc(d.note)}，该维度不计入综合分，剩余维度按权重归一化。</p>`
        }
      </div>`
    )
    .join('');
  return `<article class="card factor-card">
    <div class="card-kicker">${ico('target')}四维因子 · 权重与依据</div>
    <div class="factor-grid">
      <div class="radar-wrap">${renderRadar(score.dims)}</div>
      <div class="dims">${score.dims.map(dimRow).join('')}</div>
    </div>
    <details class="score-explain" open>
      <summary>评分依据 <span>数据覆盖 ${score.coverage}% · ${score.missing.length ? `缺失 ${esc(score.missing.join('、'))}` : '四维齐全'}</span></summary>
      <div class="explain-grid">${explain}</div>
      <p class="inline-note">综合分 = 可用维度加权平均（研报 30% / 盈利 25% / 技术 25% / 舆情 20%），缺失维度从权重中剔除。评级、目标价、财务与情绪均来自公开数据，不做主观填充。</p>
    </details>
  </article>`;
}

function renderScoreCard(score, createdAt) {
  const coverageText = score.coverage === 100 ? '四维数据齐全' : `缺失 ${score.missing.join('、')}，已折算`;
  return `<aside class="card score-card">
    <div class="card-kicker">${ico('spark')}综合研判</div>
    ${renderGauge(score.total, score.verdict, score.coverage)}
    <p class="score-desc">${esc(score.desc)}</p>
    <div class="score-foot">
      <span class="confidence">${ico('shield', 'sm')}<span>数据覆盖 <b>${score.coverage}%</b><br>${esc(coverageText)}</span></span>
      <span class="score-mini-bars" title="数据覆盖 ${score.coverage}%">${renderScoreMiniBars(score.coverage)}</span>
    </div>
    <div class="score-updated">更新于 ${esc(
      createdAt.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
    )} · 评分不构成投资建议</div>
  </aside>`;
}

function chartPeriodTabs() {
  const cur = state.klinePeriod || 'day';
  return `<div class="kline-tabs" role="tablist" aria-label="K 线周期">${[['day', '日K'], ['week', '周K'], ['month', '月K']]
    .map(
      ([p, label]) =>
        `<button class="kline-tab ${cur === p ? 'active' : ''}" type="button" role="tab" aria-selected="${cur === p}" data-action="kline-period" data-period="${p}">${label}</button>`
    )
    .join('')}</div>`;
}

/* 副图档位 + BOLL 开关（FR-4.1 / FR-4.5 / FR-4.7） */
function chartSubControls(rowsCount) {
  const cur = state.subChart || 'volume';
  const tabs = KLINE_SUBS.map((s) => {
    const ok = subAvailable(s.key, rowsCount);
    return `<button class="kline-tab sub-tab ${cur === s.key ? 'active' : ''}" type="button" ${
      ok ? '' : 'disabled title="数据不足，无法计算"'
    } aria-pressed="${cur === s.key}" data-action="kline-sub" data-sub="${s.key}">${s.label}</button>`;
  }).join('');
  const bollOk = rowsCount >= 20;
  const boll = `<button class="kline-tab boll-tab ${state.bollOn ? 'active' : ''}" type="button" ${
    bollOk ? '' : 'disabled title="数据不足，无法计算"'
  } aria-pressed="${!!state.bollOn}" data-action="kline-boll">BOLL</button>`;
  return `<div class="kline-subhead">
    <span class="sub-label">副图</span>${tabs}${boll}
    ${subLegendHTML(cur)}
  </div>`;
}

function subLegendHTML(sub) {
  if (sub === 'macd') return `<span class="kline-legend" aria-hidden="true"><i class="a"></i>DIF<i class="b"></i>DEA</span>`;
  if (sub === 'kdj') return `<span class="kline-legend" aria-hidden="true"><i class="a"></i>K<i class="b"></i>D<i class="c"></i>J</span>`;
  if (sub === 'rsi') return `<span class="kline-legend" aria-hidden="true"><i class="a"></i>RSI6<i class="b"></i>RSI12</span>`;
  if (sub === 'volume') return `<span class="kline-legend" aria-hidden="true"><i class="vol"></i>成交量</span>`;
  return '';
}

/* FR-5.1：从研报数据提取目标价 高/中/低 三档锚点 */
function targetAnchors() {
  const list = Array.isArray(state.reports)
    ? state.reports.map((r) => num(r.target)).filter((v) => Number.isFinite(v) && v > 0)
    : [];
  if (!list.length) return null;
  const sorted = [...list].sort((a, b) => a - b);
  return {
    low: sorted[0],
    mid: sorted[Math.floor((sorted.length - 1) / 2)],
    high: sorted[sorted.length - 1],
    count: list.length,
  };
}

function renderChartSection(kline) {
  /* 指标事实区始终基于日线数据（周/月线仅用于蜡烛展示） */
  const dayK = (state.periodKlines && state.periodKlines.day) || (state.core && state.core.kline) || null;
  const m = dayK && dayK.metrics;
  const pts = kline.points;
  const period = kline.period || 'day';
  const periodLabel = { day: '日K', week: '周K', month: '月K' }[period] || '日K';
  const first = pts[0];
  const last = pts[pts.length - 1];
  /* FR-3.6：蜡烛渲染条件不满足时降级为原有 sparkline */
  const anchors = targetAnchors();
  const candles = renderCandlestick(pts, {
    window: period === 'day' ? 240 : period === 'week' ? 260 : 140,
    sub: state.subChart || 'volume',
    boll: !!state.bollOn,
    targets: anchors,
  });
  const chartBody = candles
    ? `<div class="kline-wrap">${candles}</div>`
    : `<div class="spark-wrap">${renderSparkline(pts)}</div>`;
  const facts = m
    ? `<div class="chart-facts">
    <div class="chart-fact"><label>近 20 日</label><strong class="${pctClass(m.r20)}">${fmtPct(m.r20)}</strong></div>
    <div class="chart-fact"><label>近 60 日</label><strong class="${pctClass(m.r60)}">${fmtPct(m.r60)}</strong></div>
    <div class="chart-fact"><label>近 120 日</label><strong class="${pctClass(m.r120)}">${fmtPct(m.r120)}</strong></div>
    <div class="chart-fact"><label>最大回撤</label><strong class="down">${fmtPct(m.maxDrawdown)}</strong></div>
    <div class="chart-fact"><label>均线形态</label><strong>${esc(m.trend)}</strong></div>
    <div class="chart-fact"><label>年化波动</label><strong>${ratioText(m.volatility)}</strong></div>
    <div class="chart-fact"><label>区间位置</label><strong>${fmtPrice(m.last)}</strong></div>
  </div>`
    : '';
  return `<article class="card chart-card">
    <div>
      <div class="chart-head"><strong>股价 K 线</strong>${chartPeriodTabs()}
        <span class="kline-legend" aria-hidden="true"><i class="ma20"></i>MA20<i class="ma60"></i>MA60</span>
        <span>${esc(fmtDate(first.date))} — ${esc(fmtDate(last.date))} · ${period === 'day' ? '前复权 · ' : ''}${pts.length} 根${periodLabel}</span></div>
      ${chartSubControls(pts.length)}
      ${anchors ? '<span class="kline-note">目标价为研报发布口径，前复权 K 线在最新交易日与实际价格基本一致</span>' : ''}
      ${chartBody}
    </div>
    ${facts}
  </article>`;
}

/* ---------------- reports ---------------- */
function reportItemHTML(r, showStock = false) {
  const title = r.pdf
    ? `<a href="${esc(r.pdf)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`
    : esc(r.title);
  const meta = [];
  if (r.org) meta.push(`<span class="org">${esc(r.org)}</span>`);
  if (showStock && r.stockName) meta.push(`<span>覆盖 ${esc(r.stockName)}</span>`);
  if (r.analyst) meta.push(`<span class="analyst">${esc(r.analyst)}</span>`);
  if (Number.isFinite(r.eps)) meta.push(`<span>预测 EPS ${fmtPrice(r.eps, 2)}</span>`);
  if (Number.isFinite(r.pe)) meta.push(`<span>预测 PE ${fmtPrice(r.pe, 1)}</span>`);
  if (Number.isFinite(r.target)) meta.push(`<span class="target">目标价 ${fmtPrice(r.target)}</span>`);
  const days = daysSince(r.rawDate);
  return `<div class="report-item" data-search="${esc(
    `${r.title} ${r.org} ${r.analyst} ${r.rating} ${r.stockName}`.toLowerCase()
  )}">
    <div class="report-date"><b>${esc(r.date)}</b><span>${days !== null && days >= 0 ? `${days} 天前` : ''}</span></div>
    <div class="report-main">
      <div class="report-title">${title}</div>
      <div class="report-meta">${meta.join('<span class="dot"></span>')}</div>
    </div>
    <div class="report-side">
      ${r.rating ? `<span class="rating-badge ${r.ratingCls}">${esc(r.ratingLabel)}</span>` : ''}
      ${
        r.pdf
          ? `<a class="pdf-link" href="${esc(r.pdf)}" target="_blank" rel="noopener noreferrer">${ico(
              'file',
              'sm'
            )}PDF${r.pages ? ' ' + r.pages + '页' : ''}</a>`
          : ''
      }
    </div>
  </div>`;
}

      desc: '研报接口可用，但没有检索到覆盖该股票的最新研报。可能是标的关注度较低，或近期无机构发布报告。',
