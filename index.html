<html lang="zh-CN" data-theme="dark">
<head>

<style>
/* ===== css/00-base.css ===== */
/* ============================================================
   研值 StockLens — base / shell
   ============================================================ */
:root{
  --bg:#070a11;
  --bg-2:#0b101a;
  --panel:rgba(16,23,36,.82);
  --panel-solid:#101724;
  --panel-2:rgba(22,31,48,.66);
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.13);
  --text:#e9eef8;
  --text-2:#c3cddd;
  --muted:#8996ad;
  --faint:#5b6880;
  --gold:#e7b45c;
  --gold-2:#f7d99a;
  --teal:#58d3c3;
  --blue:#7aa9ff;
  --red:#f07070;
  --green:#43c59e;
  --orange:#e99a5c;
  --violet:#b39df6;
  --up:var(--red);
  --down:var(--green);
  --shadow:0 22px 70px rgba(0,0,0,.38);
  --radius:20px;
  --radius-sm:12px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,"Times New Roman",serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#f3f1eb;
  --bg-2:#ebe8df;
  --panel:rgba(255,255,255,.84);
  --panel-solid:#fffdf8;
  --panel-2:rgba(245,242,234,.82);
  --line:rgba(33,42,58,.1);
  --line-2:rgba(33,42,58,.18);
  --text:#18202d;
  --text-2:#39465a;
  --muted:#68758a;
  --faint:#93a0b2;
  --gold:#a97623;
  --gold-2:#c79643;
  --teal:#1c9b8c;
  --blue:#3e6fd1;
  --red:#c94a4a;
  --green:#1e9272;
  --orange:#b96e2e;
  --violet:#7b62c9;
  --shadow:0 22px 60px rgba(45,50,65,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(1100px 650px at 15% -10%,rgba(231,180,92,.075),transparent 60%),
    radial-gradient(900px 600px at 95% 0%,rgba(88,211,195,.055),transparent 55%),
    var(--bg);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
html[data-theme="light"] body{
  background:
    radial-gradient(1100px 650px at 15% -10%,rgba(169,118,35,.08),transparent 60%),
    radial-gradient(900px 600px at 95% 0%,rgba(28,155,140,.06),transparent 55%),
    var(--bg);
}
body::selection{background:rgba(231,180,92,.3)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
::selection{background:rgba(231,180,92,.25)}

/* scrollbar */
*{scrollbar-width:thin;scrollbar-color:rgba(137,150,173,.35) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:rgba(137,150,173,.28);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ambient background */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient-glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.ambient-glow-a{width:520px;height:520px;left:-180px;top:-160px;background:rgba(231,180,92,.11)}
.ambient-glow-b{width:620px;height:620px;right:-260px;top:240px;background:rgba(88,211,195,.07)}
html[data-theme="light"] .ambient-glow{opacity:.45}
.ambient-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 20%,transparent 75%);
}
html[data-theme="light"] .ambient-grid{
  background-image:linear-gradient(rgba(24,32,45,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(24,32,45,.035) 1px,transparent 1px);
}

/* shell */
.topbar{
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid transparent;
  background:linear-gradient(180deg,rgba(7,10,17,.86),rgba(7,10,17,.62));
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  transition:border-color .2s ease,background .2s ease;
}
html[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(243,241,235,.9),rgba(243,241,235,.68))}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-inner{
  width:min(1240px,calc(100% - 48px));
  height:68px;margin:0 auto;
  display:flex;align-items:center;gap:22px;
}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;border-radius:10px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;
  color:#17120a;background:linear-gradient(145deg,var(--gold-2),var(--gold) 55%,#b9852f);
  font-family:var(--serif);font-size:21px;font-weight:700;
  box-shadow:0 6px 22px rgba(231,180,92,.24),inset 0 1px 0 rgba(255,255,255,.45);
}
.brand-mark.sm{width:32px;height:32px;font-size:17px;border-radius:9px}
.brand-copy{display:flex;flex-direction:column;line-height:1.05}
.brand-copy strong{font-family:var(--serif);font-size:19px;letter-spacing:.12em}
.brand-copy em{font-style:normal;font-size:8.5px;letter-spacing:.28em;color:var(--muted);margin-top:4px}
.top-search-trigger{
  margin-left:16px;flex:0 1 340px;
  height:38px;padding:0 12px;border-radius:11px;
  display:flex;align-items:center;gap:9px;
  color:var(--muted);font-size:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);
  transition:border-color .2s,color .2s,background .2s;
}
.top-search-trigger:hover{border-color:var(--line-2);color:var(--text-2);background:rgba(255,255,255,.04)}
.top-search-trigger kbd{
  margin-left:auto;padding:2px 6px;border:1px solid var(--line);border-radius:5px;
  font-family:var(--mono);font-size:10px;color:var(--faint);background:rgba(0,0,0,.12)
}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.market-live{
  display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px;
  border:1px solid var(--line);color:var(--faint);font-size:10.5px;letter-spacing:.06em;white-space:nowrap
}
.market-live i{width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 2.6s infinite}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.02);
  transition:color .2s,border-color .2s,background .2s,transform .2s;
}
.icon-btn:hover{color:var(--text);border-color:var(--line-2);background:rgba(255,255,255,.05);transform:translateY(-1px)}
.ico{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ico svg{width:100%;height:100%;display:block}
.ico.sm{width:15px;height:15px}
.ico.lg{width:24px;height:24px}

/* main / footer */
#view{position:relative;z-index:1;min-height:calc(100vh - 240px)}
.footer{position:relative;z-index:1;margin-top:88px;border-top:1px solid var(--line);background:rgba(7,10,17,.35)}
html[data-theme="light"] .footer{background:rgba(255,255,255,.4)}
.footer-inner{
  width:min(1180px,calc(100% - 48px));margin:0 auto;padding:34px 0 38px;
  display:flex;justify-content:space-between;gap:30px;align-items:flex-start;flex-wrap:wrap
}
.footer-brand{display:flex;gap:12px;align-items:flex-start}
.footer-brand strong{font-family:var(--serif);letter-spacing:.08em;font-size:15px}
.footer-brand p{margin-top:3px;color:var(--muted);font-size:12px}
.footer-meta{text-align:right;color:var(--faint);font-size:11.5px;line-height:1.8}
.footer-meta p:first-child{color:var(--muted)}

/* toast */
.toast-wrap{position:fixed;z-index:100;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  pointer-events:auto;max-width:min(520px,calc(100vw - 36px));
  padding:10px 15px;border-radius:12px;border:1px solid var(--line-2);
  background:rgba(19,27,42,.96);color:var(--text-2);font-size:12.5px;
  box-shadow:0 14px 40px rgba(0,0,0,.45);backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:9px;animation:toastIn .25s ease both;
}
html[data-theme="light"] .toast{background:rgba(255,253,248,.98)}
.toast.error{border-color:rgba(240,112,112,.35)}
.toast.error .ico{color:var(--red)}
.toast.ok .ico{color:var(--teal)}
.toast.out{animation:toastOut .2s ease both}
.noscript{padding:20px;text-align:center;background:#2a1d10;color:#ffd28a}

/* shared primitives */
.card{
  position:relative;
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,0) 42%),var(--panel);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
html[data-theme="light"] .card{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.68)),var(--panel)}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;
  font-size:10.5px;line-height:1.6;letter-spacing:.04em;white-space:nowrap;
  border:1px solid var(--line-2);color:var(--muted);background:rgba(255,255,255,.03)
}
.badge.gold{color:var(--gold);border-color:rgba(231,180,92,.28);background:rgba(231,180,92,.08)}
.badge.teal{color:var(--teal);border-color:rgba(88,211,195,.25);background:rgba(88,211,195,.07)}
.badge.red{color:var(--red);border-color:rgba(240,112,112,.25);background:rgba(240,112,112,.07)}
.badge.green{color:var(--green);border-color:rgba(67,197,158,.25);background:rgba(67,197,158,.07)}
.badge.blue{color:var(--blue);border-color:rgba(122,169,255,.25);background:rgba(122,169,255,.07)}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  height:31px;padding:0 12px;border-radius:20px;font-size:12px;
  color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.02);
  transition:all .18s ease;white-space:nowrap
}
.chip:hover,.chip.active{color:var(--text);border-color:rgba(231,180,92,.35);background:rgba(231,180,92,.09)}
.chip.active{color:var(--gold-2)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 15px;border-radius:10px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line-2);color:var(--text-2);background:rgba(255,255,255,.03);
  transition:all .18s ease;white-space:nowrap
}
.btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.24);transform:translateY(-1px)}
.btn.primary{color:#1b1408;border-color:transparent;background:linear-gradient(135deg,var(--gold-2),var(--gold))}
html[data-theme="light"] .btn.primary{background:linear-gradient(135deg,#f7d99a,#e7b45c);color:#1b1408}
.btn.primary:hover{filter:brightness(1.05);box-shadow:0 8px 24px rgba(231,180,92,.24)}
.btn.ghost{background:transparent}
.btn.sm{height:31px;padding:0 11px;font-size:11.5px;border-radius:8px}
.link{
  color:var(--gold);border-bottom:1px solid rgba(231,180,92,.3);
  transition:border-color .2s,color .2s
}
.link:hover{color:var(--gold-2);border-color:var(--gold-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)!important}
.down{color:var(--down)!important}
.flat{color:var(--muted)!important}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.gold{color:var(--gold)}
.teal{color:var(--teal)}
.blue{color:var(--blue)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* skeleton */
@keyframes shimmer{100%{transform:translateX(100%)}}
.skeleton{position:relative;overflow:hidden;background:rgba(255,255,255,.045);border-radius:8px}
html[data-theme="light"] .skeleton{background:rgba(24,32,45,.06)}
.skeleton::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
  animation:shimmer 1.4s infinite
}
.sk-line{height:12px;margin:8px 0}
.sk-line.w40{width:40%}.sk-line.w55{width:55%}.sk-line.w70{width:70%}.sk-line.w85{width:85%}
.sk-title{height:26px;width:38%;margin:4px 0 14px}

/* spinner */
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:var(--gold);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* print */
@media print{
  html{scroll-padding-top:0}
  body{background:#fff!important;color:#111!important;font-size:12px}
  .ambient,.topbar,.footer,.toast-wrap,.section-nav,.stock-actions,.no-print{display:none!important}
  #view{min-height:0}
  .card{box-shadow:none!important;border-color:#ddd!important;background:#fff!important;break-inside:avoid}
  .analysis-wrap{width:100%!important;padding:0!important}
  a{color:#111!important;border:0!important}
  .report-item,.peer-card,.news-item{break-inside:avoid}
}

@media (max-width:760px){
  .topbar-inner{width:calc(100% - 28px);height:60px;gap:12px}
  .brand-copy em{display:none}
  .brand-mark{width:34px;height:34px;font-size:18px}
  .brand-copy strong{font-size:17px}
  .market-live{display:none}
  .top-search-trigger{display:none!important}
  .footer-inner{width:calc(100% - 32px);flex-direction:column;gap:18px}
  .footer-meta{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}


/* ===== css/10-home.css ===== */
/* ============================================================
   Home / landing
   ============================================================ */
.home{
  width:min(1180px,calc(100% - 48px));
  margin:0 auto;padding:74px 0 0;
}
.hero{position:relative;max-width:940px;margin:0 auto;text-align:center;animation:fadeUp .55s ease both}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 11px 5px 9px;border:1px solid var(--line);border-radius:20px;
  color:var(--muted);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  background:rgba(255,255,255,.025)
}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 9px var(--teal)}
.hero h1{
  margin:26px auto 0;
  font-family:var(--serif);font-weight:600;
  font-size:clamp(42px,6.4vw,72px);line-height:1.12;letter-spacing:-.02em;
  color:var(--text);
}
.hero h1 span{
  background:linear-gradient(100deg,var(--gold-2) 5%,var(--gold) 45%,#c98f39 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .lede{
  max-width:640px;margin:20px auto 0;color:var(--muted);
  font-size:15px;line-height:1.9;
}
.search-shell{position:relative;max-width:760px;margin:34px auto 0;text-align:left}
.search-box{
  display:flex;align-items:center;gap:11px;
  padding:8px 8px 8px 17px;border-radius:16px;
  border:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),var(--panel-solid);
  box-shadow:0 24px 70px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .2s,box-shadow .2s
}
html[data-theme="light"] .search-box{background:linear-gradient(180deg,#fffdf9,#faf7ef);box-shadow:0 24px 60px rgba(50,45,35,.12)}
.search-box:focus-within{border-color:rgba(231,180,92,.55);box-shadow:0 24px 70px rgba(0,0,0,.34),0 0 0 3px rgba(231,180,92,.1)}
.search-box > .ico{color:var(--gold);width:20px;height:20px}
.search-box input{
  flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;
  font-size:14.5px;color:var(--text)
}
.search-box input::placeholder{color:var(--faint)}
.search-box .search-submit{
  height:44px;padding:0 20px;border-radius:11px;flex:0 0 auto;
  color:#1b1408;font-weight:700;font-size:13px;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));
  display:flex;align-items:center;gap:7px;
  transition:filter .2s,transform .2s
}
.search-box .search-submit:hover{filter:brightness(1.05);transform:translateY(-1px)}
.suggestions{
  position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;
  border:1px solid var(--line-2);border-radius:14px;overflow:hidden;
  background:rgba(15,22,35,.98);box-shadow:0 24px 60px rgba(0,0,0,.5);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
html[data-theme="light"] .suggestions{background:rgba(255,253,248,.99);box-shadow:0 24px 50px rgba(45,50,65,.18)}
.suggestions:empty{display:none}
.sug-item{
  width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:left;
  border-bottom:1px solid var(--line);transition:background .15s
}
.sug-item:last-child{border-bottom:0}
.sug-item:hover,.sug-item.active{background:rgba(231,180,92,.075)}
.sug-item .sug-name{font-size:13.5px;font-weight:600;color:var(--text)}
.sug-item .sug-code{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:2px}
.sug-item .sug-pinyin{margin-left:auto;font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.sug-hint{padding:8px 14px;font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.sug-empty{padding:16px;color:var(--muted);font-size:12.5px;text-align:center}
.hot-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:11.5px;color:var(--faint)}
.hot-row .hot-label{margin-right:2px}
.hot-chip{padding:4px 9px;border-radius:6px;border:1px solid transparent;color:var(--muted);transition:all .16s}
.hot-chip:hover{color:var(--gold-2);border-color:rgba(231,180,92,.22);background:rgba(231,180,92,.06)}

/* 自选股速览（FR-6） */
.watch-item{display:inline-flex;align-items:center}
.watch-item .watch-chip{border-top-right-radius:0;border-bottom-right-radius:0}
.watch-remove{padding:4px 6px;border:1px solid transparent;border-left:none;border-radius:0 6px 6px 0;color:var(--faint);background:transparent;cursor:pointer;line-height:1;transition:all .16s}
.watch-remove:hover{color:var(--red);border-color:rgba(240,112,112,.25)}
.watch-quote{margin-left:7px;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;font-size:11px}
.watch-quote b{font-weight:600}
.watch-quote .up{color:var(--up)}
.watch-quote .down{color:var(--down)}
.demo-link{display:inline-flex;align-items:center;gap:5px;margin-top:14px;font-size:11px;color:var(--faint);border-bottom:1px dashed var(--line-2);padding-bottom:1px}
.demo-link:hover{color:var(--gold)}

.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;max-width:760px;margin:46px auto 0;
  border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);
}
.hero-stat{padding:17px 20px;background:var(--panel-solid);text-align:left}
.hero-stat strong{display:block;font-family:var(--serif);font-size:19px;color:var(--text);letter-spacing:.02em}
.hero-stat span{display:block;margin-top:2px;font-size:10.5px;color:var(--faint);letter-spacing:.08em}

.features{margin-top:76px}
.section-kicker{
  display:flex;align-items:center;gap:10px;color:var(--faint);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase
}
.section-kicker::before{content:"";width:24px;height:1px;background:var(--gold);opacity:.6}
.features-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
.features-head h2{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.01em;margin-top:8px}
.features-head p{max-width:420px;color:var(--muted);font-size:12.5px;text-align:right}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.feature-card{
  position:relative;padding:22px 20px 20px;min-height:186px;overflow:hidden;
  transition:transform .22s,border-color .22s,background .22s
}
.feature-card:hover{transform:translateY(-3px);border-color:var(--line-2)}
.feature-card .feature-num{
  position:absolute;right:16px;top:13px;font-family:var(--serif);font-size:30px;
  color:rgba(255,255,255,.055);line-height:1
}
html[data-theme="light"] .feature-card .feature-num{color:rgba(24,32,45,.07)}
.feature-icon{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:var(--gold);border:1px solid rgba(231,180,92,.2);background:rgba(231,180,92,.07);
  margin-bottom:16px
}
.feature-card h3{font-size:14px;font-weight:600;letter-spacing:.01em}
.feature-card p{margin-top:7px;color:var(--muted);font-size:11.8px;line-height:1.8}
.feature-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}
.feature-tags span{font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

.coverage{
  margin-top:62px;padding:28px 30px;
  display:grid;grid-template-columns:1.1fr 1.3fr;gap:34px;align-items:start
}
.coverage h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:7px}
.coverage p{margin-top:10px;color:var(--muted);font-size:12.3px;line-height:1.9}
.coverage-list{display:flex;flex-direction:column;gap:9px}
.coverage-row{display:flex;align-items:flex-start;gap:10px;font-size:11.8px;color:var(--muted);line-height:1.7}
.coverage-row .ico{color:var(--teal);margin-top:2px}
.coverage-row.warn .ico{color:var(--orange)}
.coverage-row strong{color:var(--text-2);font-weight:600}
.coverage-foot{
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--faint);font-size:10.5px;line-height:1.8
}

@media (max-width:980px){
  .feature-grid{grid-template-columns:repeat(2,1fr)}
  .coverage{grid-template-columns:1fr;gap:20px}
}
@media (max-width:760px){
  .home{width:calc(100% - 28px);padding-top:44px}
  .hero h1{margin-top:20px}
  .hero .lede{font-size:13px;line-height:1.85;padding:0 6px}
  .search-shell{margin-top:26px}
  .search-box{padding-left:13px;border-radius:14px}
  .search-box input{font-size:13px;height:40px}
  .search-box .search-submit{height:40px;padding:0 13px;font-size:12px}
  .search-box .search-submit span{display:none}
  .hot-row{justify-content:flex-start;padding:0 2px}
  .hero-stats{grid-template-columns:1fr;margin-top:32px}
  .hero-stat{padding:13px 16px;display:flex;align-items:baseline;gap:10px}
  .hero-stat strong{font-size:15px}
  .hero-stat span{margin:0}
  .features{margin-top:52px}
  .features-head{flex-direction:column;align-items:flex-start;gap:6px}
  .features-head p{text-align:left}
  .features-head h2{font-size:25px}
  .feature-grid{grid-template-columns:1fr}
  .feature-card{min-height:0}
  .coverage{padding:22px 20px;margin-top:44px}
}


/* ===== css/20-analysis.css ===== */
/* ============================================================
   Analysis page
   ============================================================ */
.analysis-wrap{width:min(1180px,calc(100% - 48px));margin:0 auto;padding:28px 0 0;position:relative}
.crumb{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11px;letter-spacing:.02em;flex-wrap:wrap}
.crumb a{color:var(--muted);transition:color .2s}
.crumb a:hover{color:var(--gold)}
.crumb .sep{opacity:.5}
.crumb .badge{margin-left:2px}
.stock-head{
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:28px;align-items:end;padding:20px 0 20px;border-bottom:1px solid var(--line);
}
.stock-title h1{
  font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.2vw,44px);
  line-height:1.15;letter-spacing:-.015em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap
}
.stock-title h1 .code{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--faint);letter-spacing:.02em}
.stock-tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.stock-sub{margin-top:8px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.stock-sub .mini-sep{width:1px;height:11px;background:var(--line-2);display:inline-block}
.stock-price{text-align:right;min-width:190px}
.price-row{display:flex;align-items:baseline;justify-content:flex-end;gap:10px}
.price-main{font-size:38px;line-height:1;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.price-main.small{font-size:30px}
.price-change{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.price-time{margin-top:8px;font-size:10.5px;color:var(--faint)}
.stock-actions{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.metric-strip{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:16px;
  background:rgba(255,255,255,.015)
}
.metric{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.metric:last-child{border-right:0}
.metric label{display:block;font-size:10px;color:var(--faint);letter-spacing:.06em;white-space:nowrap}
.metric strong{display:block;margin-top:3px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric strong small{font-size:9.5px;color:var(--faint);font-weight:400;margin-left:2px}

.section-nav{
  position:sticky;top:68px;z-index:20;display:flex;align-items:center;gap:2px;
  margin:14px 0 22px;padding:6px 0;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg) 20%,rgba(7,10,17,.82));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
html[data-theme="light"] .section-nav{background:linear-gradient(180deg,var(--bg) 20%,rgba(243,241,235,.86))}
.section-nav a{
  padding:5px 12px;border-radius:7px;font-size:11.5px;color:var(--muted);
  transition:color .16s,background .16s;white-space:nowrap
}
.section-nav a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.section-nav .nav-live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--faint)}
.section-nav .nav-live i{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:pulse 2.4s infinite}

.overview-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
.score-card{padding:24px 24px 22px;display:flex;flex-direction:column;overflow:hidden}
.score-card::before{
  content:"";position:absolute;width:240px;height:240px;right:-80px;top:-100px;border-radius:50%;
  background:radial-gradient(circle,rgba(231,180,92,.12),transparent 70%);pointer-events:none
}
.card-kicker{display:flex;align-items:center;gap:7px;color:var(--faint);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.card-kicker .ico{color:var(--gold)}
.gauge{position:relative;width:210px;height:210px;margin:10px auto 4px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge-track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:10}
html[data-theme="light"] .gauge-track{stroke:rgba(24,32,45,.08)}
.gauge-fill{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),stroke .3s}
.gauge-fill.strong{stroke:var(--gold)}
.gauge-fill.bull{stroke:var(--teal)}
.gauge-fill.neutral{stroke:var(--blue)}
.gauge-fill.bear{stroke:var(--orange)}
.gauge-fill.weak{stroke:var(--red)}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.score-num{font-family:var(--serif);font-size:58px;line-height:.95;letter-spacing:-.04em;color:var(--text)}
.score-num small{font-size:13px;color:var(--faint);font-family:var(--sans);letter-spacing:0;margin-left:2px}
.verdict-pill{
  margin-top:7px;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line-2);color:var(--muted)
}
.verdict-pill.strong{color:var(--gold);border-color:rgba(231,180,92,.35);background:rgba(231,180,92,.09)}
.verdict-pill.bull{color:var(--teal);border-color:rgba(88,211,195,.3);background:rgba(88,211,195,.08)}
.verdict-pill.neutral{color:var(--blue);border-color:rgba(122,169,255,.3);background:rgba(122,169,255,.08)}
.verdict-pill.bear{color:var(--orange);border-color:rgba(233,154,92,.3);background:rgba(233,154,92,.08)}
.verdict-pill.weak{color:var(--red);border-color:rgba(240,112,112,.3);background:rgba(240,112,112,.08)}
.score-desc{margin-top:10px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7;min-height:38px}
.score-foot{
  margin-top:auto;padding-top:14px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:10px;color:var(--faint)
}
.score-foot .confidence{display:flex;align-items:center;gap:5px}
.score-foot .confidence b{color:var(--text-2);font-weight:600}
.score-mini-bars{display:flex;gap:3px}
.score-mini-bars i{width:4px;height:12px;border-radius:2px;background:rgba(255,255,255,.1)}
.score-mini-bars i.on{background:var(--gold)}

.factor-card{padding:20px 22px 20px}
.factor-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:center;margin-top:10px}
.radar-wrap{position:relative;min-width:0}
.radar-wrap svg{width:100%;height:auto;overflow:visible}
.radar-grid{fill:none;stroke:rgba(255,255,255,.075);stroke-width:1}
html[data-theme="light"] .radar-grid{stroke:rgba(24,32,45,.1)}
.radar-axis{stroke:rgba(255,255,255,.075);stroke-width:1}
html[data-theme="light"] .radar-axis{stroke:rgba(24,32,45,.1)}
.radar-area{fill:rgba(231,180,92,.14);stroke:var(--gold);stroke-width:1.8;stroke-linejoin:round}
.radar-dot{fill:var(--gold);stroke:var(--bg);stroke-width:2}
.radar-label{fill:var(--muted);font-size:9.5px;font-family:var(--sans)}
.radar-value{fill:var(--text-2);font-size:9px;font-family:var(--mono)}
.dims{display:flex;flex-direction:column;gap:13px;min-width:0}
.dim-row{min-width:0}
.dim-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11.5px}
.dim-top span:first-child{color:var(--text-2);font-weight:600}
.dim-score{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.dim-score b{color:var(--text);font-weight:600;font-size:12px}
.dim-bar{height:5px;border-radius:5px;background:rgba(255,255,255,.065);margin-top:6px;overflow:hidden}
html[data-theme="light"] .dim-bar{background:rgba(24,32,45,.07)}
.dim-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .9s ease}
.dim-bar.unavailable i{width:100%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 4px,transparent 4px 8px)}
.dim-note{margin-top:4px;color:var(--faint);font-size:9.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chart-card{padding:18px 22px 14px;margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center}
.chart-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chart-head strong{font-size:12px;font-weight:600}
.chart-head span{font-size:10px;color:var(--faint)}
.spark-wrap{margin-top:6px;height:92px}
.spark-wrap svg{width:100%;height:100%;overflow:visible}
.spark-line{fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.spark-area{fill:url(#sparkFill)}
.spark-dot{fill:var(--gold)}
.spark-guide{stroke:rgba(255,255,255,.06);stroke-dasharray:3 4}
.chart-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;border-left:1px solid var(--line);padding-left:22px}
.chart-fact label{display:block;font-size:9.5px;color:var(--faint)}
.chart-fact strong{display:block;font-size:13px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}

/* K 线模块（FR-3.1 ~ FR-3.9） */
.kline-tabs{display:inline-flex;gap:4px}
.kline-tab{border:1px solid var(--line-2);background:transparent;color:var(--faint);font-size:10px;font-family:inherit;line-height:1;padding:4px 10px;border-radius:999px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.kline-tab:hover{color:var(--text-2);border-color:var(--muted)}
.kline-tab.active{color:var(--gold-2);border-color:var(--gold);background:rgba(231,180,92,.1)}
html[data-theme="light"] .kline-tab.active{background:rgba(169,118,35,.1)}
.kline-legend{font-size:10px;color:var(--faint)}
.kline-legend i{display:inline-block;width:14px;height:2px;border-radius:2px;vertical-align:middle;margin:0 4px 2px 8px;background:var(--gold)}
.kline-legend i.ma60{background:var(--blue)}
.kline-legend i.b{background:var(--blue)}
.kline-legend i.c{background:var(--violet)}
.kline-legend i.vol{background:var(--muted)}
.kline-subhead{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px}
.sub-label{font-size:10px;color:var(--faint)}
.kline-tab:disabled{opacity:.4;cursor:not-allowed}
.kline-note{font-size:10px;color:var(--faint)}
.watch-btn.on{color:var(--gold-2);border-color:rgba(231,180,92,.4)}
html[data-theme="light"] .watch-btn.on{color:var(--gold);border-color:rgba(169,118,35,.4)}
.target-line{stroke:var(--gold-2);stroke-width:1;stroke-dasharray:5 4;opacity:.75}
.target-label{fill:var(--gold-2);font-size:9.5px}
.candle-guide{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.sub-hist{opacity:.7}
.sub-hist.up{fill:var(--up)}
.sub-hist.down{fill:var(--down)}
.sub-line{fill:none;stroke-width:1.2;stroke-linejoin:round}
.sub-line.a{stroke:var(--gold)}
.sub-line.b{stroke:var(--blue)}
.sub-line.c{stroke:var(--violet)}
.candle-boll{fill:none;stroke:var(--blue);stroke-width:1;stroke-dasharray:4 3;opacity:.75}
.candle-boll-area{fill:rgba(122,169,255,.08);stroke:none}
html[data-theme="light"] .candle-boll-area{fill:rgba(62,111,209,.08)}
.kline-wrap{margin-top:8px}
.candle-svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.candle-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4;opacity:.72}
.candle-axis{stroke:var(--line-2);stroke-width:1}
.candle-tick{fill:var(--faint);font-size:9.5px;font-variant-numeric:tabular-nums}
.candle-tick.date{text-anchor:middle}
.candle-sep{stroke:var(--line);stroke-width:1}
.candle line{stroke-width:1.2}
.candle.up line{stroke:var(--up)}
.candle.down line{stroke:var(--down)}
.candle rect{fill:var(--up)}
.candle.down rect{fill:var(--down)}
.candle-hot rect{stroke:var(--gold-2);stroke-width:.8}
.candle-ma{fill:none;stroke-width:1.4;stroke-linejoin:round}
.candle-ma.ma20{stroke:var(--gold)}
.candle-ma.ma60{stroke:var(--blue)}
.vol-bar{opacity:.5}
.vol-bar.up{fill:var(--up)}
.vol-bar.down{fill:var(--down)}
.candle-base{stroke:var(--line-2);stroke-width:1}
.candle-vol-max{fill:var(--faint);font-size:9px;font-variant-numeric:tabular-nums}
.candle-panel-tag{fill:var(--faint);font-size:8.5px;letter-spacing:.08em}
.candle-last{stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.candle-last.up{stroke:var(--up)}
.candle-last.down{stroke:var(--down)}
.candle-last-tag rect{stroke:none}
.candle-last-tag.up rect{fill:var(--up)}
.candle-last-tag.down rect{fill:var(--down)}
.candle-last-tag text{fill:#fff;font-size:9px;font-variant-numeric:tabular-nums}
.candle-yp rect{fill:var(--panel-solid);stroke:var(--line-2);stroke-width:1}
.candle-yp text{fill:var(--text);font-size:9px;font-variant-numeric:tabular-nums}
.candle-hint{margin-top:2px;text-align:center;font-size:9px;color:var(--faint);opacity:.8}
.kline-zoom{display:inline-flex;gap:4px;margin-left:2px}
.kline-meta{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.candle-cross-v,.candle-cross-h{stroke:var(--gold-2);stroke-width:1;stroke-dasharray:3 3;opacity:.55;pointer-events:none}
.candle-hover-layer{cursor:crosshair}
.candle-tip{position:absolute;top:6px;left:0;z-index:3;display:flex;flex-wrap:wrap;gap:2px 10px;padding:7px 10px;font-size:10.5px;line-height:1.5;color:var(--text-2);background:var(--panel-solid);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);pointer-events:none;min-width:150px;max-width:min(440px,calc(100% - 8px));box-sizing:border-box}
.candle-tip b{font-weight:600;color:var(--text)}
.candle-tip .up{color:var(--up)}
.candle-tip .down{color:var(--down)}
.kline-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:46px 0;font-size:11.5px;color:var(--muted)}

/* sections */
.section-block{scroll-margin-top:110px;margin-top:40px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px;flex-wrap:wrap}
.section-title{display:flex;gap:13px;align-items:flex-start}
.section-num{
  font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.08em;
  padding-top:7px;min-width:20px
}
.section-title h2{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.25;letter-spacing:-.01em}
.section-title p{margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.6}
.section-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.section-tools .filter-input{
  height:31px;padding:0 11px;border:1px solid var(--line);border-radius:8px;
  background:rgba(255,255,255,.025);color:var(--text);font-size:11.5px;width:150px;outline:0
}
.section-tools .filter-input:focus{border-color:rgba(231,180,92,.4)}
.section-tools .filter-input::placeholder{color:var(--faint)}

/* reports */
.report-list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.012)}
.report-item{
  display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:16px;
  padding:15px 18px;border-bottom:1px solid var(--line);align-items:start;
  transition:background .16s
}
.report-item:last-child{border-bottom:0}
.report-item:hover{background:rgba(255,255,255,.025)}
html[data-theme="light"] .report-item:hover{background:rgba(24,32,45,.025)}
.report-date{font-family:var(--mono);font-size:10px;color:var(--faint);padding-top:2px;line-height:1.55;white-space:nowrap}
.report-date b{display:block;color:var(--muted);font-weight:500}
.report-main{min-width:0}
.report-title{
  font-size:13px;font-weight:600;line-height:1.55;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.report-title a:hover{color:var(--gold-2)}
.report-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--faint)}
.report-meta .org{color:var(--muted);font-weight:500}
.report-meta .dot{width:2px;height:2px;border-radius:50%;background:var(--faint)}
.report-meta .analyst{color:var(--faint)}
.report-meta .target{color:var(--gold)}
.report-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:72px}
.rating-badge{
  display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:5px;
  font-size:10px;font-weight:700;letter-spacing:.03em;border:1px solid var(--line-2);color:var(--muted)
}
.rating-badge.red{color:var(--red);border-color:rgba(240,112,112,.3);background:rgba(240,112,112,.07)}
.rating-badge.orange{color:var(--orange);border-color:rgba(233,154,92,.3);background:rgba(233,154,92,.07)}
.rating-badge.blue{color:var(--blue);border-color:rgba(122,169,255,.3);background:rgba(122,169,255,.07)}
.rating-badge.green{color:var(--green);border-color:rgba(67,197,158,.3);background:rgba(67,197,158,.07)}
.pdf-link{
  display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:var(--faint);
  padding:3px 6px;border-radius:5px;border:1px solid transparent;transition:all .16s
}
.pdf-link:hover{color:var(--gold);border-color:rgba(231,180,92,.25);background:rgba(231,180,92,.06)}

/* peers */
.peer-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.peer-group{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.012)}
.peer-group-head{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.peer-group-head .ico{color:var(--gold)}
.peer-group-head h3{font-size:12px;font-weight:600;letter-spacing:.02em}
.peer-group-head .badge{margin-left:auto}
.peer-card{padding:13px 0;border-bottom:1px solid var(--line)}
.peer-card:last-child{border-bottom:0;padding-bottom:2px}
.peer-top{display:flex;align-items:center;gap:10px}
.peer-rank{
  width:21px;height:21px;border-radius:6px;display:grid;place-items:center;
  font-family:var(--mono);font-size:9.5px;color:var(--gold);
  border:1px solid rgba(231,180,92,.25);background:rgba(231,180,92,.06);flex:0 0 auto
}
.peer-name{font-size:12.5px;font-weight:600}
.peer-code{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-left:5px}
.peer-stat{margin-left:auto;text-align:right;font-size:11px;font-variant-numeric:tabular-nums}
.peer-stat label{display:block;font-size:8.5px;color:var(--faint);letter-spacing:.05em}
.peer-reports{margin-top:8px;padding-left:31px;display:flex;flex-direction:column;gap:5px}
.peer-report-line{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);min-width:0}
.peer-report-line time{font-family:var(--mono);color:var(--faint);font-size:9px;flex:0 0 auto}
.peer-report-line a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peer-report-line a:hover{color:var(--gold)}
.peer-report-line .mini-rating{font-size:8.5px;color:var(--gold);border:1px solid rgba(231,180,92,.22);padding:0 4px;border-radius:3px;flex:0 0 auto}
.peer-empty{font-size:9.5px;color:var(--faint);padding:4px 0}
.peer-foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:9px;color:var(--faint);line-height:1.6}
.peer-foot a{color:var(--muted)}
.peer-foot a:hover{color:var(--gold)}

/* news */
.news-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.sentiment-card{padding:18px}
.sentiment-title{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600}
.sentiment-title .ico{color:var(--teal)}
.sentiment-big{margin-top:14px;display:flex;align-items:baseline;gap:6px}
.sentiment-big strong{font-family:var(--serif);font-size:40px;line-height:1;color:var(--text)}
.sentiment-big span{font-size:10px;color:var(--faint)}
.sentiment-label{margin-top:4px;font-size:11px;color:var(--muted)}
.senti-bar{display:flex;height:7px;border-radius:6px;overflow:hidden;margin-top:16px;background:rgba(255,255,255,.05)}
.senti-bar i{display:block;height:100%}
.senti-bar .pos{background:var(--red)}
.senti-bar .neu{background:rgba(137,150,173,.45)}
.senti-bar .neg{background:var(--green)}
.senti-legend{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:9px;color:var(--faint)}
.senti-legend span{display:flex;align-items:center;gap:4px}
.senti-legend i{width:5px;height:5px;border-radius:50%}
.senti-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:9.5px;color:var(--faint);line-height:1.7}
.news-list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.012)}
.news-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);transition:background .16s}
.news-item:last-child{border-bottom:0}
.news-item:hover{background:rgba(255,255,255,.025)}
.news-title{font-size:12px;font-weight:500;line-height:1.55;color:var(--text-2)}
.news-title a:hover{color:var(--gold-2)}
.news-meta{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:9.5px;color:var(--faint);flex-wrap:wrap}
.news-meta .dot{width:2px;height:2px;border-radius:50%;background:var(--faint)}
.news-tags{display:flex;align-items:flex-start;gap:4px;flex-direction:column}
.senti-tag{font-size:8.5px;padding:1px 5px;border-radius:3px;white-space:nowrap;border:1px solid var(--line)}
.senti-tag.pos{color:var(--red);border-color:rgba(240,112,112,.25);background:rgba(240,112,112,.06)}
.senti-tag.neg{color:var(--green);border-color:rgba(67,197,158,.25);background:rgba(67,197,158,.06)}
.senti-tag.neu{color:var(--muted);background:rgba(255,255,255,.02)}

/* empty / error / status */
.empty-state{
  padding:34px 24px;text-align:center;border:1px dashed var(--line-2);border-radius:16px;
  background:rgba(255,255,255,.012)
}
.empty-state .empty-icon{
  width:44px;height:44px;margin:0 auto 11px;border-radius:12px;display:grid;place-items:center;
  color:var(--faint);border:1px solid var(--line);background:rgba(255,255,255,.025)
}
.empty-state h3{font-size:13px;font-weight:600;color:var(--text-2)}
.empty-state p{max-width:560px;margin:6px auto 0;font-size:11px;color:var(--faint);line-height:1.8}
.empty-state .btn{margin-top:13px}
.empty-links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.empty-links a{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:5px}
.empty-links a:hover{color:var(--gold);border-color:rgba(231,180,92,.3)}
.error-box{
  padding:18px 20px;border:1px solid rgba(240,112,112,.25);border-radius:14px;
  background:rgba(240,112,112,.045);display:flex;align-items:flex-start;gap:12px
}
.error-box .ico{color:var(--red);margin-top:2px}
.error-box h4{font-size:12px;color:var(--text-2);font-weight:600}
.error-box p{margin-top:3px;font-size:10.5px;color:var(--muted);line-height:1.7}
.error-box .btn{margin-top:10px}
.loading-card{padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.012)}
.loading-row{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);margin-bottom:12px}
.loading-row .spinner{width:14px;height:14px;border-width:1.5px}
.source-note{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--faint);margin-top:8px;flex-wrap:wrap}
.source-note .dot{width:2px;height:2px;border-radius:50%;background:var(--faint)}

/* status pills in header */
.data-status{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:var(--faint);border:1px solid var(--line);padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.015)}
.status-pill i{width:4px;height:4px;border-radius:50%;background:var(--faint)}
.status-pill.ok i{background:var(--teal);box-shadow:0 0 6px rgba(88,211,195,.5)}
.status-pill.loading i{background:var(--gold);animation:pulse 1.2s infinite}
.status-pill.error i{background:var(--red)}
.status-pill.empty i{background:var(--orange)}

/* analysis skeleton */
.analysis-skeleton .sk-head{height:100px}
.report-skeleton{padding:0}
.report-skeleton .row{display:flex;gap:16px;padding:17px 18px;border-bottom:1px solid var(--line)}

/* misc */
.inline-note{font-size:10px;color:var(--faint);line-height:1.7}
.divider{height:1px;background:var(--line);margin:16px 0}
.share-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.copy-btn{font-size:10px;color:var(--faint);display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:5px}
.copy-btn:hover{color:var(--gold);background:rgba(231,180,92,.06)}

@media (max-width:980px){
  .overview-grid{grid-template-columns:1fr}
  .factor-grid{grid-template-columns:220px minmax(0,1fr)}
  .chart-card{grid-template-columns:1fr}
  .chart-facts{border-left:0;border-top:1px solid var(--line);padding:14px 0 0;grid-template-columns:repeat(4,1fr)}
  .peer-columns{grid-template-columns:1fr}
  .news-grid{grid-template-columns:1fr}
  .news-grid .sentiment-card{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;align-items:center}
  .sentiment-big{margin-top:0}
  .senti-bar,.senti-legend{grid-column:1/-1;margin-top:0}
  .senti-note{grid-column:1/-1;margin-top:0}
  .analysis-wrap{width:calc(100% - 36px)}
  .metric-strip{grid-template-columns:repeat(3,1fr)}
  .metric:nth-child(3n){border-right:0}
  .metric:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media (max-width:760px){
  .analysis-wrap{width:calc(100% - 28px);padding-top:18px}
  .stock-head{grid-template-columns:1fr;gap:14px;align-items:start}
  .stock-price{text-align:left;min-width:0}
  .price-row{justify-content:flex-start}
  .price-main{font-size:32px}
  .stock-actions{justify-content:flex-start}
  .stock-title h1{font-size:32px}
  .metric-strip{grid-template-columns:repeat(2,1fr)}
  .metric:nth-child(2n){border-right:0}
  .metric:nth-child(3n){border-right:1px solid var(--line)}
  .metric:nth-child(-n+4){border-bottom:1px solid var(--line)}
  .metric:nth-child(5),.metric:nth-child(6){border-bottom:0}
  .section-nav{top:60px;overflow-x:auto;scrollbar-width:none}
  .section-nav::-webkit-scrollbar{display:none}
  .section-nav .nav-live{display:none}
  .factor-grid{grid-template-columns:1fr;gap:8px}
  .radar-wrap{max-width:300px;margin:0 auto}
  .chart-facts{grid-template-columns:1fr 1fr}
  .report-item{grid-template-columns:1fr;gap:7px;padding:14px 15px}
  .report-date{display:flex;gap:6px;align-items:center;padding:0}
  .report-date b{display:inline}
  .report-side{flex-direction:row;align-items:center;justify-content:flex-start}
  .section-title h2{font-size:22px}
  .section-tools{width:100%}
  .section-tools .filter-input{flex:1}
  .score-card{padding:20px}
  .chart-card{padding:16px 18px 12px}
  .peer-group,.news-grid .sentiment-card{padding:15px}
  .peer-reports{padding-left:0}
  .news-grid .sentiment-card{display:block}
  .sentiment-big{margin-top:10px}
  .senti-bar{margin-top:12px}
  .news-item{padding:12px 14px}
}


/* ===== css/21-modules.css ===== */
/* ============================================================
   Module styles — score explanation, financials, small bits
   ============================================================ */
.hot-chip{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.02);border:1px solid transparent;
}
.hot-chip .hot-chg{
  font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0;
  min-width:38px;text-align:right;
}
.recent-row{margin-top:9px}
.demo-link .ico{width:13px;height:13px}

.dim-top em{font-style:normal;font-size:8.5px;color:var(--faint);font-weight:400;margin-left:4px;letter-spacing:.02em}
.score-updated{
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-size:8.5px;color:var(--faint);text-align:center;letter-spacing:.02em
}
.score-explain{margin-top:17px;padding-top:14px;border-top:1px solid var(--line)}
.score-explain summary{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  cursor:pointer;font-size:11px;font-weight:600;color:var(--text-2);list-style:none
}
.score-explain summary::-webkit-details-marker{display:none}
.score-explain summary::before{content:"+";display:inline-block;width:13px;color:var(--gold);font-family:var(--mono);font-weight:400}
.score-explain[open] summary::before{content:"−"}
.score-explain summary span{margin-left:auto;font-weight:400;font-size:9px;color:var(--faint);text-align:right}
.explain-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-top:12px}
.explain-item h4{font-size:10.5px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.explain-item h4 span{margin-left:5px;font-weight:400;font-size:9px;color:var(--faint)}
.explain-item ul{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.explain-item li{
  position:relative;padding-left:9px;font-size:9.5px;color:var(--muted);line-height:1.65
}
.explain-item li::before{content:"";position:absolute;left:0;top:.72em;width:3px;height:3px;border-radius:50%;background:var(--faint)}
.explain-item p{font-size:9.5px;color:var(--faint);line-height:1.7;margin-top:4px}
.explain-item.unavailable{opacity:.72}
.score-explain .inline-note{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.chart-axis{display:flex;justify-content:space-between;gap:10px;font-size:8.5px;color:var(--faint);font-family:var(--mono);padding-top:2px}
.analysis-foot{
  margin-top:58px;padding:18px 0 8px;border-top:1px solid var(--line);
  text-align:center;font-size:9.5px;color:var(--faint);line-height:1.8
}
.section-nav a.active{color:var(--gold);background:rgba(231,180,92,.07)}
.peer-name{
  display:inline;padding:0;font-size:12.5px;font-weight:600;line-height:inherit;
  color:var(--text);text-align:left;transition:color .16s
}
.peer-name:hover{color:var(--gold-2)}

.financial-card{padding:20px 22px}
.fin-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.fin-head .card-kicker{margin-bottom:5px}
.fin-period{font-family:var(--serif);font-size:21px;letter-spacing:-.01em}
.fin-period span{font-family:var(--sans);font-size:10px;color:var(--faint);font-weight:400;margin-left:4px}
.fin-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)
}
.fin-item{padding:13px 15px;background:var(--panel-solid);min-width:0}
html[data-theme="light"] .fin-item{background:rgba(255,255,255,.72)}
.fin-item label{display:block;font-size:9px;color:var(--faint);letter-spacing:.05em}
.fin-item strong{
  display:block;margin-top:3px;font-size:15px;font-weight:600;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.fin-item span{display:block;margin-top:1px;font-size:9px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fin-history{margin-top:15px;overflow-x:auto}
.fin-history table{width:100%;border-collapse:collapse;font-size:10.5px;font-variant-numeric:tabular-nums}
.fin-history th{
  text-align:left;font-weight:500;color:var(--faint);font-size:9px;letter-spacing:.05em;
  padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap
}
.fin-history td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.fin-history tr:last-child td{border-bottom:0}

@media (max-width:980px){
  .explain-grid{grid-template-columns:1fr}
  .fin-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .fin-grid{grid-template-columns:1fr 1fr}
  .financial-card{padding:16px}
  .fin-period{font-size:18px}
  .score-explain summary{flex-direction:column;gap:2px}
  .score-explain summary span{margin-left:13px;text-align:left}
  .chart-axis span:nth-child(2){display:none}
}
@media print{
  .score-explain{break-inside:avoid}
  .fin-item{background:#fff!important}
  .fin-grid,.fin-history th,.fin-history td{border-color:#ddd!important}
}


/* ===== css/22-technical.css ===== */
/* ============================================================
   Technical module styles — 技术研判独立章节
   信号语义色遵循项目红涨绿跌惯例（--up / --down）
   ============================================================ */

/* ---------- 综合研判卡 ---------- */
.tech-consensus{padding:20px 22px;margin-bottom:16px}
.tech-source{font-size:9px;color:var(--faint);letter-spacing:.02em;text-transform:none;margin-left:auto}
.tech-consensus-main{display:flex;align-items:center;gap:24px;margin-top:14px;flex-wrap:wrap}
.tech-score-ring{position:relative;width:132px;height:132px;flex:none}
.tech-score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tech-ring-track{fill:none;stroke:var(--line);stroke-width:9}
.tech-ring-fill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .8s ease}
.tech-score-ring.bullish .tech-ring-fill{stroke:var(--up)}
.tech-score-ring.bearish .tech-ring-fill{stroke:var(--down)}
.tech-score-ring.neutral .tech-ring-fill{stroke:var(--gold)}
.tech-score-ring.unavailable .tech-ring-fill{stroke:var(--faint)}
.tech-score-inner{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px
}
.tech-score-inner strong{font-family:var(--serif);font-size:37px;line-height:1;letter-spacing:-.03em}
.tech-score-inner span{font-size:10px;color:var(--muted);letter-spacing:.06em}
.tech-consensus-text{flex:1;min-width:240px}
.tech-consensus-text>p{font-size:12px;line-height:1.75;color:var(--text-2);margin:0 0 12px}
.tech-votes{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;font-variant-numeric:tabular-nums}
.tech-votes span{font-weight:600}
.tech-votes .bullish{color:var(--up)}
.tech-votes .bearish{color:var(--down)}
.tech-votes .neutral{color:var(--gold)}
.tech-votes .muted{color:var(--faint)}
.tech-divergence{
  display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:11px;
  border-top:1px dashed var(--line);font-size:10px;color:var(--muted)
}
.tech-divergence.warn{color:var(--orange)}
.tech-divergence .ico{width:13px;height:13px;flex:none}
.tech-consensus-empty{padding:22px 0;font-size:12px;color:var(--muted)}

/* ---------- 雷达 + 说明双栏 ---------- */
.tech-overview-grid{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:16px;margin-bottom:16px}
.tech-radar-card{padding:16px 18px;display:flex;flex-direction:column}
.tech-radar-wrap{display:flex;align-items:center;justify-content:center;flex:1;min-height:200px}
.tech-radar-wrap svg{width:100%;max-width:236px;height:auto;overflow:visible}
.tech-radar-grid{fill:none;stroke:var(--line);stroke-width:1}
.tech-radar-axis{stroke:var(--line);stroke-width:1}
.tech-radar-area{fill:var(--gold);fill-opacity:.14;stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round}
.tech-radar-area.bullish{fill:var(--up);stroke:var(--up)}
.tech-radar-area.bearish{fill:var(--down);stroke:var(--down)}
.tech-radar-dot{fill:var(--gold)}
.tech-radar-label{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.tech-summary-card{padding:16px 20px}
.tech-summary-list{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:9px 18px}
.tech-summary-list li{
  display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);
  font-variant-numeric:tabular-nums
}
.tech-summary-list b{color:var(--text-2);font-weight:600;min-width:30px}
.tech-sum-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
.tech-sum-dot.bullish{background:var(--up)}
.tech-sum-dot.bearish{background:var(--down)}
.tech-sum-dot.neutral{background:var(--gold)}
.tech-note{
  margin-top:15px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:9.5px;color:var(--faint);line-height:1.7
}

/* ---------- 五维详情卡 ---------- */
.tech-dim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tech-dim{padding:16px 18px;border-left:2px solid var(--line)}
.tech-dim.bullish{border-left-color:var(--up)}
.tech-dim.bearish{border-left-color:var(--down)}
.tech-dim.neutral{border-left-color:var(--gold)}
.tech-dim.unavailable{opacity:.66}
.tech-dim-head{display:flex;align-items:flex-start;gap:11px}
.tech-dim-icon{color:var(--gold);flex:none;margin-top:1px}
.tech-dim-icon .ico{width:18px;height:18px}
.tech-dim-title{flex:1;min-width:0}
.tech-dim-title h4{font-size:12.5px;font-weight:600;color:var(--text);margin:0;letter-spacing:.01em}
.tech-dim-title p{font-size:9px;color:var(--faint);margin:2px 0 0}
.tech-dim-score{text-align:right;flex:none;line-height:1}
.tech-dim-score b{font-family:var(--serif);font-size:22px;font-weight:600}
.tech-dim-score small{font-size:9px;color:var(--faint);margin-left:1px}
.tech-dim-score.bullish b{color:var(--up)}
.tech-dim-score.bearish b{color:var(--down)}
.tech-dim-score.neutral b{color:var(--gold)}
.tech-dim-signal{
  display:flex;align-items:center;gap:9px;margin:12px 0 10px;
  font-size:10px;color:var(--muted);line-height:1.55
}
.tech-sig{
  display:inline-flex;align-items:center;gap:4px;flex:none;
  padding:3px 8px;border-radius:6px;font-size:9.5px;font-weight:600;
  border:1px solid var(--line-2)
}
.tech-sig .ico{width:12px;height:12px}
.tech-sig.bullish{color:var(--up);border-color:rgba(240,112,112,.3);background:rgba(240,112,112,.08)}
.tech-sig.bearish{color:var(--down);border-color:rgba(67,197,158,.3);background:rgba(67,197,158,.08)}
.tech-sig.neutral{color:var(--gold);border-color:rgba(231,180,92,.3);background:rgba(231,180,92,.08)}
.tech-sig.unavailable{color:var(--faint)}
.tech-details{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.tech-details li{
  position:relative;padding-left:12px;font-size:10px;color:var(--muted);line-height:1.65
}
.tech-details li::before{
  content:"";position:absolute;left:0;top:.68em;width:4px;height:4px;
  border-radius:50%;background:var(--faint)
}
.tech-unavailable{font-size:10.5px;color:var(--faint);line-height:1.7;margin:12px 0 0}

html[data-theme="light"] .tech-sig.bullish{background:rgba(201,74,74,.07)}
html[data-theme="light"] .tech-sig.bearish{background:rgba(30,146,114,.07)}
html[data-theme="light"] .tech-sig.neutral{background:rgba(169,118,35,.07)}

@media (max-width:980px){
  .tech-overview-grid{grid-template-columns:1fr}
  .tech-dim-grid{grid-template-columns:1fr}
  .tech-radar-card{min-height:auto}
}
@media (max-width:560px){
  .tech-consensus{padding:16px}
  .tech-consensus-main{gap:14px}
  .tech-score-ring{width:106px;height:106px}
  .tech-score-inner strong{font-size:30px}
  .tech-summary-list{grid-template-columns:1fr}
  .tech-votes{gap:10px}
}
@media print{
  .tech-dim{break-inside:avoid;background:#fff!important}
  .tech-radar-area{fill-opacity:.06}
}


/* ===== css/23-screener.css ===== */
/* ============================================================
   高分榜 / 反向选股 样式
   ============================================================ */
.screener-page{max-width:1180px;margin:0 auto;padding:46px 22px 80px}

/* hero */
.screener-hero{margin-bottom:26px}
.screener-hero h1{font-family:var(--serif);font-size:clamp(30px,5vw,46px);line-height:1.28;margin:14px 0 12px;letter-spacing:.01em}
.screener-hero h1 span{color:var(--gold)}
.screener-hero .lede{max-width:760px;color:var(--text-2);font-size:14px;margin:0 0 12px}
.screener-hero-note{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}

/* controls */
.screener-controls{padding:16px 18px;margin-bottom:20px}
.screener-control-main{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.screener-range{display:flex;flex-direction:column;gap:5px;flex:1 1 300px;min-width:240px}
.screener-range>span:first-child{font-size:12px;color:var(--text-2)}
.screener-range b{color:var(--gold);font-size:16px;font-family:var(--mono)}
.screener-range input[type="range"]{width:100%;accent-color:var(--gold);cursor:pointer;height:18px}
.range-hint{font-size:10px;color:var(--faint)}
.screener-size{display:flex;flex-direction:column;gap:5px}
.screener-size>span{font-size:12px;color:var(--text-2)}
.screener-size select{height:34px;padding:0 10px;color:var(--text);background:var(--panel-solid);border:1px solid var(--line-2);border-radius:9px;font-family:var(--sans);font-size:12px;cursor:pointer}
.screener-progress{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.screener-progress-track{flex:1;height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.screener-progress-track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--teal));transition:width .3s ease}
.screener-progress>span{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* summary */
.screener-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.ss-card{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.ss-card>span{font-size:11px;color:var(--muted)}
.ss-card b{font-family:var(--mono);font-size:27px;line-height:1.2;color:var(--text)}
.ss-card small{font-size:10px;color:var(--faint)}
.ss-card.gold b{color:var(--gold)}
.ss-card.teal b{color:var(--teal)}
.screener-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:10px}
.screener-notice{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:10px;font-size:12px;margin-bottom:12px}
.screener-notice b{font-family:var(--mono)}
.screener-notice.ok{color:var(--teal);background:rgba(88,211,195,.08);border:1px solid rgba(88,211,195,.22)}
.screener-notice.warn{color:var(--gold);background:rgba(231,180,92,.08);border:1px solid rgba(231,180,92,.22)}
.screener-disclaimer{margin-top:18px}

/* table */
.screener-table-card{padding:0;overflow:hidden}
.screener-table-scroll{overflow-x:auto}
.screener-table{width:100%;border-collapse:collapse;font-size:12px;min-width:980px}
.screener-table th{text-align:left;padding:12px 12px;font-size:10.5px;font-weight:500;color:var(--muted);background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.03em}
.screener-table td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.screener-table tbody tr:last-child td{border-bottom:none}
.screener-row:hover{background:rgba(255,255,255,.025)}
.screener-row.hit{background:linear-gradient(90deg,rgba(231,180,92,.1),transparent 60%)}
.screener-row.nodata{opacity:.5}
.sr-rank{white-space:nowrap}
.rank-num{font-family:var(--mono);font-size:14px;color:var(--muted)}
.rank-num.gold{color:var(--gold);font-weight:700}
.hit-mark{display:inline-block;margin-left:6px;font-size:9px;color:var(--gold);border:1px solid rgba(231,180,92,.3);border-radius:5px;padding:0 4px}
.sr-name{min-width:150px}
.sr-stock-btn{display:block;font-size:12.5px;color:var(--text);background:none;border:none;padding:0;cursor:pointer;text-align:left;font-weight:600}
.sr-stock-btn:hover{color:var(--gold)}
.sr-stock-btn .hot-chg{display:none}
.sr-meta{font-size:10px;color:var(--faint);font-family:var(--mono)}
.sr-price{white-space:nowrap;font-variant-numeric:tabular-nums}
.sr-price b{display:block;font-family:var(--mono);font-size:12.5px}
.sr-price span{font-size:10.5px;font-family:var(--mono)}
.sr-score{white-space:nowrap}
.sr-score-num{display:inline-block;font-family:var(--mono);font-size:21px;font-weight:700;line-height:1;vertical-align:middle;margin-right:7px}
.sr-dims{min-width:290px}
.sd-cell{display:grid;grid-template-columns:30px 1fr 25px;align-items:center;gap:7px;margin:2px 0;font-size:10px}
.sd-label{color:var(--muted)}
.sd-bar{height:5px;border-radius:5px;background:var(--panel-2);overflow:hidden}
.sd-bar i{display:block;height:100%;border-radius:5px}
.sd-bar i.teal{background:var(--teal)}
.sd-bar i.blue{background:var(--blue)}
.sd-bar i.orange{background:var(--orange)}
.sd-bar i.red{background:var(--red)}
.sd-bar i.muted{background:var(--faint)}
.sd-num{font-family:var(--mono);text-align:right;color:var(--text-2)}
.sd-num.muted{color:var(--faint)}
.sr-cover{white-space:nowrap}
.sr-action{text-align:right}

/* empty */
.screener-empty{padding:26px}

/* topbar nav button */
.top-nav-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel-2);color:var(--text-2);font-size:11.5px;cursor:pointer;transition:.18s}
.top-nav-btn:hover{color:var(--gold);border-color:rgba(231,180,92,.35);transform:translateY(-1px)}
.top-nav-btn.active{color:var(--gold);border-color:rgba(231,180,92,.45);background:rgba(231,180,92,.09)}
.top-nav-btn .ico{width:15px;height:15px}
.top-nav-btn .ico svg{width:15px;height:15px}

/* home CTA */
.home-cta-row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:14px}
.home-cta-row .demo-link{margin-top:0}
.home-cta-row .btn.etf-cta{color:#08201c;border-color:transparent;background:var(--teal)}
html[data-theme="light"] .home-cta-row .btn.etf-cta{background:#58d3c3;color:#08201c}
.home-cta-row .btn.etf-cta:hover{filter:brightness(1.05);box-shadow:0 8px 24px rgba(88,211,195,.22)}

/* ETF 高分榜：五维列略宽于四维 */
.etf-screener-table .sr-dims{min-width:340px}

@media(max-width:860px){
  .screener-summary{grid-template-columns:repeat(2,1fr)}
  .screener-page{padding:32px 16px 60px}
}
@media(max-width:520px){
  .top-nav-label{display:none}
  .top-nav-btn{padding:0 9px}
  .screener-summary{grid-template-columns:repeat(2,1fr)}
  .screener-control-main{gap:12px}
}

@media print{
  .screener-controls,.top-nav-btn,.screener-action,.sr-action{display:none!important}
  .screener-page{padding:0;max-width:none}
  .screener-table{min-width:0}
}


/* ===== css/24-home-boards.css ===== */
/* ============================================================
   首页双榜单 — 成交热门 / 主力净流入
   ============================================================ */
.home-boards{margin-top:70px}
.boards-head{margin-bottom:22px}
.boards-head h2{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.01em;margin-top:8px}
.boards-head p{color:var(--muted);font-size:12.5px;margin-top:6px}
.boards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

.board-card{padding:18px 14px 12px;min-width:0}
.board-card-head{display:flex;align-items:center;gap:12px;padding:2px 8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;row-gap:8px}
.board-head-main{flex:1 1 auto;min-width:0}
.board-update{margin-left:auto;display:flex;align-items:center;gap:7px;flex:0 0 auto}
.board-time{font-size:10px;color:var(--faint);font-family:var(--mono);white-space:nowrap;letter-spacing:.01em}
.board-time.error{color:var(--down)}
.board-refresh{
  width:27px;height:27px;padding:0;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;
  transition:color .16s,border-color .16s,background .16s
}
.board-refresh:hover{color:var(--gold);border-color:rgba(231,180,92,.32);background:rgba(231,180,92,.08)}
.board-refresh:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.board-refresh:disabled{opacity:.6;cursor:default}
.board-refresh .ico,.board-refresh .ico svg{width:14px;height:14px}
.board-refresh.loading .ico svg{animation:spin .8s linear infinite}
.board-ico{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  color:var(--gold);background:rgba(231,180,92,.1);border:1px solid rgba(231,180,92,.22)
}
.board-ico.inflow{color:var(--red);background:rgba(240,112,112,.1);border-color:rgba(240,112,112,.22)}
.board-ico .ico{width:21px;height:21px}
.board-ico .ico svg{width:21px;height:21px}
.board-card-head h3{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
.board-head-main span{display:block;font-size:10.5px;color:var(--faint);margin-top:2px}

.board-list{padding-top:6px}
.board-row{
  width:100%;display:grid;grid-template-columns:26px 1fr auto auto;align-items:center;gap:10px;
  padding:9px 8px;border:none;border-bottom:1px solid var(--line);border-radius:8px;
  background:transparent;color:var(--text);text-align:left;cursor:pointer;transition:background .16s;
  font-family:var(--sans)
}
.board-row:last-child{border-bottom:none}
.board-row:hover{background:rgba(255,255,255,.035)}
.board-row:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.br-rank{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center}
.br-rank.top{color:var(--gold);font-weight:700}
.br-name{min-width:0;display:flex;flex-direction:column}
.br-name b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-name small{font-size:10px;color:var(--faint);font-family:var(--mono)}
.br-quote{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.br-quote b{font-family:var(--mono);font-size:12px}
.br-quote small{font-size:10px;font-family:var(--mono)}
.br-metric{
  min-width:66px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--text-2);
  padding:3px 7px;border-radius:6px;background:var(--panel-2);white-space:nowrap
}
.board-empty{display:flex;align-items:center;justify-content:center;gap:8px;padding:34px 10px;color:var(--muted);font-size:12px}

@media(max-width:860px){
  .boards-grid{grid-template-columns:1fr}
  .home-boards{margin-top:54px}
  .boards-head h2{font-size:25px}
}
@media(max-width:520px){
  .board-row{grid-template-columns:22px 1fr auto;gap:8px}
  .br-metric{grid-column:3;min-width:0}
  .br-quote{display:none}
  .board-update{width:100%;margin-left:0;justify-content:space-between;padding-top:1px}
}

@media print{
  .board-row{break-inside:avoid}
  .board-card{box-shadow:none}
  .board-refresh{display:none}
}


/* ===== css/25-etf.css ===== */
/* ============================================================
   ETF 研判模块样式 — 首页 ETF 榜 + ETF 专属研判页
   复用 base/analysis 变量与布局，仅补充 ETF 专属区块。
   红涨绿跌沿用 --up/--down，明暗主题自动适配。
   ============================================================ */

/* 首页 ETF 榜卡片：单卡占满一行更舒展 */
.home-boards.etf-board{margin-top:26px}
.etf-board .boards-grid{grid-template-columns:1fr}
.board-ico.etf{color:var(--violet);background:rgba(179,157,246,.1);border-color:rgba(179,157,246,.22)}
.etf-board .board-card-head h3{color:var(--violet)}

/* ETF 页：行业主题标签与研报说明 */
.etf-industry-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 16px;margin-bottom:12px;border:1px solid var(--line);
  border-radius:12px;background:rgba(88,211,195,.05);font-size:11.5px;color:var(--muted)
}
html[data-theme="light"] .etf-industry-head{background:rgba(15,110,86,.045)}
.etf-report-list{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.etf-report-item{padding:14px 17px;border-bottom:1px solid var(--line);transition:background .16s}
.etf-report-item:last-child{border-bottom:0}
.etf-report-item:hover{background:rgba(255,255,255,.025)}
html[data-theme="light"] .etf-report-item:hover{background:rgba(24,32,45,.025)}
.etf-report-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.etf-report-org{font-size:11px;font-weight:600;color:var(--gold)}
.etf-report-date{font-family:var(--mono);font-size:10px;color:var(--faint)}
.etf-report-rating{font-size:10px;color:var(--up);border:1px solid rgba(240,112,112,.3);border-radius:6px;padding:1px 7px}
.etf-report-item h4{font-size:13px;line-height:1.55;margin:0 0 5px;font-weight:600}
.etf-report-item h4 a{color:var(--text);text-decoration:none}
.etf-report-item h4 a:hover{color:var(--gold)}
.etf-report-item p{font-size:11.5px;line-height:1.6;color:var(--muted);margin:0}

/* ETF 头部 industry 徽标使用 teal 语义色 */
.badge.teal{color:var(--teal);border-color:rgba(88,211,195,.32);background:rgba(88,211,195,.08)}

@media (max-width: 640px){
  .etf-industry-head{font-size:11px;padding:11px 13px}
  .etf-report-item{padding:12px 13px}
}

@media print{
  .etf-report-item,.etf-industry-head{break-inside:avoid}
}


/* ===== css/26-crypto.css ===== */
/* ============================================================
   加密资产模块样式 — 首页加密榜 + 加密专属研判页
   复用 base/analysis 变量与布局，仅补充加密区块。
   ============================================================ */

/* 首页加密榜：单卡占满一行 */
.home-boards.crypto-board{margin-top:26px}
.crypto-board .boards-grid{grid-template-columns:1fr}
.board-ico.crypto{color:var(--gold);background:rgba(231,180,92,.1);border-color:rgba(231,180,92,.24)}
.crypto-board .board-card-head h3{color:var(--gold)}
.crypto-board .boards-head p{max-width:860px}
.crypto-hot-row .hot-chip .hot-chg{font-variant-numeric:tabular-nums}

/* 徽标语义色 */
.badge.violet{color:var(--violet);border-color:rgba(179,157,246,.34);background:rgba(179,157,246,.09)}

/* 研判页合规提示 */
.crypto-risk{
  display:flex;align-items:flex-start;gap:9px;margin-top:12px;padding:11px 14px;
  border:1px solid rgba(231,180,92,.22);border-radius:12px;
  background:rgba(231,180,92,.055);font-size:11.5px;line-height:1.65;color:var(--muted)
}
.crypto-risk .ico{color:var(--gold);flex:none;margin-top:1px}
html[data-theme="light"] .crypto-risk{background:rgba(169,118,35,.05)}

/* 合约指标卡 */
.crypto-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.crypto-stat{
  display:flex;flex-direction:column;gap:4px;padding:15px 16px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel)
}
.crypto-stat label{font-size:11px;color:var(--muted)}
.crypto-stat strong{font-family:var(--mono);font-size:21px;line-height:1.25;color:var(--text);font-variant-numeric:tabular-nums}
.crypto-stat strong.up{color:var(--up)}
.crypto-stat strong.down{color:var(--down)}
.crypto-stat small{font-size:10px;color:var(--faint)}

async function cached(key, ttl, loader, force = false) {
  const now = Date.now();
  if (!force) {
    const mem = memCache.get(key);
    if (mem && now - mem.t < ttl) return mem.d;
    const disk = readLocal('sl:c:' + key);
    if (disk && now - disk.t < ttl) {
      memSet(key, disk);
      return disk.d;
    }
  }
  /* force 时不复用 inflight，保证手动刷新一定发起新请求（FR-19.6） */
  if (!force && inflight.has(key)) return inflight.get(key);
  const p = loader()
    .then((d) => {
      const entry = { t: Date.now(), d };
      memSet(key, entry);
      writeLocal('sl:c:' + key, entry);
      return d;
    })
    .finally(() => {
      if (inflight.get(key) === p) inflight.delete(key);
    });
  inflight.set(key, p);
  return p;
}

function toast(message, type = 'info', ms = 3200) {

  wrap.appendChild(el);

}

/* 分钟 K 线按周期收紧时效：5m 图最多滞后 1 根，15m/60m 相应放宽（FR-19.6） */
const KLINE_TTL = {

  week: 10 * 60 * 1000,
  month: 10 * 60 * 1000,
  '5m': 60 * 1000,
  '15m': 90 * 1000,
  '60m': 2 * 60 * 1000,
