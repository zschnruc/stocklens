<html lang="zh-CN" data-theme="dark">

<style>
/* ===== css/00-base.css ===== */
/* ============================================================
   研值 StockLens — base / shell
   ============================================================ */
:root{
  --bg:#070a11;
  --bg-2:#0b101a;
  --panel:rgba(16,23,36,.82);
  --panel-solid:#101724;
  --panel-2:rgba(22,31,48,.66);
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.13);
  --text:#e9eef8;
  --text-2:#c3cddd;
  --muted:#8996ad;
  --faint:#5b6880;
  --gold:#e7b45c;
  --gold-2:#f7d99a;
  --teal:#58d3c3;
  --blue:#7aa9ff;
  --red:#f07070;
  --green:#43c59e;
  --orange:#e99a5c;
  --violet:#b39df6;
  --up:var(--red);
  --down:var(--green);
  --shadow:0 22px 70px rgba(0,0,0,.38);
  --radius:20px;
  --radius-sm:12px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,"Times New Roman",serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#f3f1eb;
  --bg-2:#ebe8df;
  --panel:rgba(255,255,255,.84);
  --panel-solid:#fffdf8;
  --panel-2:rgba(245,242,234,.82);
  --line:rgba(33,42,58,.1);
  --line-2:rgba(33,42,58,.18);
  --text:#18202d;
  --text-2:#39465a;
  --muted:#68758a;
  --faint:#93a0b2;
  --gold:#a97623;
  --gold-2:#c79643;
  --teal:#1c9b8c;
  --blue:#3e6fd1;
  --red:#c94a4a;
  --green:#1e9272;
  --orange:#b96e2e;
  --violet:#7b62c9;
  --shadow:0 22px 60px rgba(45,50,65,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(1100px 650px at 15% -10%,rgba(231,180,92,.075),transparent 60%),
    radial-gradient(900px 600px at 95% 0%,rgba(88,211,195,.055),transparent 55%),
    var(--bg);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
html[data-theme="light"] body{
  background:
    radial-gradient(1100px 650px at 15% -10%,rgba(169,118,35,.08),transparent 60%),
    radial-gradient(900px 600px at 95% 0%,rgba(28,155,140,.06),transparent 55%),
    var(--bg);
}
body::selection{background:rgba(231,180,92,.3)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
::selection{background:rgba(231,180,92,.25)}

/* scrollbar */
*{scrollbar-width:thin;scrollbar-color:rgba(137,150,173,.35) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:rgba(137,150,173,.28);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ambient background */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient-glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.ambient-glow-a{width:520px;height:520px;left:-180px;top:-160px;background:rgba(231,180,92,.11)}
.ambient-glow-b{width:620px;height:620px;right:-260px;top:240px;background:rgba(88,211,195,.07)}
html[data-theme="light"] .ambient-glow{opacity:.45}
.ambient-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 85% 55% at 50% 0%,#000 20%,transparent 75%);
}
html[data-theme="light"] .ambient-grid{
  background-image:linear-gradient(rgba(24,32,45,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(24,32,45,.035) 1px,transparent 1px);
}

/* shell */
.topbar{
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid transparent;
  background:linear-gradient(180deg,rgba(7,10,17,.86),rgba(7,10,17,.62));
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  transition:border-color .2s ease,background .2s ease;
}
html[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(243,241,235,.9),rgba(243,241,235,.68))}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-inner{
  width:min(1240px,calc(100% - 48px));
  height:68px;margin:0 auto;
  display:flex;align-items:center;gap:22px;
}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;border-radius:10px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;
  color:#17120a;background:linear-gradient(145deg,var(--gold-2),var(--gold) 55%,#b9852f);
  font-family:var(--serif);font-size:21px;font-weight:700;
  box-shadow:0 6px 22px rgba(231,180,92,.24),inset 0 1px 0 rgba(255,255,255,.45);
}
.brand-mark.sm{width:32px;height:32px;font-size:17px;border-radius:9px}
.brand-copy{display:flex;flex-direction:column;line-height:1.05}
.brand-copy strong{font-family:var(--serif);font-size:19px;letter-spacing:.12em}
.brand-copy em{font-style:normal;font-size:8.5px;letter-spacing:.28em;color:var(--muted);margin-top:4px}
.top-search-trigger{
  margin-left:16px;flex:0 1 340px;
  height:38px;padding:0 12px;border-radius:11px;
  display:flex;align-items:center;gap:9px;
  color:var(--muted);font-size:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);
  transition:border-color .2s,color .2s,background .2s;
}
.top-search-trigger:hover{border-color:var(--line-2);color:var(--text-2);background:rgba(255,255,255,.04)}
.top-search-trigger kbd{
  margin-left:auto;padding:2px 6px;border:1px solid var(--line);border-radius:5px;
  font-family:var(--mono);font-size:10px;color:var(--faint);background:rgba(0,0,0,.12)
}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.market-live{
  display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px;
  border:1px solid var(--line);color:var(--faint);font-size:10.5px;letter-spacing:.06em;white-space:nowrap
}
.market-live i{width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 2.6s infinite}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.02);
  transition:color .2s,border-color .2s,background .2s,transform .2s;
}
.icon-btn:hover{color:var(--text);border-color:var(--line-2);background:rgba(255,255,255,.05);transform:translateY(-1px)}
.ico{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ico svg{width:100%;height:100%;display:block}
.ico.sm{width:15px;height:15px}
.ico.lg{width:24px;height:24px}

/* main / footer */
#view{position:relative;z-index:1;min-height:calc(100vh - 240px)}
.footer{position:relative;z-index:1;margin-top:88px;border-top:1px solid var(--line);background:rgba(7,10,17,.35)}
html[data-theme="light"] .footer{background:rgba(255,255,255,.4)}
.footer-inner{
  width:min(1180px,calc(100% - 48px));margin:0 auto;padding:34px 0 38px;
  display:flex;justify-content:space-between;gap:30px;align-items:flex-start;flex-wrap:wrap
}
.footer-brand{display:flex;gap:12px;align-items:flex-start}
.footer-brand strong{font-family:var(--serif);letter-spacing:.08em;font-size:15px}
.footer-brand p{margin-top:3px;color:var(--muted);font-size:12px}
.footer-meta{text-align:right;color:var(--faint);font-size:11.5px;line-height:1.8}
.footer-meta p:first-child{color:var(--muted)}

/* toast */
.toast-wrap{position:fixed;z-index:100;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  pointer-events:auto;max-width:min(520px,calc(100vw - 36px));
  padding:10px 15px;border-radius:12px;border:1px solid var(--line-2);
  background:rgba(19,27,42,.96);color:var(--text-2);font-size:12.5px;
  box-shadow:0 14px 40px rgba(0,0,0,.45);backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:9px;animation:toastIn .25s ease both;
}
html[data-theme="light"] .toast{background:rgba(255,253,248,.98)}
.toast.error{border-color:rgba(240,112,112,.35)}
.toast.error .ico{color:var(--red)}
.toast.ok .ico{color:var(--teal)}
.toast.out{animation:toastOut .2s ease both}
.noscript{padding:20px;text-align:center;background:#2a1d10;color:#ffd28a}

/* shared primitives */
.card{
  position:relative;
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,0) 42%),var(--panel);
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
html[data-theme="light"] .card{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.68)),var(--panel)}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;
  font-size:10.5px;line-height:1.6;letter-spacing:.04em;white-space:nowrap;
  border:1px solid var(--line-2);color:var(--muted);background:rgba(255,255,255,.03)
}
.badge.gold{color:var(--gold);border-color:rgba(231,180,92,.28);background:rgba(231,180,92,.08)}
.badge.teal{color:var(--teal);border-color:rgba(88,211,195,.25);background:rgba(88,211,195,.07)}
.badge.red{color:var(--red);border-color:rgba(240,112,112,.25);background:rgba(240,112,112,.07)}
.badge.green{color:var(--green);border-color:rgba(67,197,158,.25);background:rgba(67,197,158,.07)}
.badge.blue{color:var(--blue);border-color:rgba(122,169,255,.25);background:rgba(122,169,255,.07)}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  height:31px;padding:0 12px;border-radius:20px;font-size:12px;
  color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.02);
  transition:all .18s ease;white-space:nowrap
}
.chip:hover,.chip.active{color:var(--text);border-color:rgba(231,180,92,.35);background:rgba(231,180,92,.09)}
.chip.active{color:var(--gold-2)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 15px;border-radius:10px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line-2);color:var(--text-2);background:rgba(255,255,255,.03);
  transition:all .18s ease;white-space:nowrap
}
.btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.24);transform:translateY(-1px)}
.btn.primary{color:#1b1408;border-color:transparent;background:linear-gradient(135deg,var(--gold-2),var(--gold))}
.btn.primary:hover{filter:brightness(1.05);box-shadow:0 8px 24px rgba(231,180,92,.24)}
.btn.ghost{background:transparent}
.btn.sm{height:31px;padding:0 11px;font-size:11.5px;border-radius:8px}
.link{
  color:var(--gold);border-bottom:1px solid rgba(231,180,92,.3);
  transition:border-color .2s,color .2s
}
.link:hover{color:var(--gold-2);border-color:var(--gold-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)!important}
.down{color:var(--down)!important}
.flat{color:var(--muted)!important}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.gold{color:var(--gold)}
.teal{color:var(--teal)}
.blue{color:var(--blue)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* skeleton */
@keyframes shimmer{100%{transform:translateX(100%)}}
.skeleton{position:relative;overflow:hidden;background:rgba(255,255,255,.045);border-radius:8px}
html[data-theme="light"] .skeleton{background:rgba(24,32,45,.06)}
.skeleton::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
  animation:shimmer 1.4s infinite
}
.sk-line{height:12px;margin:8px 0}
.sk-line.w40{width:40%}.sk-line.w55{width:55%}.sk-line.w70{width:70%}.sk-line.w85{width:85%}
.sk-title{height:26px;width:38%;margin:4px 0 14px}

/* spinner */
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:var(--gold);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* print */
@media print{
  html{scroll-padding-top:0}
  body{background:#fff!important;color:#111!important;font-size:12px}
  .ambient,.topbar,.footer,.toast-wrap,.section-nav,.stock-actions,.no-print{display:none!important}
  #view{min-height:0}
  .card{box-shadow:none!important;border-color:#ddd!important;background:#fff!important;break-inside:avoid}
  .analysis-wrap{width:100%!important;padding:0!important}
  a{color:#111!important;border:0!important}
  .report-item,.peer-card,.news-item{break-inside:avoid}
}

@media (max-width:760px){
  .topbar-inner{width:calc(100% - 28px);height:60px;gap:12px}
  .brand-copy em{display:none}
  .brand-mark{width:34px;height:34px;font-size:18px}
  .brand-copy strong{font-size:17px}
  .market-live{display:none}
  .top-search-trigger{display:none!important}
  .footer-inner{width:calc(100% - 32px);flex-direction:column;gap:18px}
  .footer-meta{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}


/* ===== css/10-home.css ===== */
/* ============================================================
   Home / landing
   ============================================================ */
.home{
  width:min(1180px,calc(100% - 48px));
  margin:0 auto;padding:74px 0 0;
}
.hero{position:relative;max-width:940px;margin:0 auto;text-align:center;animation:fadeUp .55s ease both}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 11px 5px 9px;border:1px solid var(--line);border-radius:20px;
  color:var(--muted);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  background:rgba(255,255,255,.025)
}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 9px var(--teal)}
.hero h1{
  margin:26px auto 0;
  font-family:var(--serif);font-weight:600;
  font-size:clamp(42px,6.4vw,72px);line-height:1.12;letter-spacing:-.02em;
  color:var(--text);
}
.hero h1 span{
  background:linear-gradient(100deg,var(--gold-2) 5%,var(--gold) 45%,#c98f39 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .lede{
  max-width:640px;margin:20px auto 0;color:var(--muted);
  font-size:15px;line-height:1.9;
}
.search-shell{position:relative;max-width:760px;margin:34px auto 0;text-align:left}
.search-box{
  display:flex;align-items:center;gap:11px;
  padding:8px 8px 8px 17px;border-radius:16px;
  border:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),var(--panel-solid);
  box-shadow:0 24px 70px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .2s,box-shadow .2s
}
html[data-theme="light"] .search-box{background:linear-gradient(180deg,#fffdf9,#faf7ef);box-shadow:0 24px 60px rgba(50,45,35,.12)}
.search-box:focus-within{border-color:rgba(231,180,92,.55);box-shadow:0 24px 70px rgba(0,0,0,.34),0 0 0 3px rgba(231,180,92,.1)}
.search-box > .ico{color:var(--gold);width:20px;height:20px}
.search-box input{
  flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;
  font-size:14.5px;color:var(--text)
}
.search-box input::placeholder{color:var(--faint)}
.search-box .search-submit{
  height:44px;padding:0 20px;border-radius:11px;flex:0 0 auto;
  color:#1b1408;font-weight:700;font-size:13px;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));
  display:flex;align-items:center;gap:7px;
  transition:filter .2s,transform .2s
}
.search-box .search-submit:hover{filter:brightness(1.05);transform:translateY(-1px)}
.suggestions{
  position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;
  border:1px solid var(--line-2);border-radius:14px;overflow:hidden;
  background:rgba(15,22,35,.98);box-shadow:0 24px 60px rgba(0,0,0,.5);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
html[data-theme="light"] .suggestions{background:rgba(255,253,248,.99);box-shadow:0 24px 50px rgba(45,50,65,.18)}
.suggestions:empty{display:none}
.sug-item{
  width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:left;
  border-bottom:1px solid var(--line);transition:background .15s
}
.sug-item:last-child{border-bottom:0}
.sug-item:hover,.sug-item.active{background:rgba(231,180,92,.075)}
.sug-item .sug-name{font-size:13.5px;font-weight:600;color:var(--text)}
.sug-item .sug-code{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:2px}
.sug-item .sug-pinyin{margin-left:auto;font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.sug-hint{padding:8px 14px;font-size:10.5px;color:var(--faint);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.sug-empty{padding:16px;color:var(--muted);font-size:12.5px;text-align:center}
.hot-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:11.5px;color:var(--faint)}
.hot-row .hot-label{margin-right:2px}
.hot-chip{padding:4px 9px;border-radius:6px;border:1px solid transparent;color:var(--muted);transition:all .16s}
.hot-chip:hover{color:var(--gold-2);border-color:rgba(231,180,92,.22);background:rgba(231,180,92,.06)}

/* 自选股速览（FR-6） */
.watch-item{display:inline-flex;align-items:center}
.watch-item .watch-chip{border-top-right-radius:0;border-bottom-right-radius:0}
.watch-remove{padding:4px 6px;border:1px solid transparent;border-left:none;border-radius:0 6px 6px 0;color:var(--faint);background:transparent;cursor:pointer;line-height:1;transition:all .16s}
.watch-remove:hover{color:var(--red);border-color:rgba(240,112,112,.25)}
.watch-quote{margin-left:7px;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;font-size:11px}
.watch-quote b{font-weight:600}
.watch-quote .up{color:var(--up)}
.watch-quote .down{color:var(--down)}
.demo-link{display:inline-flex;align-items:center;gap:5px;margin-top:14px;font-size:11px;color:var(--faint);border-bottom:1px dashed var(--line-2);padding-bottom:1px}
.demo-link:hover{color:var(--gold)}

.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;max-width:760px;margin:46px auto 0;
  border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);
}
.hero-stat{padding:17px 20px;background:var(--panel-solid);text-align:left}
.hero-stat strong{display:block;font-family:var(--serif);font-size:19px;color:var(--text);letter-spacing:.02em}
.hero-stat span{display:block;margin-top:2px;font-size:10.5px;color:var(--faint);letter-spacing:.08em}

.features{margin-top:76px}
.section-kicker{
  display:flex;align-items:center;gap:10px;color:var(--faint);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase
}
.section-kicker::before{content:"";width:24px;height:1px;background:var(--gold);opacity:.6}
.features-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
.features-head h2{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.01em;margin-top:8px}
.features-head p{max-width:420px;color:var(--muted);font-size:12.5px;text-align:right}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.feature-card{
  position:relative;padding:22px 20px 20px;min-height:186px;overflow:hidden;
  transition:transform .22s,border-color .22s,background .22s
}
.feature-card:hover{transform:translateY(-3px);border-color:var(--line-2)}
.feature-card .feature-num{
  position:absolute;right:16px;top:13px;font-family:var(--serif);font-size:30px;
  color:rgba(255,255,255,.055);line-height:1
}
html[data-theme="light"] .feature-card .feature-num{color:rgba(24,32,45,.07)}
.feature-icon{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:var(--gold);border:1px solid rgba(231,180,92,.2);background:rgba(231,180,92,.07);
  margin-bottom:16px
}
.feature-card h3{font-size:14px;font-weight:600;letter-spacing:.01em}
.feature-card p{margin-top:7px;color:var(--muted);font-size:11.8px;line-height:1.8}
.feature-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}
.feature-tags span{font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

.coverage{
  margin-top:62px;padding:28px 30px;
  display:grid;grid-template-columns:1.1fr 1.3fr;gap:34px;align-items:start
}
.coverage h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:7px}
.coverage p{margin-top:10px;color:var(--muted);font-size:12.3px;line-height:1.9}
.coverage-list{display:flex;flex-direction:column;gap:9px}
.coverage-row{display:flex;align-items:flex-start;gap:10px;font-size:11.8px;color:var(--muted);line-height:1.7}
.coverage-row .ico{color:var(--teal);margin-top:2px}
.coverage-row.warn .ico{color:var(--orange)}
.coverage-row strong{color:var(--text-2);font-weight:600}
.coverage-foot{
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--faint);font-size:10.5px;line-height:1.8
}

@media (max-width:980px){
  .feature-grid{grid-template-columns:repeat(2,1fr)}
  .coverage{grid-template-columns:1fr;gap:20px}
}
@media (max-width:760px){
  .home{width:calc(100% - 28px);padding-top:44px}
  .hero h1{margin-top:20px}
  .hero .lede{font-size:13px;line-height:1.85;padding:0 6px}
  .search-shell{margin-top:26px}
  .search-box{padding-left:13px;border-radius:14px}
  .search-box input{font-size:13px;height:40px}
  .search-box .search-submit{height:40px;padding:0 13px;font-size:12px}
  .search-box .search-submit span{display:none}
  .hot-row{justify-content:flex-start;padding:0 2px}
  .hero-stats{grid-template-columns:1fr;margin-top:32px}
  .hero-stat{padding:13px 16px;display:flex;align-items:baseline;gap:10px}
  .hero-stat strong{font-size:15px}
  .hero-stat span{margin:0}
  .features{margin-top:52px}
  .features-head{flex-direction:column;align-items:flex-start;gap:6px}
  .features-head p{text-align:left}
  .features-head h2{font-size:25px}
  .feature-grid{grid-template-columns:1fr}
  .feature-card{min-height:0}
  .coverage{padding:22px 20px;margin-top:44px}
}


/* ===== css/20-analysis.css ===== */
/* ============================================================
   Analysis page
   ============================================================ */
.analysis-wrap{width:min(1180px,calc(100% - 48px));margin:0 auto;padding:28px 0 0;position:relative}
.crumb{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11px;letter-spacing:.02em;flex-wrap:wrap}
.crumb a{color:var(--muted);transition:color .2s}
.crumb a:hover{color:var(--gold)}
.crumb .sep{opacity:.5}
.crumb .badge{margin-left:2px}
.stock-head{
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:28px;align-items:end;padding:20px 0 20px;border-bottom:1px solid var(--line);
}
.stock-title h1{
  font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.2vw,44px);
  line-height:1.15;letter-spacing:-.015em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap
}
.stock-title h1 .code{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--faint);letter-spacing:.02em}
.stock-tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.stock-sub{margin-top:8px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.stock-sub .mini-sep{width:1px;height:11px;background:var(--line-2);display:inline-block}
.stock-price{text-align:right;min-width:190px}
.price-row{display:flex;align-items:baseline;justify-content:flex-end;gap:10px}
.price-main{font-size:38px;line-height:1;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.price-main.small{font-size:30px}
.price-change{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.price-time{margin-top:8px;font-size:10.5px;color:var(--faint)}
.stock-actions{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.metric-strip{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:16px;
  background:rgba(255,255,255,.015)
}
.metric{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.metric:last-child{border-right:0}
.metric label{display:block;font-size:10px;color:var(--faint);letter-spacing:.06em;white-space:nowrap}
.metric strong{display:block;margin-top:3px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric strong small{font-size:9.5px;color:var(--faint);font-weight:400;margin-left:2px}

.section-nav{
  position:sticky;top:68px;z-index:20;display:flex;align-items:center;gap:2px;
  margin:14px 0 22px;padding:6px 0;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg) 20%,rgba(7,10,17,.82));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
html[data-theme="light"] .section-nav{background:linear-gradient(180deg,var(--bg) 20%,rgba(243,241,235,.86))}
.section-nav a{
  padding:5px 12px;border-radius:7px;font-size:11.5px;color:var(--muted);
  transition:color .16s,background .16s;white-space:nowrap
}
.section-nav a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.section-nav .nav-live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--faint)}
.section-nav .nav-live i{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:pulse 2.4s infinite}

.overview-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
.score-card{padding:24px 24px 22px;display:flex;flex-direction:column;overflow:hidden}
.score-card::before{
  content:"";position:absolute;width:240px;height:240px;right:-80px;top:-100px;border-radius:50%;
  background:radial-gradient(circle,rgba(231,180,92,.12),transparent 70%);pointer-events:none
}
.card-kicker{display:flex;align-items:center;gap:7px;color:var(--faint);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.card-kicker .ico{color:var(--gold)}
.gauge{position:relative;width:210px;height:210px;margin:10px auto 4px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge-track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:10}
html[data-theme="light"] .gauge-track{stroke:rgba(24,32,45,.08)}
.gauge-fill{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),stroke .3s}
.gauge-fill.strong{stroke:var(--gold)}
.gauge-fill.bull{stroke:var(--teal)}
.gauge-fill.neutral{stroke:var(--blue)}
.gauge-fill.bear{stroke:var(--orange)}
.gauge-fill.weak{stroke:var(--red)}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.score-num{font-family:var(--serif);font-size:58px;line-height:.95;letter-spacing:-.04em;color:var(--text)}
.score-num small{font-size:13px;color:var(--faint);font-family:var(--sans);letter-spacing:0;margin-left:2px}
.verdict-pill{
  margin-top:7px;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line-2);color:var(--muted)
}
.verdict-pill.strong{color:var(--gold);border-color:rgba(231,180,92,.35);background:rgba(231,180,92,.09)}
.verdict-pill.bull{color:var(--teal);border-color:rgba(88,211,195,.3);background:rgba(88,211,195,.08)}
.verdict-pill.neutral{color:var(--blue);border-color:rgba(122,169,255,.3);background:rgba(122,169,255,.08)}
.verdict-pill.bear{color:var(--orange);border-color:rgba(233,154,92,.3);background:rgba(233,154,92,.08)}
.verdict-pill.weak{color:var(--red);border-color:rgba(240,112,112,.3);background:rgba(240,112,112,.08)}
.score-desc{margin-top:10px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7;min-height:38px}
.score-foot{
  margin-top:auto;padding-top:14px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:10px;color:var(--faint)
}
.score-foot .confidence{display:flex;align-items:center;gap:5px}
.score-foot .confidence b{color:var(--text-2);font-weight:600}
.score-mini-bars{display:flex;gap:3px}
.score-mini-bars i{width:4px;height:12px;border-radius:2px;background:rgba(255,255,255,.1)}
.score-mini-bars i.on{background:var(--gold)}

.factor-card{padding:20px 22px 20px}
.factor-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:center;margin-top:10px}
.radar-wrap{position:relative;min-width:0}
.radar-wrap svg{width:100%;height:auto;overflow:visible}
.radar-grid{fill:none;stroke:rgba(255,255,255,.075);stroke-width:1}
html[data-theme="light"] .radar-grid{stroke:rgba(24,32,45,.1)}
.radar-axis{stroke:rgba(255,255,255,.075);stroke-width:1}
html[data-theme="light"] .radar-axis{stroke:rgba(24,32,45,.1)}
.radar-area{fill:rgba(231,180,92,.14);stroke:var(--gold);stroke-width:1.8;stroke-linejoin:round}
.radar-dot{fill:var(--gold);stroke:var(--bg);stroke-width:2}
.radar-label{fill:var(--muted);font-size:9.5px;font-family:var(--sans)}
.radar-value{fill:var(--text-2);font-size:9px;font-family:var(--mono)}
.dims{display:flex;flex-direction:column;gap:13px;min-width:0}
.dim-row{min-width:0}
.dim-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11.5px}
.dim-top span:first-child{color:var(--text-2);font-weight:600}
.dim-score{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.dim-score b{color:var(--text);font-weight:600;font-size:12px}
.dim-bar{height:5px;border-radius:5px;background:rgba(255,255,255,.065);margin-top:6px;overflow:hidden}
html[data-theme="light"] .dim-bar{background:rgba(24,32,45,.07)}
.dim-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .9s ease}
.dim-bar.unavailable i{width:100%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 4px,transparent 4px 8px)}
.dim-note{margin-top:4px;color:var(--faint);font-size:9.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chart-card{padding:18px 22px 14px;margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center}
.chart-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chart-head strong{font-size:12px;font-weight:600}
.chart-head span{font-size:10px;color:var(--faint)}
.spark-wrap{margin-top:6px;height:92px}
.spark-wrap svg{width:100%;height:100%;overflow:visible}
.spark-line{fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.spark-area{fill:url(#sparkFill)}
.spark-dot{fill:var(--gold)}
.spark-guide{stroke:rgba(255,255,255,.06);stroke-dasharray:3 4}
.chart-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;border-left:1px solid var(--line);padding-left:22px}
.chart-fact label{display:block;font-size:9.5px;color:var(--faint)}
.chart-fact strong{display:block;font-size:13px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}

/* K 线模块（FR-3.1 ~ FR-3.9） */
.kline-tabs{display:inline-flex;gap:4px}
.kline-tab{border:1px solid var(--line-2);background:transparent;color:var(--faint);font-size:10px;font-family:inherit;line-height:1;padding:4px 10px;border-radius:999px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.kline-tab:hover{color:var(--text-2);border-color:var(--muted)}
.kline-tab.active{color:var(--gold-2);border-color:var(--gold);background:rgba(231,180,92,.1)}
html[data-theme="light"] .kline-tab.active{background:rgba(169,118,35,.1)}
.kline-legend{font-size:10px;color:var(--faint)}
.kline-legend i{display:inline-block;width:14px;height:2px;border-radius:2px;vertical-align:middle;margin:0 4px 2px 8px;background:var(--gold)}
.kline-legend i.ma60{background:var(--blue)}
.kline-legend i.b{background:var(--blue)}
.kline-legend i.c{background:var(--violet)}
.kline-legend i.vol{background:var(--muted)}
.kline-subhead{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px}
.sub-label{font-size:10px;color:var(--faint)}
.kline-tab:disabled{opacity:.4;cursor:not-allowed}
.kline-note{font-size:10px;color:var(--faint)}
.watch-btn.on{color:var(--gold-2);border-color:rgba(231,180,92,.4)}
html[data-theme="light"] .watch-btn.on{color:var(--gold);border-color:rgba(169,118,35,.4)}
.target-line{stroke:var(--gold-2);stroke-width:1;stroke-dasharray:5 4;opacity:.75}
.target-label{fill:var(--gold-2);font-size:9.5px}
.candle-guide{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.sub-hist{opacity:.7}
.sub-hist.up{fill:var(--up)}
.sub-hist.down{fill:var(--down)}
.sub-line{fill:none;stroke-width:1.2;stroke-linejoin:round}
.sub-line.a{stroke:var(--gold)}
.sub-line.b{stroke:var(--blue)}
.sub-line.c{stroke:var(--violet)}
.candle-boll{fill:none;stroke:var(--blue);stroke-width:1;stroke-dasharray:4 3;opacity:.75}
.candle-boll-area{fill:rgba(122,169,255,.08);stroke:none}
html[data-theme="light"] .candle-boll-area{fill:rgba(62,111,209,.08)}
.kline-wrap{margin-top:8px}
.candle-svg{display:block;width:100%;height:auto;aspect-ratio:660/312;overflow:visible}
.candle-grid{stroke:var(--line);stroke-width:1}
.candle-tick{fill:var(--faint);font-size:10px}
.candle-tick.date{text-anchor:middle}
.candle line{stroke-width:1}
.candle.up line{stroke:var(--up)}
.candle.down line{stroke:var(--down)}
.candle rect{fill:var(--up)}
.candle.down rect{fill:var(--down)}
.candle-hot rect{stroke:var(--gold-2);stroke-width:.6}
.candle-ma{fill:none;stroke-width:1.4;stroke-linejoin:round}
.candle-ma.ma20{stroke:var(--gold)}
.candle-ma.ma60{stroke:var(--blue)}
.vol-bar{opacity:.5}
.vol-bar.up{fill:var(--up)}
.vol-bar.down{fill:var(--down)}
.candle-base{stroke:var(--line-2);stroke-width:1}
.candle-vol-max{fill:var(--faint);font-size:10px}
.candle-cross-v,.candle-cross-h{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.candle-hover-layer{cursor:crosshair}
.candle-tip{position:absolute;top:6px;left:0;z-index:3;display:flex;flex-wrap:wrap;gap:2px 10px;padding:7px 10px;font-size:10.5px;line-height:1.5;color:var(--text-2);background:var(--panel-solid);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);pointer-events:none;min-width:150px}
.candle-tip b{font-weight:600;color:var(--text)}
.candle-tip .up{color:var(--up)}
.candle-tip .down{color:var(--down)}
.kline-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:46px 0;font-size:11.5px;color:var(--muted)}

/* sections */
.section-block{scroll-margin-top:110px;margin-top:40px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px;flex-wrap:wrap}
.section-title{display:flex;gap:13px;align-items:flex-start}
.section-num{
  font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.08em;
  padding-top:7px;min-width:20px
}
.section-title h2{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.25;letter-spacing:-.01em}
.section-title p{margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.6}
.section-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.section-tools .filter-input{
  height:31px;padding:0 11px;border:1px solid var(--line);border-radius:8px;
  background:rgba(255,255,255,.025);color:var(--text);font-size:11.5px;width:150px;outline:0
}
.section-tools .filter-input:focus{border-color:rgba(231,180,92,.4)}
.section-tools .filter-input::placeholder{color:var(--faint)}

/* reports */
.report-list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.012)}
.report-item{
  display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:16px;
  padding:15px 18px;border-bottom:1px solid var(--line);align-items:start;
  transition:background .16s
}
.report-item:last-child{border-bottom:0}
.report-item:hover{background:rgba(255,255,255,.025)}
html[data-theme="light"] .report-item:hover{background:rgba(24,32,45,.025)}
.report-date{font-family:var(--mono);font-size:10px;color:var(--faint);padding-top:2px;line-height:1.55;white-space:nowrap}
.report-date b{display:block;color:var(--muted);font-weight:500}
.report-main{min-width:0}
.report-title{
  font-size:13px;font-weight:600;line-height:1.55;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.report-title a:hover{color:var(--gold-2)}
.report-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--faint)}
.report-meta .org{color:var(--muted);font-weight:500}
.report-meta .dot{width:2px;height:2px;border-radius:50%;background:var(--faint)}
.report-meta .analyst{color:var(--faint)}
.report-meta .target{color:var(--gold)}
.report-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:72px}
.rating-badge{
  display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:5px;
  font-size:10px;font-weight:700;letter-spacing:.03em;border:1px solid var(--line-2);color:var(--muted)
}
.rating-badge.red{color:var(--red);border-color:rgba(240,112,112,.3);background:rgba(240,112,112,.07)}
.rating-badge.orange{color:var(--orange);border-color:rgba(233,154,92,.3);background:rgba(233,154,92,.07)}

/* ===== js/00-utils.js ===== */
/* ============================================================
   研值 StockLens — utilities
   ============================================================ */
'use strict';

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (n, min, max) => Math.min(max, Math.max(min, Number.isFinite(n) ? n : min));
const num = (v, fallback = null) => {
  if (v === null || v === undefined || v === '' || v === '-' || v === '--') return fallback;
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
};
const uid = (prefix = 'sl') => prefix + '_' + Math.random().toString(36).slice(2, 9);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function stripTags(s) {
  return String(s ?? '')
    .replace(/<[^>]*>/g, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .trim();
}
function safeUrl(u) {
  try {
    const url = new URL(String(u), location.href);
    if (url.protocol === 'http:' || url.protocol === 'https:') return url.href;
  } catch (e) {}
  return '';
}
function debounce(fn, wait = 220) {
  let t;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}
function todayISO() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function monthsAgoISO(months = 6) {
  const d = new Date();
  d.setMonth(d.getMonth() - months);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function parseDateValue(s) {
  if (!s) return null;
  const str = String(s).replace(/\.\d+$/, '').replace(/\//g, '-').replace(' ', 'T');
  const d = new Date(str);

    if (m) return new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00`);
    return null;

function fmtDate(s, withTime = false) {
  const d = parseDateValue(s);
  if (!d) return '—';
  const p = (n) => String(n).padStart(2, '0');
  const base = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  return withTime ? `${base} ${p(d.getHours())}:${p(d.getMinutes())}` : base;
}

  const str = String(s);
  let m = str.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/);
  if (m) return `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}`;
  return fmtDate(str, true);

  if (diff < 0) return fmtDate(s);
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return `${mins} 分钟前`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours} 小时前`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `${days} 天前`;
  return fmtDate(s);
}

/* ---------- storage / cache ---------- */
const memCache = new Map();
const inflight = new Map();

function readLocal(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
let localWriteWarned = false;
function writeLocal(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    /* 配额溢出等场景：只告警一次，缓存自动降级为内存模式，不影响功能 */
    if (!localWriteWarned) {
      localWriteWarned = true;
      console.warn('[StockLens] 本地缓存写入失败（可能超出配额），数据缓存将仅在本次会话内存中生效');
    }
  }
}
const store = {
  get(key, fallback = null) {
    const v = readLocal('sl:' + key);
    return v === null ? fallback : v;
  },
  set(key, value) {
    writeLocal('sl:' + key, value);
  },
  remove(key) {
    try {
      localStorage.removeItem('sl:' + key);
    } catch (e) {}
  },
};
async function cached(key, ttl, loader) {
  const now = Date.now();
  const mem = memCache.get(key);
  if (mem && now - mem.t < ttl) return mem.d;
  const disk = readLocal('sl:c:' + key);
  if (disk && now - disk.t < ttl) {
    memCache.set(key, disk);
    return disk.d;
  }
  if (inflight.has(key)) return inflight.get(key);
  const p = loader()
    .then((d) => {
      const entry = { t: Date.now(), d };
      memCache.set(key, entry);
      writeLocal('sl:c:' + key, entry);
      return d;
    })
    .finally(() => inflight.delete(key));
  inflight.set(key, p);
  return p;
}

/* ---------------- transport ---------------- */
async function fetchJSON(url, options = {}) {
  const { timeout = 15000, headers = {} } = options;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, {
      signal: ctrl.signal,
      cache: 'no-store',
      /* 部署到 https（如 GitHub Pages）后浏览器会自动带 Referer，
         东方财富 WAF 会拦截非东财来源的 Referer（HTTP 567）。
         数据接口不依赖 Referer，显式关闭即可两地通用。 */
      referrerPolicy: 'no-referrer',
      headers: { Accept: 'application/json,text/plain,*/*', ...headers },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function jsonp(url, options = {}) {
  const { timeout = 12000, callbackParam = 'cb' } = options;
  return new Promise((resolve, reject) => {
    const cbName = '__slcb_' + Math.random().toString(36).slice(2, 10);
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => {
      clearTimeout(timer);
      script.remove();
      try {
        delete window[cbName];
      } catch (e) {}
    };
    const finish = (fn, value) => {
      if (done) return;
      done = true;
      cleanup();
      fn(value);
    };
    const timer = setTimeout(() => finish(reject, new Error('数据接口超时')), timeout);
    window[cbName] = (data) => finish(resolve, data);
    script.onerror = () => finish(reject, new Error('数据接口连接失败'));
    script.src = url + (url.includes('?') ? '&' : '?') + callbackParam + '=' + encodeURIComponent(cbName);
    script.charset = 'utf-8';
    script.referrerPolicy = 'no-referrer';
    document.head.appendChild(script);
  });
}

/* Eastmoney 接口串行 + 最小间隔，降低被限流概率 */
let emChain = Promise.resolve();
let emLast = 0;
function emQueue(fn, gap = 280) {
  const run = async () => {
    const wait = gap - (Date.now() - emLast);
    if (wait > 0) await sleep(wait);
    try {
      return await fn();
    } finally {
      emLast = Date.now();
    }
  };
  const p = emChain.then(run, run);
  emChain = p.catch(() => {});
  return p;
}
const emJsonp = (url) => emQueue(() => jsonp(url));
const emJSON = (url, opts) => emQueue(() => fetchJSON(url, opts));

function smartbox(query) {
  return new Promise((resolve, reject) => {

    const prev = window.v_hint;
    let done = false;
    const cleanup = () => {
      clearTimeout(timer);
      script.remove();
      try {
        if (prev === undefined) delete window.v_hint;
        else window.v_hint = prev;
      } catch (e) {}
    };
    const finish = (fn, v) => {
      if (done) return;
      done = true;
      cleanup();
      fn(v);
    };
    const timer = setTimeout(() => finish(reject, new Error('搜索超时')), 7000);
    script.onload = () => {
      const raw = window.v_hint || '';
      finish(resolve, raw);
    };
    script.onerror = () => finish(reject, new Error('搜索服务不可用'));
    script.charset = 'utf-8';
    script.src = `${API.smartbox}?q=${encodeURIComponent(query)}&t=all&r=${Date.now()}`;
    document.head.appendChild(script);

}

function normalizeSearchItem(part) {
  const f = part.split('~');
  if (f.length < 5) return null;
  const mk = f[0];
  const rawCode = (f[1] || '').trim();
  const name = stripTags(f[2] || '');
  const pinyin = (f[3] || '').trim();
  const type = f[4] || '';
  if (!/^GP/i.test(type)) return null;
  if (!rawCode || !name) return null;

  if (mk === 'sh' || mk === 'sz' || mk === 'bj') {
    return { market: 'A', code: rawCode, name, pinyin, quoteKey: mk + rawCode, rawCode, klineCode: mk + rawCode };
  }
  if (mk === 'hk') {
    const code = rawCode.replace(/\D/g, '').padStart(5, '0');
    return { market: 'HK', code, name, pinyin, quoteKey: 'hk' + code, rawCode: code, klineCode: 'hk' + code };
  }
  if (mk === 'us') {
    const upper = rawCode.toUpperCase();
    const klineCode = 'us' + upper;
    const quoteRaw = upper.replace(/\.(OQ|N|PS|A|AMEX|NYSE)$/i, '');
    return { market: 'US', code: quoteRaw, name, pinyin, quoteKey: 'us' + quoteRaw, rawCode: upper, klineCode };
  }
  return null;
}

function parseSearchRaw(raw) {
  if (!raw || typeof raw !== 'string') return [];
  const seen = new Set();
  const out = [];
  raw.split('^').forEach((part) => {
    const item = normalizeSearchItem(part);
    if (!item) return;
    const id = item.market + ':' + item.code;
    if (seen.has(id)) return;
    seen.add(id);
    out.push(item);
  });
  return out.slice(0, 8);
}

const SEARCH_MEMO_MAX = 50;

function searchStocks(query) {
  const q = String(query || '').trim();
  if (!q) return Promise.resolve([]);
  const memo = searchMemo.get(q);
  if (memo && Date.now() - memo.t < 5 * 60 * 1000) return Promise.resolve(memo.d);
  if (memo) searchMemo.delete(q); /* 过期条目随手清除，避免 Map 只增不减 */
  const run = () => smartbox(q).then(parseSearchRaw);
  const p = searchChain.then(run, run);
  searchChain = p.catch(() => {});
  return p.then((d) => {
    if (searchMemo.size >= SEARCH_MEMO_MAX) {
      searchMemo.delete(searchMemo.keys().next().value); /* 超上限淘汰最早插入的条目 */
    }
    searchMemo.set(q, { t: Date.now(), d });
    return d;
  });
}

function parseSymbolInput(input) {
  const q = String(input || '').trim();
  if (!q) return null;
  let m = q.match(/^(sh|sz|bj)(\d{6})$/i);
  if (m) {
    const mk = m[1].toLowerCase();
    const code = m[2];
    return { market: 'A', code, name: code, quoteKey: mk + code, rawCode: code, klineCode: mk + code };
  }
  if (/^\d{6}$/.test(q)) {
    const mk = /^(6|9)/.test(q) ? 'sh' : /^(4|8)/.test(q) ? 'bj' : 'sz';
    return { market: 'A', code: q, name: q, quoteKey: mk + q, rawCode: q, klineCode: mk + q };
  }
  m = q.match(/^hk(\d{1,5})$/i);
  if (m) {
    const code = m[1].padStart(5, '0');
    return { market: 'HK', code, name: code, quoteKey: 'hk' + code, rawCode: code, klineCode: 'hk' + code };
  }
  if (/^\d{1,5}$/.test(q)) {
    const code = q.padStart(5, '0');
    return { market: 'HK', code, name: code, quoteKey: 'hk' + code, rawCode: code, klineCode: 'hk' + code };
  }
  m = q.match(/^us([A-Za-z][A-Za-z0-9.\-]*)$/i);
  if (m) {
    const raw = m[1].toUpperCase();
    const quoteRaw = raw.replace(/\.(OQ|N|PS|A|AMEX|NYSE)$/i, '');
    return { market: 'US', code: quoteRaw, name: quoteRaw, quoteKey: 'us' + quoteRaw, rawCode: raw, klineCode: 'us' + raw };
  }
  if (/^[A-Za-z][A-Za-z0-9.\-]{0,11}$/.test(q)) {
    const raw = q.toUpperCase();
    const quoteRaw = raw.replace(/\.(OQ|N|PS|A|AMEX|NYSE)$/i, '');
    return { market: 'US', code: quoteRaw, name: quoteRaw, quoteKey: 'us' + quoteRaw, rawCode: raw, klineCode: 'us' + raw };
  }
  return null;
}

/* ---------------- Tencent quote ---------------- */
function decodeGBK(buffer) {
  try {
    return new TextDecoder('gbk').decode(buffer);
  } catch (e) {
    try {
      return new TextDecoder('utf-8').decode(buffer);
    } catch (e2) {
      return '';
    }
  }
}

function parseQuoteLine(key, raw) {
  if (!raw) throw new Error('行情数据为空');
  const f = raw.split('~');
  if (f.length < 38) throw new Error('行情数据格式异常');
  const market = marketFromKey(key);
  const price = num(f[3]);
  if (!Number.isFinite(price) || price <= 0) throw new Error('未找到该股票的行情');
  const quote = {
    key,
    market,
    name: stripTags(f[1] || ''),
    rawCode: f[2] || '',
    price,
    prevClose: num(f[4], 0),
    open: num(f[5], 0),
    volume: num(f[36], num(f[6], 0)),
    time: formatQuoteTime(f[30]),
    change: num(f[31], 0),
    changePct: num(f[32], 0),
    high: num(f[33], 0),
    low: num(f[34], 0),
    currency: currencyOf(market),
    source: '腾讯财经',
  };
  if (market === 'A') {
    quote.amount = num(f[37], 0) * 1e4;
    quote.turnover = num(f[38]);
    quote.pe = num(f[39]);
    quote.pb = num(f[46]);
    quote.floatCap = num(f[44]);
    quote.marketCap = num(f[45]);
    quote.high52 = num(f[67]);
    quote.low52 = num(f[68]);
    quote.volumeRatio = num(f[49]);
  } else if (market === 'HK') {
    quote.amount = num(f[37], 0);
    quote.turnover = null;
    quote.pe = num(f[39]);
    quote.pb = num(f[47]);
    quote.marketCap = num(f[45]);
    quote.high52 = num(f[48]);
    quote.low52 = num(f[49]);
  } else {
    quote.amount = num(f[37], 0);
    quote.turnover = num(f[38]);
    quote.pe = num(f[39]);
    quote.pb = num(f[47]);
    quote.marketCap = num(f[45]);
    quote.high52 = num(f[48]);
    quote.low52 = num(f[49]);
  }
  return quote;
}

async function getQuote(stock) {
  const key = stock.quoteKey || stock.klineCode;
  if (!key) throw new Error('缺少行情代码');
  return cached('quote:' + key, TTL.quote, async () => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const res = await fetch(API.quote + encodeURIComponent(key), { signal: ctrl.signal, cache: 'no-store' });
      if (!res.ok) throw new Error(`行情 HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      const text = decodeGBK(buf);
      const escKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      let m = text.match(new RegExp('v_' + escKey + '="([^"]*)"'));
      if (!m) m = text.match(/v_[^=]+="([^"]*)"/);
      return parseQuoteLine(key, m ? m[1] : '');
    } finally {
      clearTimeout(timer);
    }
  });
}

async function getQuoteBatch(keys) {
  const list = [...new Set((keys || []).filter(Boolean))];
  if (!list.length) return new Map();
  const chunks = [];
  for (let i = 0; i < list.length; i += 60) chunks.push(list.slice(i, i + 60));
  const pages = await Promise.all(
    chunks.map(async (chunk) => {
      /* 与 getQuote 一致的超时控制，避免网络挂起时 Promise 长期悬空 */
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      try {
        const res = await fetch(API.quote + chunk.map(encodeURIComponent).join(','), {
          signal: ctrl.signal,
          cache: 'no-store',
        });
        if (!res.ok) throw new Error(`行情 HTTP ${res.status}`);
        const text = decodeGBK(await res.arrayBuffer());
        const out = [];
        const re = /v_([^=]+)="([^"]*)"/g;
        let m;
        while ((m = re.exec(text))) {
          try {
            out.push(parseQuoteLine(m[1], m[2]));
          } catch (e) {}
        }
        return out;
      } finally {
        clearTimeout(timer);
      }
    })
  );
  return new Map(pages.flat().map((q) => [q.key, q]));
}

/* ---------------- Tencent K-line ---------------- */
/* K 线周期：同一腾讯接口切换 period 参数（FR-3.2） */
const KLINE_PERIODS = ['day', 'week', 'month'];
const KLINE_COUNT = { day: 320, week: 260, month: 140 };

function normalizeKlinePeriod(period) {
  return KLINE_PERIODS.includes(period) ? period : 'day';
}
function klineMetrics(points) {
  const closes = points.map((p) => num(p.close)).filter((n) => Number.isFinite(n) && n > 0);
  if (closes.length < 2) throw new Error('历史行情数据不足');
  const last = closes[closes.length - 1];
  const ret = (n) => (closes.length > n ? (last / closes[closes.length - 1 - n] - 1) * 100 : null);
  const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
  const ma = (n) => (closes.length >= n ? avg(closes.slice(-n)) : null);
  const daily = [];
  for (let i = 1; i < closes.length; i++) daily.push(closes[i] / closes[i - 1] - 1);
  const recent = daily.slice(-120);
  const mean = recent.length ? avg(recent) : 0;
  const variance = recent.length ? avg(recent.map((r) => (r - mean) ** 2)) : 0;
  const volatility = Math.sqrt(variance) * Math.sqrt(252) * 100;
  let peak = closes[0];
  let maxDrawdown = 0;
  closes.slice(-120).forEach((c) => {
    peak = Math.max(peak, c);
    maxDrawdown = Math.min(maxDrawdown, (c / peak - 1) * 100);
  });
  const ma20 = ma(20);
  const ma60 = ma(60);
  let trend = '震荡';
  if (ma20 && ma60) {
    if (last > ma20 && ma20 > ma60) trend = '多头排列';
    else if (last < ma20 && ma20 < ma60) trend = '空头排列';
  }
  return {
    last,
    r20: ret(20),
    r60: ret(60),
    r120: ret(120),
    ma20,
    ma60,
    volatility,
    maxDrawdown,
    trend,
    points: closes.length,
  };
}

async function getKline(stock, quote, period = 'day') {
  const p = normalizeKlinePeriod(period);
  let key = stock.klineCode || stock.quoteKey;
  if (stock.market === 'US') {
    if (quote && quote.rawCode) key = 'us' + quote.rawCode;
    else if (!key || !/\.(OQ|N|PS|A)$/i.test(key)) {
      key = 'us' + (stock.rawCode || stock.code || '');
    }
  }
  if (!key) throw new Error('缺少 K 线代码');
  const isUS = stock.market === 'US';
  return cached(`kline:${p}:${key}`, TTL.kline, async () => {
    const base = isUS ? API.usKline : API.kline;
    const count = KLINE_COUNT[p] || 320;
    const url = `${base}?param=${encodeURIComponent(key)},${p},,,${count},qfq`;
    const data = await fetchJSON(url, { timeout: 15000 });
    const block = data && data.data && (data.data[key] || Object.values(data.data)[0]);
    if (!block) throw new Error('K 线数据为空');
    /* A/美股前复权键为 qfqday/qfqweek/qfqmonth，港股直接为 day/week/month（FR-3.7） */
    const arr = block[`qfq${p}`] || block[p] || [];
    const points = arr
      .map((row) => ({
        date: row[0],
        open: num(row[1]),
        close: num(row[2]),
        high: num(row[3]),
        low: num(row[4]),
        volume: num(row[5], 0),
      }))
      .filter((p2) => Number.isFinite(p2.close) && p2.date);
    if (points.length < 5) throw new Error('K 线数据不足');
    /* 技术面指标仅在日线上有意义，周/月只返回原始点供图表使用 */
    return { key, period: p, points, metrics: p === 'day' ? klineMetrics(points) : null, source: '腾讯财经' };
  });
}

      .filter((n) => n.title)
      .sort((a, b) => (parseDateValue(b.date)?.getTime() || 0) - (parseDateValue(a.date)?.getTime() || 0))
      .slice(0, 15);
  });
}

};

function normIndustry(s) {
  return String(s || '')
    .replace(/[（(].*?[）)]/g, '')
    .replace(/(Ⅱ|Ⅲ|II|III|行业|板块|产品|服务|制造|设备|其他)/gi, '')
    .replace(/[\s·\-—]/g, '')
    .toLowerCase();
}
function sameIndustry(a, b) {
  if (!a || !b) return false;
  if (String(a) === String(b)) return true;
  const na = normIndustry(a);
  const nb = normIndustry(b);
  if (!na || !nb) return false;
  return na === nb || na.includes(nb) || nb.includes(na);
}
function findIndustryCode(industryName) {
  if (!industryName) return null;
  const direct = Object.entries(INDUSTRY_CODES).find(([name]) => name === industryName);
  if (direct) return { code: direct[1], name: direct[0], reference: false };
  const norm = normIndustry(industryName);
  const candidates = Object.entries(INDUSTRY_CODES).filter(([name]) => {
    const n = normIndustry(name);
    return n === norm || n.includes(norm) || norm.includes(n);
  });
  if (candidates.length) return { code: candidates[0][1], name: candidates[0][0], reference: true };
  for (const [key, aliases] of Object.entries(INDUSTRY_ALIASES)) {
    if (normIndustry(key) === norm) {
      for (const alias of aliases) {
        if (INDUSTRY_CODES[alias]) return { code: INDUSTRY_CODES[alias], name: alias, reference: true };
      }
    }
  }
  return null;
}

function normalizeASharePeer(row, extras = {}) {
  if (!row || !row.SECURITY_CODE) return null;
  const code = String(row.SECURITY_CODE);
  if (/^(200|900)/.test(code)) return null;
  const mk = /^(6|9)/.test(code) ? 'sh' : /^(4|8)/.test(code) ? 'bj' : 'sz';
  return {
    market: 'A',
    code,
    name: stripTags(row.SECURITY_NAME_ABBR || code),
    marketCap: Number.isFinite(extras.marketCap) ? extras.marketCap : null,
    profit: Number.isFinite(extras.profit) ? extras.profit : null,
    pe: num(row.PE_RATIO),
    pb: num(row.PB_RATIO),
    quoteKey: mk + code,
    klineCode: mk + code,
    rawCode: code,
  };
}

async function getASharePeersFromDataCenter(stock, industryName, industryCode) {
  let info =
    industryCode && /^\d+$/.test(String(industryCode))
      ? { code: String(industryCode), name: industryName || '' }
      : await getAShareIndustryCode(stock);
  if (!info || !info.code) throw new Error('数据中心未返回行业代码');
  const code = info.code;

  const capColumns =
    'SECURITY_CODE,SECURITY_NAME_ABBR,INDUSTRY_NAME,INDUSTRY_CODE,TOTAL_MARKET_CAP,PE_RATIO,PB_RATIO,TMC_RANK';
  const profitColumns =
    'SECURITY_CODE,SECURITY_NAME_ABBR,PARENT_NETPROFIT,REPORTDATE,BOARD_NAME,ORI_BOARD_CODE';

  const [capRows, latestRows] = await Promise.all([
    dcQuery(
      'RPT_STOCK_INDUSTRY_STA',
      capColumns,
      `(INDUSTRY_CODE="${code}")`,
      'TOTAL_MARKET_CAP',
      '-1',
      30
    ),
    dcQuery(
      'RPT_LICO_FN_CPD',
      profitColumns,
      `(ORI_BOARD_CODE="${code}")`,
      'REPORTDATE',
      '-1',
      1
    ),
  ]);

  const cap = capRows
    .map((r) => normalizeASharePeer(r, { marketCap: num(r.TOTAL_MARKET_CAP) != null ? num(r.TOTAL_MARKET_CAP) / 1e8 : null }))
    .filter((p) => p && p.code !== stock.code && Number.isFinite(p.marketCap))
    .sort((a, b) => b.marketCap - a.marketCap)
    .slice(0, 3);

  let profit = [];
  let profitPeriod = '';
  const latest = latestRows[0];
  if (latest && latest.REPORTDATE) {
    profitPeriod = fmtDate(latest.REPORTDATE);
    const profitRows = await dcQuery(
      'RPT_LICO_FN_CPD',
      profitColumns,
      `(REPORTDATE='${latest.REPORTDATE.slice(0, 10)}')(ORI_BOARD_CODE="${code}")`,
      'PARENT_NETPROFIT',
      '-1',
      30
    );
    profit = profitRows
      .map((r) => normalizeASharePeer(r, { profit: num(r.PARENT_NETPROFIT) != null ? num(r.PARENT_NETPROFIT) / 1e8 : null }))
      .filter((p) => p && p.code !== stock.code && Number.isFinite(p.profit) && p.profit > 0)
      .sort((a, b) => b.profit - a.profit)
      .slice(0, 3);
  }

  if (!cap.length && !profit.length) throw new Error('数据中心行业榜暂无可用数据');

  return {
    supported: true,
    boardCode: code,
    boardName: info.name || industryName || '',
    cap,
    profit,
    profitPeriod,
    source: '东方财富数据中心',
    note: '行业板块接口不可用，已回退到东方财富数据中心行业榜',
  };
}

async function getASharePeers(stock, industryName, industryCode) {
  if (!industryName && !industryCode) throw new Error('未识别到所属行业');
  try {
    const boards = await getIndustryBoards();
    const targetNorm = normIndustry(industryName);
    const board =
      boards.find((b) => b.name === industryName) ||
      boards.find((b) => normIndustry(b.name) === targetNorm) ||
      boards.find((b) => sameIndustry(b.name, industryName));
    if (!board) throw new Error(`未找到「${industryName}」行业板块`);

    const [capRows, profitRows] = await Promise.all([
      fetchBoardConstituents(board.code, 'f20'),
      fetchBoardConstituents(board.code, 'f105'),
    ]);
    const cap = capRows
      .filter((r) => r.code && r.code !== stock.code && Number.isFinite(r.marketCap))
      .sort((a, b) => b.marketCap - a.marketCap)
      .slice(0, 3);
    const profit = profitRows
      .filter((r) => r.code && r.code !== stock.code && Number.isFinite(r.profit) && r.profit > 0)
      .sort((a, b) => b.profit - a.profit)
      .slice(0, 3);
    if (!cap.length && !profit.length) throw new Error('行业板块未返回成分股');
    [...cap, ...profit].forEach((p) => {
      const mk = p.marketId === 1 ? 'sh' : /^(4|8)/.test(p.code) ? 'bj' : 'sz';
      p.quoteKey = mk + p.code;
      p.klineCode = p.quoteKey;
      p.market = 'A';
      p.rawCode = p.code;
    });

    if (!cap.length || !profit.length) {
      try {
        const dcInfo = industryCode ? { code: String(industryCode) } : await getAShareIndustryCode(stock);
        const dc = await getASharePeersFromDataCenter(
          stock,
          industryName,
          dcInfo && /^\d+$/.test(dcInfo.code || '') ? dcInfo.code : ''
        );
        return {
          supported: true,
          boardCode: board.code,
          boardName: board.name || dc.boardName,
          cap: cap.length ? cap : dc.cap,
          profit: profit.length ? profit : dc.profit,
          profitPeriod: dc.profitPeriod || '',
          source: '东方财富行业板块 / 数据中心',
          note: `行业板块接口返回不完整，已用数据中心补齐${profit.length ? '' : '利润榜'}`,
        };
      } catch (e) {}
    }

    return {
      supported: true,
      boardCode: board.code,
      boardName: board.name,
      cap,
      profit,
      profitPeriod: '',
      source: '东方财富行业板块',
      note: '按行业板块成分股排序',
    };
  } catch (e) {
    return getASharePeersFromDataCenter(stock, industryName, industryCode);
  }
}
