/* ---------------- transport ---------------- */
async function fetchJSON(url, options = {}) {
  const { timeout = 15000, headers = {} } = options;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, {
      signal: ctrl.signal,
      cache: 'no-store',
      /* 部署到 https（如 GitHub Pages）后浏览器会自动带 Referer，
         东方财富 WAF 会拦截非东财来源的 Referer（HTTP 567）。
         数据接口不依赖 Referer，显式关闭即可两地通用。 */
      referrerPolicy: 'no-referrer',
      headers: { Accept: 'application/json,text/plain,*/*', ...headers },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function jsonp(url, options = {}) {
  const { timeout = 12000, callbackParam = 'cb' } = options;
  return new Promise((resolve, reject) => {
    const cbName = '__slcb_' + Math.random().toString(36).slice(2, 10);
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => {
      clearTimeout(timer);
      script.remove();
      try {
        delete window[cbName];
      } catch (e) {}
    };
    const finish = (fn, value) => {
      if (done) return;
      done = true;
      cleanup();
      fn(value);
    };
    const timer = setTimeout(() => finish(reject, new Error('数据接口超时')), timeout);
    window[cbName] = (data) => finish(resolve, data);
    script.onerror = () => finish(reject, new Error('数据接口连接失败'));
    script.src = url + (url.includes('?') ? '&' : '?') + callbackParam + '=' + encodeURIComponent(cbName);
    script.charset = 'utf-8';
    script.referrerPolicy = 'no-referrer';
    document.head.appendChild(script);
  });
}

/* Eastmoney 接口串行 + 最小间隔，降低被限流概率 */
let emChain = Promise.resolve();
let emLast = 0;
function emQueue(fn, gap = 280) {
  const run = async () => {
    const wait = gap - (Date.now() - emLast);
    if (wait > 0) await sleep(wait);
    try {
      return await fn();
    } finally {
      emLast = Date.now();
    }
  };
  const p = emChain.then(run, run);
  emChain = p.catch(() => {});
  return p;
}
const emJsonp = (url) => emQueue(() => jsonp(url));
const emJSON = (url, opts) => emQueue(() => fetchJSON(url, opts));

/* ---------------- search ---------------- */
let searchChain = Promise.resolve();
const searchMemo = new Map();

function smartbox(query) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    const prev = window.v_hint;
    let done = false;
    const cleanup = () => {
      clearTimeout(timer);
      script.remove();
      try {
        if (prev === undefined) delete window.v_hint;
        else window.v_hint = prev;
      } catch (e) {}
    };
    const finish = (fn, v) => {
      if (done) return;
      done = true;
      cleanup();
      fn(v);
    };
    const timer = setTimeout(() => finish(reject, new Error('搜索超时')), 7000);
    script.onload = () => {
      const raw = window.v_hint || '';
      finish(resolve, raw);
    };
    script.onerror = () => finish(reject, new Error('搜索服务不可用'));
    script.charset = 'utf-8';
    script.src = `${API.smartbox}?q=${encodeURIComponent(query)}&t=all&r=${Date.now()}`;
    document.head.appendChild(script);
  });
}

function normalizeSearchItem(part) {
  const f = part.split('~');
  if (f.length < 5) return null;
  const mk = f[0];
  const rawCode = (f[1] || '').trim();
  const name = stripTags(f[2] || '');
  const pinyin = (f[3] || '').trim();
  const type = f[4] || '';
  /* 放行个股(GP)与场内基金/ETF(ETF/ET/JJ)，其余类型维持原样丢弃 */
  if (!/^(GP|ETF|ET|JJ)/i.test(type)) return null;
  if (!rawCode || !name) return null;
  const kind = /^(ETF|ET|JJ)/i.test(type) ? 'etf' : 'stock';

  if (mk === 'sh' || mk === 'sz' || mk === 'bj') {
    return { market: 'A', code: rawCode, name, pinyin, quoteKey: mk + rawCode, rawCode, klineCode: mk + rawCode, kind };
  }
  if (mk === 'hk') {
    const code = rawCode.replace(/\D/g, '').padStart(5, '0');
    return { market: 'HK', code, name, pinyin, quoteKey: 'hk' + code, rawCode: code, klineCode: 'hk' + code };
  }
  if (mk === 'us') {
    /* 腾讯搜索返回的 rawCode 带交易所后缀（AAPL.OQ / AMJB.AM / BRK.A.N），
       统一交给 usStockFields 生成 quoteKey 与 K 线键（FR-19.2） */
    return Object.assign(usStockFields(rawCode.toUpperCase(), name), { pinyin });
  }
  return null;
}

function parseSearchRaw(raw) {
  if (!raw || typeof raw !== 'string') return [];
  const seen = new Set();
  const out = [];
  raw.split('^').forEach((part) => {
    const item = normalizeSearchItem(part);
    if (!item) return;
    const id = item.market + ':' + item.code;
    if (seen.has(id)) return;
    seen.add(id);
    out.push(item);
  });
  return out.slice(0, 8);
}

const SEARCH_MEMO_MAX = 50;

function searchStocks(query) {
  const q = String(query || '').trim();
  if (!q) return Promise.resolve([]);
  const memo = searchMemo.get(q);
  if (memo && Date.now() - memo.t < 5 * 60 * 1000) return Promise.resolve(memo.d);
  if (memo) searchMemo.delete(q); /* 过期条目随手清除，避免 Map 只增不减 */
  /* 股票联想、加密候选与商品别名并行；任一路失败都不影响其他路 */
  const run = async () => {
    const coinPromise = typeof searchCrypto === 'function' ? searchCrypto(q) : Promise.resolve([]);
    const commodity =
      typeof searchCommodities === 'function' ? searchCommodities(q) : [];
    const [stockRes, cryptoRes] = await Promise.allSettled([smartbox(q), coinPromise]);
    const crypto = cryptoRes.status === 'fulfilled' ? cryptoRes.value || [] : [];
    const stocks = stockRes.status === 'fulfilled' ? parseSearchRaw(stockRes.value) : [];
    const seen = new Set([...commodity, ...crypto].map((s) => s.market + ':' + s.code));
    return commodity
      .concat(crypto)
      .concat(stocks.filter((s) => !seen.has(s.market + ':' + s.code)))
      .slice(0, 10);
  };
  const p = searchChain.then(run, run);
  searchChain = p.catch(() => {});
  return p.then((d) => {
    if (searchMemo.size >= SEARCH_MEMO_MAX) {
      searchMemo.delete(searchMemo.keys().next().value); /* 超上限淘汰最早插入的条目 */
    }
    searchMemo.set(q, { t: Date.now(), d });
    return d;
  });
}

function parseSymbolInput(input) {
  const q = String(input || '').trim();
  if (!q) return null;
  let m = q.match(/^(sh|sz|bj)(\d{6})$/i);
  if (m) {
    const mk = m[1].toLowerCase();
    const code = m[2];
    return { market: 'A', code, name: code, quoteKey: mk + code, rawCode: code, klineCode: mk + code };
  }
  if (/^\d{6}$/.test(q)) {
    const mk = aSharePrefix(q);
    return { market: 'A', code: q, name: q, quoteKey: mk + q, rawCode: q, klineCode: mk + q, kind: isEtfCode(q) ? 'etf' : 'stock' };
  }
  m = q.match(/^hk(\d{1,5})$/i);
  if (m) {
    const code = m[1].padStart(5, '0');
    return { market: 'HK', code, name: code, quoteKey: 'hk' + code, rawCode: code, klineCode: 'hk' + code };
  }
  if (/^\d{1,5}$/.test(q)) {
    const code = q.padStart(5, '0');
    return { market: 'HK', code, name: code, quoteKey: 'hk' + code, rawCode: code, klineCode: 'hk' + code };
  }
  m = q.match(/^us([A-Za-z][A-Za-z0-9.\-]*)$/i);
  if (m) return usStockFields(m[1]);
  /* 商品显式前缀与中文/英文别名；两字母代码（CL/GC/SI）不在别名表，仍按美股解析 */
  m = q.match(/^(?:cmd|commodity):([a-z][a-z0-9_-]*)$/i);
  if (m) {
    const hit = typeof normalizeCommodityStock === 'function' ? normalizeCommodityStock({ key: m[1] }) : null;
    if (hit) return hit;
  }
  const commodity =
    typeof commodityResolveQuery === 'function' ? commodityResolveQuery(q) : null;
  if (commodity) return commodity;
  /* 加密货币别名优先于「字母即美股」的兜底：BTC / btc / 比特币 / 以太坊 */
  const coin = typeof cryptoResolveQuery === 'function' ? cryptoResolveQuery(q) : null;
  if (coin) return coin;
  if (/^[A-Za-z][A-Za-z0-9.\-]{0,11}$/.test(q)) return usStockFields(q);
  return null;
}

/* ---------------- Tencent quote ---------------- */
function decodeGBK(buffer) {
  try {
    return new TextDecoder('gbk').decode(buffer);
  } catch (e) {
    try {
      return new TextDecoder('utf-8').decode(buffer);
    } catch (e2) {
      return '';
    }
  }
}

function parseQuoteLine(key, raw) {
  if (!raw) throw new Error('行情数据为空');
  const f = raw.split('~');
  if (f.length < 38) throw new Error('行情数据格式异常');
  const market = marketFromKey(key);
  const price = num(f[3]);
  if (!Number.isFinite(price) || price <= 0) throw new Error('未找到该股票的行情');
  const quote = {
    key,
    market,
    name: stripTags(f[1] || ''),
    rawCode: f[2] || '',
    price,
    prevClose: num(f[4], 0),
    open: num(f[5], 0),
    volume: num(f[36], num(f[6], 0)),
    time: formatQuoteTime(f[30]),
    change: num(f[31], 0),
    changePct: num(f[32], 0),
    high: num(f[33], 0),
    low: num(f[34], 0),
    currency: currencyOf(market),
    source: '腾讯财经',
  };
  if (market === 'A') {
    quote.amount = num(f[37], 0) * 1e4;
    quote.turnover = num(f[38]);
    quote.pe = num(f[39]);
    quote.pb = num(f[46]);
    quote.floatCap = num(f[44]);
    quote.marketCap = num(f[45]);
    quote.high52 = num(f[67]);
    quote.low52 = num(f[68]);
    quote.volumeRatio = num(f[49]);
  } else if (market === 'HK') {
    quote.amount = num(f[37], 0);
    quote.turnover = null;
    quote.pe = num(f[39]);
    quote.pb = num(f[47]);
    quote.marketCap = num(f[45]);
    quote.high52 = num(f[48]);
    quote.low52 = num(f[49]);
  } else {
    quote.amount = num(f[37], 0);
    quote.turnover = num(f[38]);
    quote.pe = num(f[39]);
    quote.pb = num(f[47]);
    quote.marketCap = num(f[45]);
    quote.high52 = num(f[48]);
    quote.low52 = num(f[49]);
  }
  return quote;
}

async function fetchQuoteKey(key) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(API.quote + encodeURIComponent(key), { signal: ctrl.signal, cache: 'no-store' });
    if (!res.ok) throw new Error(`行情 HTTP ${res.status}`);
    const buf = await res.arrayBuffer();
    const text = decodeGBK(buf);
    const escKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    let m = text.match(new RegExp('v_' + escKey + '="([^"]*)"'));
    if (!m) m = text.match(/v_[^=]+="([^"]*)"/);
    return parseQuoteLine(key, m ? m[1] : '');
  } finally {
    clearTimeout(timer);
  }
}

async function getQuote(stock) {
  /* 美股同一标的可能有多种写法（腾讯 raw / 东财 secucode / 手输），逐个候选键兜底（FR-19.2） */
  const keys = stock.market === 'US' ? usQuoteKeys(stock) : [stock.quoteKey || stock.klineCode];
  const list = keys.filter(Boolean);
  if (!list.length) throw new Error('缺少行情代码');
  let lastErr = null;
  for (const key of list) {
    try {
      return await cached('quote:' + key, TTL.quote, () => fetchQuoteKey(key));
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('未找到该股票的行情');
}

async function getQuoteBatch(keys) {
  const list = [...new Set((keys || []).filter(Boolean))];
  if (!list.length) return new Map();
  const chunks = [];
  for (let i = 0; i < list.length; i += 60) chunks.push(list.slice(i, i + 60));
  const pages = await Promise.all(
    chunks.map(async (chunk) => {
      /* 与 getQuote 一致的超时控制，避免网络挂起时 Promise 长期悬空 */
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      try {
        const res = await fetch(API.quote + chunk.map(encodeURIComponent).join(','), {
          signal: ctrl.signal,
          cache: 'no-store',
        });
        if (!res.ok) throw new Error(`行情 HTTP ${res.status}`);
        const text = decodeGBK(await res.arrayBuffer());
        const out = [];
        const re = /v_([^=]+)="([^"]*)"/g;
        let m;
        while ((m = re.exec(text))) {
          try {
            out.push(parseQuoteLine(m[1], m[2]));
          } catch (e) {}
        }
        return out;
      } finally {
        clearTimeout(timer);
      }
    })
  );
  return new Map(pages.flat().map((q) => [q.key, q]));
}

/* ---------------- Tencent K-line ---------------- */
/* K 线周期：同一腾讯接口切换 period 参数（FR-3.2）；v2.3 增加分钟级周期 */
const KLINE_PERIODS = ['day', 'week', 'month', '60m', '15m', '5m'];
const INTRADAY_PERIODS = ['60m', '15m', '5m'];
const KLINE_PERIOD_LABELS = { day: '日K', week: '周K', month: '月K', '60m': '60分', '15m': '15分', '5m': '5分' };
const KLINE_PERIOD_META = { day: '日K', week: '周K', month: '月K', '60m': '60 分钟', '15m': '15 分钟', '5m': '5 分钟' };
const KLINE_WINDOW = { day: 240, week: 260, month: 140, '60m': 180, '15m': 180, '5m': 180 };
const KLINE_COUNT = { day: 320, week: 260, month: 140, '60m': 240, '15m': 240, '5m': 240 };
/* 东财周期参数：101 日 / 102 周 / 103 月 / 60、15、5 分钟 */
const EM_KLT = { day: 101, week: 102, month: 103, '60m': 60, '15m': 15, '5m': 5 };
/* 起始日期：早于所需根数即可，东财按 beg..end 返回区间，取尾部 KLINE_COUNT 根 */
const EM_BEG = { day: '20230101', week: '20180101', month: '20100101' };
/* 分钟线按回溯天数动态计算 beg（东财分钟线可用历史有限，取到由接口截断） */
const EM_BEG_DAYS = { '60m': 200, '15m': 60, '5m': 20 };
function isIntradayPeriod(period) {
  return INTRADAY_PERIODS.includes(period);
}
function emBegDate(period) {
  if (EM_BEG[period]) return EM_BEG[period];
  const days = EM_BEG_DAYS[period] || 30;
  const d = new Date();
  d.setDate(d.getDate() - days);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`;
}

function normalizeKlinePeriod(period) {
  return KLINE_PERIODS.includes(period) ? period : 'day';
}
/* 东财 secid：沪市 1. / 深市及北交所 0. / 港股 116.；美股不走东财（保留腾讯 usfqkline） */
function emSecid(stock) {
  if (stock.market === 'HK') return '116.' + String(stock.code || '').replace(/\D/g, '').padStart(5, '0').slice(-5);
  const c = String(stock.code || '').replace(/\D/g, '');
  return (aSharePrefix(c) === 'sh' ? '1.' : '0.') + c;
}
/* 解析东财 klines：f51日期 f52开 f53收 f54高 f55低 f56量（与腾讯列序一致） */
function parseEmKlines(lines) {
  return lines
    .map((line) => {
      const row = String(line).split(',');
      return {
        date: row[0],
        open: num(row[1]),
        close: num(row[2]),
        high: num(row[3]),
        low: num(row[4]),
        volume: num(row[5], 0),
      };
    })
    .filter((r) => Number.isFinite(r.close) && r.date);
}
function klineMetrics(points) {
  const closes = points.map((p) => num(p.close)).filter((n) => Number.isFinite(n) && n > 0);
  if (closes.length < 2) throw new Error('历史行情数据不足');
  const last = closes[closes.length - 1];
  const ret = (n) => (closes.length > n ? (last / closes[closes.length - 1 - n] - 1) * 100 : null);
  const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
  const ma = (n) => (closes.length >= n ? avg(closes.slice(-n)) : null);
  const daily = [];
  for (let i = 1; i < closes.length; i++) daily.push(closes[i] / closes[i - 1] - 1);
  const recent = daily.slice(-120);
  const mean = recent.length ? avg(recent) : 0;
  const variance = recent.length ? avg(recent.map((r) => (r - mean) ** 2)) : 0;
  const volatility = Math.sqrt(variance) * Math.sqrt(252) * 100;
  let peak = closes[0];
  let maxDrawdown = 0;
  closes.slice(-120).forEach((c) => {
    peak = Math.max(peak, c);
    maxDrawdown = Math.min(maxDrawdown, (c / peak - 1) * 100);
  });
  const ma20 = ma(20);
  const ma60 = ma(60);
  let trend = '震荡';
  if (ma20 && ma60) {
    if (last > ma20 && ma20 > ma60) trend = '多头排列';
    else if (last < ma20 && ma20 < ma60) trend = '空头排列';
  }
  return {
    last,
    r20: ret(20),
    r60: ret(60),
    r120: ret(120),
    ma20,
    ma60,
    volatility,
    maxDrawdown,
    trend,
    points: closes.length,
  };
}

async function getKline(stock, quote, period = 'day') {
  const p = normalizeKlinePeriod(period);
  /* 加密资产走 Binance 数据镜像，与 A/HK/US 的东财/腾讯链路完全隔离 */
  if (stock.market === 'CRYPTO' || stock.kind === 'coin') return getCryptoKline(stock, p);
  /* 大宗商品走东财商品 secid（101/102/112），与股票 K 线链路隔离 */
  if (stock.market === 'COMMODITY' || stock.kind === 'commodity') return getCommodityKline(stock, p);
  let key = stock.klineCode || stock.quoteKey;
  if (stock.market === 'US') {
    /* 腾讯 usfqkline 需要带交易所后缀的完整 raw：AAPL.OQ / BRK.A.N / BAC-B.N（FR-19.2） */
    const raw = String((quote && quote.rawCode) || stock.rawCode || '')
      .replace(/^us/i, '')
      .trim()
      .toUpperCase();
    if (raw) key = 'us' + raw;
  }
  if (!key) throw new Error('缺少 K 线代码');
  const isUS = stock.market === 'US';
  const intraday = isIntradayPeriod(p);
  const count = KLINE_COUNT[p] || 320;
  const build = (points, source) => {
    if (points.length < 5) throw new Error('K 线数据不足');
    /* 技术面指标仅在日线上有意义，周/月/分钟只返回原始点供图表使用 */
    return { key, period: p, points, metrics: p === 'day' ? klineMetrics(points) : null, source };
  };
  return cached(`kline:${p}:${key}`, klineTtl(p), async () => {
    /* A股/港股/ETF 主源：东财 push2his 前复权（腾讯 fqkline 已被 WAF 拦截返回 501）。
       美股分钟线同样走东财（日/周/月仍用腾讯）；ETF 不做前复权（fqt=0），个股与港股用前复权（fqt=1）。 */
    if (!isUS || intraday) {
      try {
        const secid = isUS ? emUsSecid(stock, quote) : emSecid(stock);
        if (!secid) throw new Error('缺少 K 线代码');
        const params = new URLSearchParams({
          secid,
          fields1: 'f1,f2,f3,f4,f5,f6',
          fields2: 'f51,f52,f53,f54,f55,f56',
          klt: String(EM_KLT[p]),
          fqt: stock.kind === 'etf' || isEtfCode(stock.code) ? '0' : '1',
          beg: emBegDate(p),
          end: '20500101',
          lmt: String(count),
        });
        const data = await emJsonp(`${API.emKline}?${params}`);
        const lines = data && data.data && data.data.klines;
        if (Array.isArray(lines) && lines.length) {
          const points = parseEmKlines(lines.slice(-count));
          if (points.length >= 5) return build(points, '东方财富');
        }
      } catch (e) {
        /* 东财不可用：分钟线无其他数据源，直接失败；日/周/月回退腾讯 */
        if (intraday) throw new Error('分时 K 线数据暂不可用');
      }
    }
    /* 分钟线仅东财提供，走腾讯会拿到错误周期，直接失败避免画错数据 */
    if (intraday) throw new Error('分时 K 线数据暂不可用');
    /* 回退 / 美股：腾讯 fqkline（美股为 usfqkline）。注：腾讯 A股/港股 fqkline 当前被 WAF 拦截，
       仅在东财异常时才可能失败，保留兜底以便上游恢复后自动可用。 */
    const base = isUS ? API.usKline : API.kline;
    const url = `${base}?param=${encodeURIComponent(key)},${p},,,${count},qfq`;
    const data = await fetchJSON(url, { timeout: 15000 });
    const block = data && data.data && (data.data[key] || Object.values(data.data)[0]);
    if (!block) throw new Error('K 线数据为空');
    /* A/美股前复权键为 qfqday/qfqweek/qfqmonth，港股直接为 day/week/month（FR-3.7） */
    const arr = block[`qfq${p}`] || block[p] || [];
    return build(
      arr
        .map((row) => ({
          date: row[0],
          open: num(row[1]),
          close: num(row[2]),
          high: num(row[3]),
          low: num(row[4]),
          volume: num(row[5], 0),
        }))
        .filter((r) => Number.isFinite(r.close) && r.date),
      '腾讯财经'
    );
  });
}

/* ---------------- Eastmoney financials / profile ---------------- */
/* 美股交易所后缀映射（FR-19.2）：腾讯 raw 用 .OQ/.N/.AM/.PS，手输与东财 secucode 用
   .O/.N/.A/.NYSE/.AMEX。105 纳斯达克 / 106 纽交所 / 107 美交所，缺省按纳斯达克兜底。 */
const US_EXCHANGE = {
  OQ: { em: 'O', market: '105' },
  O: { em: 'O', market: '105' },
  PS: { em: 'O', market: '105' },
  N: { em: 'N', market: '106' },
  NYSE: { em: 'N', market: '106' },
  AM: { em: 'A', market: '107' },
  AMEX: { em: 'A', market: '107' },
  A: { em: 'A', market: '107' },
};
/* 去掉交易所后缀、保留类股段：AAPL.OQ → AAPL，BRK.A.N → BRK.A，JPM.NYSE → JPM，BRK.A → BRK */
function usStripExchange(raw) {
  const parts = String(raw || '')
    .replace(/^us/i, '')
    .trim()
    .toUpperCase()
    .split('.')
    .filter(Boolean);
  if (parts.length > 1 && US_EXCHANGE[parts[parts.length - 1]]) parts.pop();
  return parts.join('.');
}
/* 东财类股/优先股用下划线：BRK.A → BRK_A，BAC-B → BAC_B */
function usEmCode(raw) {
  return usStripExchange(raw).replace(/[.\-]/g, '_');
}
/* 腾讯只认「去交易所后缀」的代码：东财下划线转回点（BRK_A → BRK.A） */
function usTencentCode(raw) {
  return String(raw || '')
    .replace(/^us/i, '')
    .trim()
    .toUpperCase()
    .replace(/_([A-Z])$/, '.$1');
}
/* 腾讯 quote 候选键：类股形态优先、去后缀其次、仅首段兜底（手输 BRK.A / 东财 BRK_A 等） */
function usQuoteKeys(stock, quote) {
  const raw = String((quote && quote.rawCode) || (stock && stock.rawCode) || (stock && stock.code) || '')
    .replace(/^us/i, '')
    .trim()
    .toUpperCase();
  if (!raw) return [];
  const parts = raw.split('.').filter(Boolean);
  const keys = [];
  const push = (code) => {
    const c = usTencentCode(code);
    if (!c) return;
    const k = 'us' + c;
    if (!keys.includes(k)) keys.push(k);
  };
  const classLike = parts.length === 2 && parts[1].length === 1 && !/[._\-]/.test(parts[0]);
  if (classLike) push(parts.join('.')); /* 两段且末段单字母更像类股：BRK.A → usBRK.A */
  push(usStripExchange(raw)); /* BRK.A.N → BRK.A，BRK_A.N → BRK.A */
  if (parts.length > 1) push(parts[0]); /* 再退一步只留首段：BRK.A → BRK */
  return keys;
}
/* 标准美股字段：搜索 / 手输 / hash / 数据集统一走这里 */
function usStockFields(raw, name) {
  const upper = String(raw || '')
    .replace(/^us/i, '')
    .trim()
    .toUpperCase();
  const code = usTencentCode(usStripExchange(upper));
  return {
    market: 'US',
    code,
    name: name || code,
    quoteKey: 'us' + code,
    rawCode: upper,
    klineCode: 'us' + upper,
  };
}
const US_DEFAULT_EXCHANGE = { em: 'O', market: '105' };
/* 拆分美股代码：raw 末段命中映射表即视为交易所，其余段（类股/优先股）转下划线 */
function parseUsRaw(stock, quote) {
  const raw = String((quote && quote.rawCode) || (stock && stock.rawCode) || (stock && stock.code) || '')
    .replace(/^us/i, '')
    .trim()
    .toUpperCase();
  if (!raw) return null;
  const parts = raw.split('.').filter(Boolean);
  const last = parts[parts.length - 1];
  const exchange = (parts.length > 1 && US_EXCHANGE[last]) || US_DEFAULT_EXCHANGE;
  return { code: usEmCode(raw), exchange };
}

/* 美股 secucode：东财口径 = 代码（类股用下划线） + .O/.N/.A */
function usSecucode(stock, quote) {
  const p = parseUsRaw(stock, quote);
  return p ? `${p.code}.${p.exchange.em}` : '';
}

/* 美股东财 secid（分钟线用）：105 纳斯达克 / 106 纽交所 / 107 美交所 */
function emUsSecid(stock, quote) {
  const p = parseUsRaw(stock, quote);
  return p ? `${p.exchange.market}.${p.code}` : '';
}

/* 东财美股财报为长表：每行一个科目，按 REPORT（如 2026/FY）分组后透视 */
function usReportGroups(rows) {
  const map = new Map();
  (Array.isArray(rows) ? rows : []).forEach((r) => {
    if (!r || !r.REPORT) return;
    const key = String(r.REPORT);
    let g = map.get(key);
    if (!g) {
      g = {
        report: key,
        date: String(r.REPORT_DATE || ''),
        type: String(r.REPORT_TYPE || ''),
        label: String(r.REPORT_TYPE_DETAILS || r.REPORT_TYPE || key),
        currency: r.CURRENCY_ABBR || r.CURRENCY || 'USD',
        items: new Map(),
      };
      map.set(key, g);
    }
    const name = String(r.ITEM_NAME || '').trim();
    if (name && !g.items.has(name)) g.items.set(name, r);
  });
  return Array.from(map.values()).sort((a, b) => b.date.localeCompare(a.date));
}

function usItem(group, names) {
  if (!group) return null;
  for (const name of names) {
    const row = group.items.get(name);
    if (row && Number.isFinite(num(row.AMOUNT))) return row;
  }
  return null;
}

const US_REVENUE_ITEMS = ['营业收入', '主营收入', '收入总额', '营业总收入', '总营业收入'];
const US_PROFIT_ITEMS = ['归属于母公司股东净利润', '归属于普通股股东净利润', '净利润'];
const US_EQUITY_ITEMS = ['股东权益合计', '归属于母公司股东权益', '总权益'];
const US_EPS_ITEMS = ['基本每股收益-普通股', '摊薄每股收益-普通股'];
const US_SHARES_ITEMS = ['基本加权平均股数-普通股', '摊薄加权平均股数-普通股'];

/* 纯函数：长表行 → 与 A 股/港股同字段口径的财务对象（可离线单测） */
function buildUSFinancials(incomeRows, balanceRows) {
  const groups = usReportGroups(incomeRows);
  if (!groups.length) return { supported: true, empty: true, history: [] };
  const balanceMap = new Map(usReportGroups(balanceRows).map((g) => [g.report, g]));
  const isAnnual = (g) => /年报|年度/.test(g.type || '') || /FY$/i.test(g.report || '');

  const readGroup = (g) => {
    const b = balanceMap.get(g.report) || null;
    const revenue = usItem(g, US_REVENUE_ITEMS);
    const profit = usItem(g, US_PROFIT_ITEMS);
    const gross = usItem(g, ['毛利']);
    const eps = usItem(g, US_EPS_ITEMS);
    const shares = usItem(g, US_SHARES_ITEMS);
    const equity = usItem(b, US_EQUITY_ITEMS);
    const assets = usItem(b, ['总资产']);
    const liabilities = usItem(b, ['总负债']);
    return {
      revenue: revenue ? num(revenue.AMOUNT) : null,
      revenueYoY: revenue ? num(revenue.YOY_RATIO) : null,
      profit: profit ? num(profit.AMOUNT) : null,
      profitYoY: profit ? num(profit.YOY_RATIO) : null,
      gross: gross ? num(gross.AMOUNT) : null,
      eps: eps ? num(eps.AMOUNT) : null,
      shares: shares ? num(shares.AMOUNT) : null,
      equity: equity ? num(equity.AMOUNT) : null,
      assets: assets ? num(assets.AMOUNT) : null,
      liabilities: liabilities ? num(liabilities.AMOUNT) : null,
    };
  };

  const latest = groups[0];
  const cur = readGroup(latest);
  const prev = groups[1] ? readGroup(groups[1]) : null;
  const avgEquity =
    Number.isFinite(cur.equity) && prev && Number.isFinite(prev.equity) && prev.equity > 0
      ? (cur.equity + prev.equity) / 2
      : cur.equity;
  /* 单季/中报利润不能直接当年度回报，ROE 仅在年报口径下计算 */
  const roe = isAnnual(latest) && cur.profit > 0 && avgEquity > 0 ? (cur.profit / avgEquity) * 100 : null;
  const grossMargin = cur.gross > 0 && cur.revenue > 0 ? (cur.gross / cur.revenue) * 100 : null;
  const debtRatio = cur.liabilities > 0 && cur.assets > 0 ? (cur.liabilities / cur.assets) * 100 : null;
  const bps = cur.equity > 0 && cur.shares > 0 ? cur.equity / cur.shares : null;

  const history = groups.slice(0, 4).map((g, i) => {
    const row = readGroup(g);
    const prior = groups[i + 1] ? readGroup(groups[i + 1]) : null;
    const eqAvg =
      Number.isFinite(row.equity) && prior && Number.isFinite(prior.equity) && prior.equity > 0
        ? (row.equity + prior.equity) / 2
        : row.equity;
    return {
      period: g.label,
      revenueYoY: row.revenueYoY,
      profitYoY: row.profitYoY,
      roe: isAnnual(g) && row.profit > 0 && eqAvg > 0 ? (row.profit / eqAvg) * 100 : null,
    };
  });

  return {
    supported: true,
    period: latest.label,
    reportDate: fmtDate(latest.date),
    revenue: cur.revenue,
    revenueYoY: cur.revenueYoY,
    profit: cur.profit,
    profitYoY: cur.profitYoY,
    grossMargin,
    roe,
    eps: cur.eps,
    bps,
    debtRatio,
    pe: null,
    pb: null,
    currency: latest.currency || 'USD',
    history,
    source: '东方财富 F10 · 美股年报',
  };
}

function normIndustry(s) {
  return String(s || '')
    .replace(/[（(].*?[）)]/g, '')
    .replace(/(Ⅱ|Ⅲ|II|III|行业|板块|产品|服务|制造|设备|其他)/gi, '')
    .replace(/[\s·\-—]/g, '')
    .toLowerCase();
}
function sameIndustry(a, b) {
  if (!a || !b) return false;
  if (String(a) === String(b)) return true;
  const na = normIndustry(a);
  const nb = normIndustry(b);
  if (!na || !nb) return false;
  return na === nb || na.includes(nb) || nb.includes(na);
}
function findIndustryCode(industryName) {
  if (!industryName) return null;
  const direct = Object.entries(INDUSTRY_CODES).find(([name]) => name === industryName);
  if (direct) return { code: direct[1], name: direct[0], reference: false };
  const norm = normIndustry(industryName);
  const candidates = Object.entries(INDUSTRY_CODES).filter(([name]) => {
    const n = normIndustry(name);
    return n === norm || n.includes(norm) || norm.includes(n);
  });
  if (candidates.length) return { code: candidates[0][1], name: candidates[0][0], reference: true };
  for (const [key, aliases] of Object.entries(INDUSTRY_ALIASES)) {
    if (normIndustry(key) === norm) {
      for (const alias of aliases) {
        if (INDUSTRY_CODES[alias]) return { code: INDUSTRY_CODES[alias], name: alias, reference: true };
      }
    }
  }
  return null;
}

function normalizeASharePeer(row, extras = {}) {
  if (!row || !row.SECURITY_CODE) return null;
  const code = String(row.SECURITY_CODE);
  if (/^(200|900)/.test(code)) return null;
  const mk = /^(6|9)/.test(code) ? 'sh' : /^(4|8)/.test(code) ? 'bj' : 'sz';
  return {
    market: 'A',
    code,
    name: stripTags(row.SECURITY_NAME_ABBR || code),
    marketCap: Number.isFinite(extras.marketCap) ? extras.marketCap : null,
    profit: Number.isFinite(extras.profit) ? extras.profit : null,
    pe: num(row.PE_RATIO),
    pb: num(row.PB_RATIO),
    quoteKey: mk + code,
    klineCode: mk + code,
    rawCode: code,
  };
}

async function getASharePeersFromDataCenter(stock, industryName, industryCode) {
  let info =
    industryCode && /^\d+$/.test(String(industryCode))
      ? { code: String(industryCode), name: industryName || '' }
      : await getAShareIndustryCode(stock);
  if (!info || !info.code) throw new Error('数据中心未返回行业代码');
  const code = info.code;

  const capColumns =
    'SECURITY_CODE,SECURITY_NAME_ABBR,INDUSTRY_NAME,INDUSTRY_CODE,TOTAL_MARKET_CAP,PE_RATIO,PB_RATIO,TMC_RANK';
  const profitColumns =
    'SECURITY_CODE,SECURITY_NAME_ABBR,PARENT_NETPROFIT,REPORTDATE,BOARD_NAME,ORI_BOARD_CODE';

  const [capRows, latestRows] = await Promise.all([
    dcQuery(
      'RPT_STOCK_INDUSTRY_STA',
      capColumns,
      `(INDUSTRY_CODE="${code}")`,
      'TOTAL_MARKET_CAP',
      '-1',
      30
    ),
    dcQuery(
      'RPT_LICO_FN_CPD',
      profitColumns,
      `(ORI_BOARD_CODE="${code}")`,
      'REPORTDATE',
      '-1',
      1
    ),
  ]);

  const cap = capRows
    .map((r) => normalizeASharePeer(r, { marketCap: num(r.TOTAL_MARKET_CAP) != null ? num(r.TOTAL_MARKET_CAP) / 1e8 : null }))
    .filter((p) => p && p.code !== stock.code && Number.isFinite(p.marketCap))
    .sort((a, b) => b.marketCap - a.marketCap)
    .slice(0, 3);

  let profit = [];
  let profitPeriod = '';
  const latest = latestRows[0];
  if (latest && latest.REPORTDATE) {
    profitPeriod = fmtDate(latest.REPORTDATE);
    const profitRows = await dcQuery(
      'RPT_LICO_FN_CPD',
      profitColumns,
      `(REPORTDATE='${latest.REPORTDATE.slice(0, 10)}')(ORI_BOARD_CODE="${code}")`,
      'PARENT_NETPROFIT',
      '-1',
      30
    );
    profit = profitRows
      .map((r) => normalizeASharePeer(r, { profit: num(r.PARENT_NETPROFIT) != null ? num(r.PARENT_NETPROFIT) / 1e8 : null }))
      .filter((p) => p && p.code !== stock.code && Number.isFinite(p.profit) && p.profit > 0)
      .sort((a, b) => b.profit - a.profit)
      .slice(0, 3);
  }

  if (!cap.length && !profit.length) throw new Error('数据中心行业榜暂无可用数据');

  return {
    supported: true,
    boardCode: code,
    boardName: info.name || industryName || '',
    cap,
    profit,
    profitPeriod,
    source: '东方财富数据中心',
    note: '行业板块接口不可用，已回退到东方财富数据中心行业榜',
  };
}

async function getASharePeers(stock, industryName, industryCode) {
  if (!industryName && !industryCode) throw new Error('未识别到所属行业');
  try {
    const boards = await getIndustryBoards();
    const targetNorm = normIndustry(industryName);
    const board =
      boards.find((b) => b.name === industryName) ||
      boards.find((b) => normIndustry(b.name) === targetNorm) ||
      boards.find((b) => sameIndustry(b.name, industryName));
    if (!board) throw new Error(`未找到「${industryName}」行业板块`);

    const [capRows, profitRows] = await Promise.all([
      fetchBoardConstituents(board.code, 'f20'),
      fetchBoardConstituents(board.code, 'f105'),
    ]);
    const cap = capRows
      .filter((r) => r.code && r.code !== stock.code && Number.isFinite(r.marketCap))
      .sort((a, b) => b.marketCap - a.marketCap)
      .slice(0, 3);
    const profit = profitRows
      .filter((r) => r.code && r.code !== stock.code && Number.isFinite(r.profit) && r.profit > 0)
      .sort((a, b) => b.profit - a.profit)
      .slice(0, 3);
    if (!cap.length && !profit.length) throw new Error('行业板块未返回成分股');
    [...cap, ...profit].forEach((p) => {
      const mk = p.marketId === 1 ? 'sh' : /^(4|8)/.test(p.code) ? 'bj' : 'sz';
      p.quoteKey = mk + p.code;
      p.klineCode = p.quoteKey;
      p.market = 'A';
      p.rawCode = p.code;
    });

    if (!cap.length || !profit.length) {
      try {
        const dcInfo = industryCode ? { code: String(industryCode) } : await getAShareIndustryCode(stock);
        const dc = await getASharePeersFromDataCenter(
          stock,
          industryName,
          dcInfo && /^\d+$/.test(dcInfo.code || '') ? dcInfo.code : ''
        );
        return {
          supported: true,
          boardCode: board.code,
          boardName: board.name || dc.boardName,
          cap: cap.length ? cap : dc.cap,
          profit: profit.length ? profit : dc.profit,
          profitPeriod: dc.profitPeriod || '',
          source: '东方财富行业板块 / 数据中心',
          note: `行业板块接口返回不完整，已用数据中心补齐${profit.length ? '' : '利润榜'}`,
        };
      } catch (e) {}
    }

    return {
      supported: true,
      boardCode: board.code,
      boardName: board.name,
      cap,
      profit,
      profitPeriod: '',
      source: '东方财富行业板块',
      note: '按行业板块成分股排序',
    };
  } catch (e) {
    return getASharePeersFromDataCenter(stock, industryName, industryCode);
  }
}

async function fetchMarketPeerPage(fs, sortField, page) {

  });
  const data = await emJsonp(`${API.push2}clist/get?${params}`);
  const diff = data && data.data && data.data.diff;
  const rows = Array.isArray(diff) ? diff : diff ? Object.values(diff) : [];
  return {

      code: String(r.f12 || ''),

      pb: num(r.f23),
      industry: stripTags(r.f100 || ''),
      marketId: num(r.f13),
    })),

}

async function getHKUSPeersFromPush2(stock, industryName) {
  if (!industryName) throw new Error('未识别到所属行业');
  const isHK = stock.market === 'HK';
  const fs = isHK ? 'm:128' : 'm:105,m:106,m:107';
  const collect = async (sortField) => {
    const matched = [];
    for (let page = 1; page <= 3; page++) {
      const { rows, total } = await fetchMarketPeerPage(fs, sortField, page);
      rows.forEach((r) => {
        if (sameIndustry(r.industry, industryName)) matched.push(r);
      });
      if (matched.length >= 3 || page * 100 >= total) break;
    }
    return matched
      .filter((r) => r.code && r.code !== stock.code)
      .slice(0, 3)
      .map((r) => ({
        market: stock.market,
        code: isHK ? String(r.code).padStart(5, '0') : usTencentCode(String(r.code).replace(/\..*$/, '')),
        name: r.name,
        marketCap: Number.isFinite(r.marketCap) ? r.marketCap : null,
        profit: Number.isFinite(r.profit) ? r.profit : null,
        pe: r.pe,
        pb: r.pb,
        quoteKey: isHK ? 'hk' + String(r.code).padStart(5, '0') : 'us' + usTencentCode(String(r.code).replace(/\..*$/, '')),
        klineCode: isHK ? 'hk' + String(r.code).padStart(5, '0') : 'us' + String(r.code),
      }));
  };
  const [cap, profit] = await Promise.all([collect('f20'), collect('f105')]);
  const hasProfit = profit.some((p) => Number.isFinite(p.profit) && p.profit > 0);
  return {
    supported: true,
    boardCode: '',
    boardName: industryName,
    cap,
    profit: hasProfit ? profit : [],
    profitPeriod: '',
    source: '东方财富市场列表',
    note: `按「${industryName}」行业标签匹配，覆盖可能不完整`,
  };
}

function dcQuoteString(s) {
  return String(s || '').replace(/["\\]/g, '');
}
function dcCodeInFilter(codes) {
  const unique = [...new Set((codes || []).map((c) => dcQuoteString(c)).filter(Boolean))];
  if (!unique.length) return '';
  return `(SECURITY_CODE in (${unique.map((c) => `"${c}"`).join(',')}))`;
}
function usBaseCode(raw) {
  return usStockFields(raw).code;
}
function peerCurrencyLabel(currency) {
  const c = String(currency || '').toUpperCase();
  if (c === 'HKD') return '港元';
  if (c === 'USD') return '美元';
  if (c === 'TWD') return '新台币';
  if (c === 'CNY' || c === 'RMB') return '元';
  return c || '元';
}
function peerMoney(yi, currency) {
  if (!Number.isFinite(yi)) return '—';
  const label = peerCurrencyLabel(currency);
  if (Math.abs(yi) >= 10000) return `${(yi / 10000).toFixed(2)}万亿${label}`;
  return `${fmtBig(yi)}${label}`;
}

async function getHKUSPeersFromDataCenter(stock, industryName) {
  if (!industryName) throw new Error('未识别到所属行业');
  const isHK = stock.market === 'HK';
  const profileReport = isHK ? 'RPT_HKF10_INFO_ORGPROFILE' : 'RPT_USF10_INFO_ORGPROFILE';
  const profiles = await dcQuery(
    profileReport,
    'SECURITY_CODE,SECURITY_NAME_ABBR,ORG_CODE,BELONG_INDUSTRY',
    `(BELONG_INDUSTRY="${dcQuoteString(industryName)}")`,
    'SECURITY_CODE',
    '1',
    500
  );
  const rows = (profiles || []).filter((r) => r && r.SECURITY_CODE);
  if (!rows.length) throw new Error(`未找到「${industryName}」行业成分股`);

  const orgMap = new Map();
  rows.forEach((r) => {
    const org = r.ORG_CODE || String(r.SECURITY_CODE);
    if (!orgMap.has(org)) {
      orgMap.set(org, {
        org,
        code: String(r.SECURITY_CODE),
        name: stripTags(r.SECURITY_NAME_ABBR || r.SECURITY_CODE),
      });
    }
  });
  const filter = dcCodeInFilter(rows.map((r) => r.SECURITY_CODE));

  if (isHK) {
    const finRows = await dcQuery(
      'RPT_HKF10_FN_MAININDICATOR',
      'SECURITY_CODE,SECURITY_NAME_ABBR,ORG_CODE,TOTAL_MARKET_CAP,HOLDER_PROFIT,REPORT_DATE,CURRENCY',
      filter,
      'REPORT_DATE',
      '-1',
      500
    );
    const latest = new Map();
    finRows.forEach((r) => {
      const org = r.ORG_CODE || String(r.SECURITY_CODE);
      if (!latest.has(org)) latest.set(org, r);
    });
    const peers = [...latest.entries()].map(([org, r]) => {
      const pref = orgMap.get(org) || { code: String(r.SECURITY_CODE), name: r.SECURITY_NAME_ABBR };
      const marketCap = num(r.TOTAL_MARKET_CAP);
      const profit = num(r.HOLDER_PROFIT);
      return {
        market: 'HK',
        code: pref.code,
        name: stripTags(pref.name || r.SECURITY_NAME_ABBR || pref.code),
        marketCap: marketCap != null ? marketCap / 1e8 : null,
        profit: profit != null ? profit / 1e8 : null,
        pe: null,
        pb: null,
        currency: 'HKD',
        reportDate: r.REPORT_DATE,
        quoteKey: 'hk' + pref.code,
        klineCode: 'hk' + pref.code,
      };
    });
    const cap = peers
      .filter((p) => p.code !== stock.code && Number.isFinite(p.marketCap) && p.marketCap > 0)
      .sort((a, b) => b.marketCap - a.marketCap)
      .slice(0, 3);
    const profit = peers
      .filter((p) => p.code !== stock.code && Number.isFinite(p.profit) && p.profit > 0)
      .sort((a, b) => b.profit - a.profit)
      .slice(0, 3);
    if (!cap.length && !profit.length) throw new Error('港股 F10 暂无行业排行数据');
    const dates = [...new Set(profit.map((p) => String(p.reportDate || '').slice(0, 10)).filter(Boolean))];
    return {
      supported: true,
      boardCode: '',
      boardName: industryName,
      cap,
      profit,
      profitPeriod: dates.length === 1 ? dates[0] : '',
      source: '东方财富港股 F10',
      note: `按「${industryName}」行业分类匹配，报告期以各公司最新可得数据为准`,
    };
  }

  const quoteMap = await getQuoteBatch([...orgMap.values()].map((p) => 'us' + p.code));
  const peerFromQuote = (org) => {
    const pref = orgMap.get(org);
    if (!pref) return null;
    const q = quoteMap.get('us' + pref.code);
    const rawCode = (q && q.rawCode) || pref.code;
    const code = usBaseCode(rawCode || pref.code);
    return {
      market: 'US',
      code,
      name: stripTags((q && q.name) || pref.name || code),
      rawCode: String(rawCode).toUpperCase(),
      marketCap: q && Number.isFinite(q.marketCap) ? q.marketCap : null,
      profit: null,
      pe: q ? q.pe : null,
      pb: q ? q.pb : null,
      currency: 'USD',
      quoteKey: 'us' + code,
      klineCode: 'us' + String(rawCode).toUpperCase(),
    };
  };

  const cap = [...orgMap.keys()]
    .map(peerFromQuote)
    .filter((p) => p && p.code !== stock.code && Number.isFinite(p.marketCap) && p.marketCap > 0)
    .sort((a, b) => b.marketCap - a.marketCap)
    .slice(0, 3);

  const incomeRows = await dcQuery(
    'RPT_USF10_FN_INCOME',
    'SECURITY_CODE,SECURITY_NAME_ABBR,ORG_CODE,REPORT_DATE,REPORT_TYPE,AMOUNT,CURRENCY,CURRENCY_ABBR',
    `${filter}(REPORT_TYPE in ("累计季报","年报"))(ITEM_NAME="归属于母公司股东净利润")`,
    'REPORT_DATE',
    '-1',
    500
  );
  const latestProfit = new Map();
  incomeRows.forEach((r) => {
    const org = r.ORG_CODE || String(r.SECURITY_CODE);
    if (!latestProfit.has(org)) latestProfit.set(org, r);
  });
  const profit = [...latestProfit.entries()]
    .map(([org, r]) => {
      const p = peerFromQuote(org);
      if (!p) return null;
      return {
        ...p,
        profit: num(r.AMOUNT) != null ? num(r.AMOUNT) / 1e8 : null,
        currency: r.CURRENCY_ABBR || r.CURRENCY || 'USD',
        reportDate: r.REPORT_DATE,
      };
    })
    .filter(
      (p) =>
        p &&
        p.code !== stock.code &&
        Number.isFinite(p.profit) &&
        p.profit > 0 &&
        String(p.currency).toUpperCase() === 'USD'
    )
    .sort((a, b) => b.profit - a.profit)
    .slice(0, 3);

  if (!cap.length && !profit.length) throw new Error('美股 F10 暂无行业排行数据');
  const dates = [...new Set(profit.map((p) => String(p.reportDate || '').slice(0, 10)).filter(Boolean))];
  return {
    supported: true,
    boardCode: '',
    boardName: industryName,
    cap,
    profit,
    profitPeriod: dates.length === 1 ? dates[0] : '',
    source: '东方财富美股 F10 / 腾讯财经',
    note: `按「${industryName}」行业分类匹配；利润榜仅统计美元口径，报告期以各公司最新累计数据为准`,
  };
}

async function getHKUSPeers(stock, industryName) {
  try {
    const dc = await getHKUSPeersFromDataCenter(stock, industryName);
    if (dc && (dc.cap.length || dc.profit.length)) return dc;

async function getPeers(stock, industryName, opts = {}) {
  const cacheKey = `peers:${stock.market}:${stock.code}:${industryName}:${opts.industryCode || ''}`;

/* ===== js/20-scoring.js ===== */
/* ============================================================
   Scoring engine — explainable, missing data never invented
   ============================================================ */
'use strict';

const DIM_META = [
  { key: 'reports', name: '研报与机构评级', short: '研报', weight: 30, icon: 'book' },
  { key: 'financial', name: '盈利与成长', short: '盈利', weight: 25, icon: 'trendUp' },
  { key: 'technical', name: '技术面动量', short: '技术', weight: 25, icon: 'activity' },
  { key: 'news', name: '新闻舆情', short: '舆情', weight: 20, icon: 'news' },
];

const SENTIMENT_POS = [
  '增长', '上涨', '大涨', '涨停', '新高', '突破', '增持', '回购', '中标', '签约', '合作', '获批',
  '利好', '超预期', '盈利', '扭亏', '提价', '扩产', '上调', '买入', '推荐', '创新高', '订单',
  '分红', '收购', '落地', '放量', '领先', '强劲', '改善',
];
const SENTIMENT_NEG = [
  '下跌', '大跌', '跌停', '新低', '亏损', '下滑', '减持', '处罚', '立案', '调查', '风险', '暴跌',
  '裁员', '下调', '终止', '退市', '诉讼', '违约', '造假', '爆雷', '警示', '冻结', '承压', '放缓',
  '低于预期', '计提', '商誉', '停牌', '负面', '召回',
];

function band(value, rows, fallback = 50) {
  if (!Number.isFinite(value)) return null;
  for (const [min, score] of rows) {
    if (value >= min) return score;
  }
  return fallback;
}

/* 覆盖度统一口径（FR-18.4）：缺失维度越多，折算系数越低。
   个股 / ETF / 加密共用，保证跨市场标签含义一致；仅覆盖 100% 时视为可比。 */
function coverageFactor(coverage) {
  const c = clamp(Number(coverage) || 0, 0, 100);
  return 0.6 + 0.4 * (c / 100);
}
function coverageMeta(coverage) {
  const c = Math.round(clamp(Number(coverage) || 0, 0, 100));
  return { coverage: c, comparable: c >= 100, factor: coverageFactor(c) };
}

function growthScore(v) {
  return band(v, [
    [50, 100], [30, 94], [20, 86], [10, 76], [5, 68], [0, 56], [-10, 38], [-25, 24],
  ], 12);
}
function roeScore(v) {
  return band(v, [
    [25, 100], [20, 94], [15, 84], [10, 72], [6, 60], [3, 48], [0, 34],
  ], 20);
}
function returnScore(r, scale) {
  if (!Number.isFinite(r)) return null;
  return clamp(50 + (r / scale) * 50, 0, 100);
}

function analyzeSentiment(news) {
  const rows = Array.isArray(news) ? news.filter((n) => n && n.title) : [];
  let pos = 0;
  let neg = 0;
  const details = [];
  rows.forEach((n) => {
    const text = `${n.title || ''} ${n.content || ''}`;
    let p = 0;
    let q = 0;
    SENTIMENT_POS.forEach((w) => {
      if (text.includes(w)) p += 1;
    });
    SENTIMENT_NEG.forEach((w) => {
      if (text.includes(w)) q += 1;
    });
    const cls = p > q ? 'pos' : q > p ? 'neg' : 'neu';
    if (cls === 'pos') pos += 1;
    else if (cls === 'neg') neg += 1;
    details.push({ ...n, senti: cls });
  });
  const total = rows.length;
  const neu = total - pos - neg;
  const score = total ? clamp(50 + ((pos - neg) / total) * 50, 0, 100) : null;
  return { total, pos, neu, neg, score, details };
}

function scoreReports(data, quote) {
  const { market, reports } = data;
  if (market !== 'A') {
    return { available: false, note: '港股 / 美股暂无免费中文研报源', reasons: [] };
  }
  const list = (reports && reports.list) || [];
  if (!list.length) {
    return { available: false, note: '近 6 个月未检索到个股研报', reasons: [] };
  }
  const rated = list.filter((r) => Number.isFinite(r.ratingScore));
  const buys = rated.filter((r) => r.ratingScore >= 0.75).length;
  const neutrals = rated.filter((r) => r.ratingScore > 0.25 && r.ratingScore < 0.75).length;
  const sells = rated.filter((r) => r.ratingScore <= 0.25).length;
  const coverage = band(list.length, [
    [16, 100], [12, 92], [9, 84], [6, 74], [4, 62], [2, 48], [1, 34],
  ], 35);

  let rating = null;
  if (rated.length) {
    const now = Date.now();
    let weighted = 0;
    let weights = 0;
    rated.forEach((r) => {
      const days = daysSince(r.rawDate);
      const w = days !== null && days <= 30 ? 1.5 : 1;
      weighted += r.ratingScore * w;
      weights += w;
    });
    rating = (weighted / weights) * 100;
  }

  const targets = list
    .map((r) => r.target)
    .filter((n) => Number.isFinite(n) && n > 0)
    .slice(0, 8);
  let targetScore = null;
  let targetUpside = null;
  if (targets.length && quote && quote.price > 0) {
    const avg = targets.reduce((a, b) => a + b, 0) / targets.length;
    targetUpside = (avg / quote.price - 1) * 100;
    targetScore = band(targetUpside, [
      [25, 100], [15, 92], [8, 82], [2, 70], [-5, 52], [-15, 34],
    ], 22);
  }

  /* FR-18.1：有值才计入权重，避免评级缺失时把已得分子按 0.75 分母稀释 */
  let sum = 0;
  let weight = 0;
  if (Number.isFinite(coverage)) {
    sum += coverage * 0.3;
    weight += 0.3;
  }
  if (rating !== null) {
    sum += rating * 0.45;
    weight += 0.45;
  }
  if (targetScore !== null) {
    sum += targetScore * 0.25;
    weight += 0.25;
  }
  const score = weight > 0 ? Math.round(sum / weight) : null;
  const reasons = [`近 6 个月共 ${list.length} 篇研报，覆盖度打分 ${coverage}。`];
  if (rated.length) {
    reasons.push(`已评级 ${rated.length} 篇：买入/增持 ${buys} 篇，中性 ${neutrals} 篇，减持/卖出 ${sells} 篇；按近 30 天加权，评级均值 ${Math.round(rating)}。`);
  } else {
    reasons.push('研报未给出可识别评级，评级子项不计入。');
  }
  if (targetUpside !== null) {
    reasons.push(`目标价均值 ${fmtPrice(targets.reduce((a, b) => a + b, 0) / targets.length)}，较现价 ${fmtPct(targetUpside)}。`);
  } else {
    reasons.push('研报未提供目标价，目标价子项不计入并按剩余权重折算。');
  }
  const note = `近 6 个月 ${list.length} 篇 · 买入/增持 ${buys} 篇${targetUpside !== null ? ` · 目标空间 ${fmtPct(targetUpside)}` : ''}`;
  return { available: true, score, note, reasons };
}

function scoreFinancial(data) {
  const f = data.financials;
  if (!f || !f.supported) {
    return {
      available: false,
      note: (f && f.reason) || '盈利与成长数据暂不可用',
      reasons: [],
    };
  }
  if (f.empty || (!Number.isFinite(f.revenueYoY) && !Number.isFinite(f.profitYoY) && !Number.isFinite(f.roe))) {
    return { available: false, note: '财务接口未返回有效指标', reasons: [] };
  }
  const rev = growthScore(f.revenueYoY);
  const profit = growthScore(f.profitYoY);
  const roe = roeScore(f.roe);
  const parts = [];
  if (rev !== null) parts.push([rev, 0.35, '营收增速']);
  if (profit !== null) parts.push([profit, 0.35, '净利增速']);
  if (roe !== null) parts.push([roe, 0.3, 'ROE']);
  const totalW = parts.reduce((a, p) => a + p[1], 0);
  if (!totalW) return { available: false, note: '财务接口未返回有效指标', reasons: [] };
  const score = Math.round(parts.reduce((a, p) => a + p[0] * p[1], 0) / totalW);
  const reasons = [`报告期 ${f.period || f.reportDate || '—'}。`];
  if (Number.isFinite(f.revenueYoY)) reasons.push(`营收同比 ${fmtPct(f.revenueYoY)}，增速子项 ${rev}。`);
  else reasons.push('营收增速缺失，子项不计入。');
  if (Number.isFinite(f.profitYoY)) reasons.push(`归母净利同比 ${fmtPct(f.profitYoY)}，增速子项 ${profit}。`);
  else reasons.push('净利增速缺失，子项不计入。');
  if (Number.isFinite(f.roe)) reasons.push(`ROE ${ratioText(f.roe)}，盈利质量子项 ${roe}。`);
  else reasons.push('ROE 缺失，子项不计入。');
  if (Number.isFinite(f.grossMargin)) reasons.push(`毛利率 ${ratioText(f.grossMargin)}，仅作参考，不直接计分。`);
  const noteParts = [];
  if (Number.isFinite(f.revenueYoY)) noteParts.push(`营收 ${fmtPct(f.revenueYoY)}`);
  if (Number.isFinite(f.profitYoY)) noteParts.push(`净利 ${fmtPct(f.profitYoY)}`);
  if (Number.isFinite(f.roe)) noteParts.push(`ROE ${ratioText(f.roe)}`);
  return { available: true, score, note: noteParts.join(' · ') || f.period || '财务指标已获取', reasons };
}

function scoreTechnical(data) {
  const k = data.kline && data.kline.metrics;
  if (!k) return { available: false, note: '历史 K 线数据不足', reasons: [] };
  const r20 = returnScore(k.r20, 20);
  const r60 = returnScore(k.r60, 40);
  const parts = [];
  if (r20 !== null) parts.push([r20, 0.45]);
  if (r60 !== null) parts.push([r60, 0.45]);
  if (k.trend === '多头排列') parts.push([95, 0.1]);
  else if (k.trend === '空头排列') parts.push([15, 0.1]);
  else parts.push([50, 0.1]);
  const totalW = parts.reduce((a, p) => a + p[1], 0);
  let score = parts.reduce((a, p) => a + p[0] * p[1], 0) / totalW;
  if (Number.isFinite(k.maxDrawdown) && k.maxDrawdown < -10) {
    score += Math.max(-18, (k.maxDrawdown + 10) * 0.6);
  }
  score = Math.round(clamp(score, 0, 100));
  const reasons = [
    `近 20 日 ${fmtPct(k.r20)}，近 60 日 ${fmtPct(k.r60)}，近 120 日 ${fmtPct(k.r120)}。`,
    `均线形态：${k.trend}；20 日均线 ${fmtPrice(k.ma20)}，60 日均线 ${fmtPrice(k.ma60)}。`,
    `近 120 日最大回撤 ${fmtPct(k.maxDrawdown)}，年化波动约 ${ratioText(k.volatility)}。`,
    Number.isFinite(k.maxDrawdown) && k.maxDrawdown < -10
      ? `回撤超过 10%，已按幅度扣分 ${Math.min(18, Math.round((-10 - k.maxDrawdown) * 0.6))} 分。`
      : '回撤在 10% 以内，未触发回撤扣分。',
  ];
  const note = `20日 ${fmtPct(k.r20)} · 60日 ${fmtPct(k.r60)} · ${k.trend}`;
  return { available: true, score, note, reasons };
}

function scoreNews(data) {
  const s = analyzeSentiment(data.news);
  if (!s.total) return { available: false, note: '暂未获取到相关新闻', reasons: [] };
  const score = Math.round(s.score);
  const reasons = [
    `共 ${s.total} 条相关新闻：正面 ${s.pos} 条、中性 ${s.neu} 条、负面 ${s.neg} 条。`,
    '按标题与摘要中的正负面关键词计数，标题与正文同权，属于粗略情绪指标。',
    s.pos || s.neg
      ? `情绪净值 ${s.pos - s.neg}，换算得分 ${score}。`
      : '未命中明显正负面关键词，按中性处理。',
  ];
  return {
    available: true,
    score,
    note: `${s.total} 条 · 正 ${s.pos} / 中 ${s.neu} / 负 ${s.neg}`,
    reasons,
  };
}

function computeScore({ market, quote, kline, reports, financials, news }) {
  const data = { market, quote, kline, reports, financials, news };
  const results = {
    reports: scoreReports(data, quote),
    financial: scoreFinancial(data),
    technical: scoreTechnical(data),
    news: scoreNews(data),
  };
  const dims = DIM_META.map((meta) => {
    const r = results[meta.key];
    return {
      ...meta,
      available: !!r.available && Number.isFinite(r.score),
      score: r.available && Number.isFinite(r.score) ? r.score : null,
      note: r.note,
      reasons: r.reasons || [],
    };
  });
  const available = dims.filter((d) => d.available);
  const weightSum = available.reduce((a, d) => a + d.weight, 0);
  const cov = coverageMeta(Math.round((weightSum / 100) * 100));
  const coverage = cov.coverage;
  let total = null;
  if (weightSum > 0) {
    const weighted = available.reduce((a, d) => a + d.score * d.weight, 0) / weightSum;
    /* FR-18.4：与 ETF / 加密共用同一覆盖度折算，覆盖不足不再与满覆盖同分同标签 */
    total = Math.round(weighted * cov.factor);
  }
  const availableCount = available.length;
  const dimCount = dims.length;
  const verdict = verdictFor(total === null ? 0 : total);
  const sorted = available.slice().sort((a, b) => b.score - a.score);
  let desc = total === null ? '有效数据不足，暂不给出综合分。' : verdict.desc + '。';
  if (sorted.length >= 2) {
    desc += `最强项为${sorted[0].name}（${sorted[0].score}），最弱项为${sorted[sorted.length - 1].name}（${
      sorted[sorted.length - 1].score
    }）。`;
  }
  if (coverage < 100) {
    desc += `当前可用 ${availableCount}/${dimCount} 个维度、权重覆盖 ${coverage}%，缺失维度已从权重中剔除并按覆盖度折算。`;
    if (market !== 'A') {
      desc += '港美股缺少免费中文研报等维度，分数仅在可用维度内可比，请勿与 A 股评分直接比较高低。';
    }
  }
  return {
    total,
    verdict,
    dims,
    coverage,
    comparable: cov.comparable,
    availableCount,
    dimCount,
    market,
    desc,
    missing: dims.filter((d) => !d.available).map((d) => d.short),
    createdAt: new Date(),
  };
}

/* ---------------- shared presentation helpers ---------------- */
function dimByKey(score, key) {
  return score && score.dims ? score.dims.find((d) => d.key === key) : null;
}
function scoreColorClass(score) {
  if (!Number.isFinite(score)) return 'muted';
  if (score >= 65) return 'teal';
  if (score >= 50) return 'blue';
  if (score >= 35) return 'orange';
  return 'red';
}
function sentimentLabel(score) {
  if (!Number.isFinite(score)) return '暂无数据';
  if (score >= 65) return '偏正面';
  if (score >= 55) return '略偏正面';
  if (score > 45) return '中性';
  if (score > 35) return '略偏负面';
  return '偏负面';
}

'use strict';

function renderGauge(score, verdict, coverage) {
  const value = Number.isFinite(score) ? score : 0;
  const r = 88;
  const circ = 2 * Math.PI * r;
  const target = (circ * value) / 100;
  return `
  <div class="gauge" id="scoreGauge">
    <svg viewBox="0 0 210 210" role="img" aria-label="综合评分 ${Number.isFinite(score) ? score : '暂无'} 分">
      <circle class="gauge-track" cx="105" cy="105" r="${r}"></circle>
      <circle class="gauge-fill ${verdict.cls}" cx="105" cy="105" r="${r}"
        stroke-dasharray="0 ${circ.toFixed(1)}" stroke-dashoffset="0">
        <animate attributeName="stroke-dasharray" from="0 ${circ.toFixed(1)}" to="${target.toFixed(1)} ${circ.toFixed(
    1
  )}" dur="1.05s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      </circle>
    </svg>
    <div class="gauge-center">
      <div class="score-num">${Number.isFinite(score) ? score : '—'}<small>${Number.isFinite(score) ? '/ 100' : ''}</small></div>
      <span class="verdict-pill ${verdict.cls}">${Number.isFinite(score) ? verdict.label : '数据不足'}</span>
    </div>
  </div>`;
}

function radarPoints(cx, cy, r, values) {
  return values
    .map((v, i) => {
      const angle = (Math.PI * 2 * i) / values.length - Math.PI / 2;
      const rr = r * (clamp(v, 0, 100) / 100);
      return `${(cx + Math.cos(angle) * rr).toFixed(1)},${(cy + Math.sin(angle) * rr).toFixed(1)}`;
    })
    .join(' ');
}

function renderRadar(dims) {
  const cx = 130;
  const cy = 122;
  const r = 80;
  const vals = dims.map((d) => (d.available ? d.score : 0));
  const rings = [25, 50, 75, 100]
    .map(
      (level) =>
        `<polygon class="radar-grid" points="${radarPoints(
          cx,
          cy,
          r,
          dims.map(() => level)
        )}"></polygon>`
    )
    .join('');
  const axes = dims
    .map((_, i) => {
      const angle = (Math.PI * 2 * i) / dims.length - Math.PI / 2;
      return `<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(angle) * r).toFixed(
        1
      )}" y2="${(cy + Math.sin(angle) * r).toFixed(1)}"></line>`;
    })
    .join('');
  const area = `<polygon class="radar-area" points="${radarPoints(cx, cy, r, vals)}"></polygon>`;
  const dots = dims
    .map((d, i) => {
      const angle = (Math.PI * 2 * i) / dims.length - Math.PI / 2;
      const rr = r * (clamp(vals[i], 0, 100) / 100);
      return `<circle class="radar-dot" cx="${(cx + Math.cos(angle) * rr).toFixed(1)}" cy="${(
        cy +
        Math.sin(angle) * rr
      ).toFixed(1)}" r="3.2"></circle>`;
    })
    .join('');
  const labels = dims
    .map((d, i) => {
      const angle = (Math.PI * 2 * i) / dims.length - Math.PI / 2;
      const x = cx + Math.cos(angle) * (r + 17);
      const y = cy + Math.sin(angle) * (r + 15);
      const anchor = Math.abs(Math.cos(angle)) < 0.1 ? 'middle' : Math.cos(angle) > 0 ? 'start' : 'end';
      const dy = i === 0 ? -6 : i === 2 ? 8 : 0;
      const text = d.available ? d.score : '—';
      return `<text class="radar-label" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}">${
        d.short
      }</text><text class="radar-value" x="${x.toFixed(1)}" y="${(y + dy + 12).toFixed(1)}" text-anchor="${anchor}">${text}</text>`;
    })
    .join('');
  return `<svg viewBox="0 0 260 250" role="img" aria-label="四维因子雷达图">${rings}${axes}${area}${dots}${labels}</svg>`;
}

function renderSparkline(points) {
  if (!Array.isArray(points) || points.length < 2) return '';
  const rows = points.slice(-240);
  const closes = rows.map((p) => p.close).filter(Number.isFinite);
  if (closes.length < 2) return '';
  const w = 640;
  const h = 112;
  const pad = 5;
  const min = Math.min(...closes);
  const max = Math.max(...closes);
  const span = max - min || 1;
  const x = (i) => (i / (rows.length - 1)) * (w - pad * 2) + pad;
  const y = (v) => h - pad - ((v - min) / span) * (h - pad * 2);
  const line = rows.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.close).toFixed(1)}`).join(' ');
  const area = `${line} L${x(rows.length - 1).toFixed(1)} ${h - pad} L${x(0).toFixed(1)} ${h - pad} Z`;
  const id = uid('spark');
  const lastX = x(rows.length - 1);
  const lastY = y(rows[rows.length - 1].close);
  const guides = [25, 50, 75]
    .map((pct) => {
      const gy = (h - pad * 2) * (pct / 100) + pad;
      return `<line class="spark-guide" x1="${pad}" y1="${gy.toFixed(1)}" x2="${w - pad}" y2="${gy.toFixed(1)}"/>`;
    })
    .join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="近一年股价走势">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--gold)" stop-opacity=".24"/>
      <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
    </linearGradient></defs>
    ${guides}
    <path class="spark-area" d="${area}" fill="url(#${id})"></path>
    <path class="spark-line" d="${line}" vector-effect="non-scaling-stroke"></path>
    <circle class="spark-dot" cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3"></circle>
  </svg>`;
}

function renderScoreMiniBars(coverage) {
  const on = Math.round((clamp(coverage, 0, 100) / 100) * 10);
  return Array.from({ length: 10 }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('');
}

function renderSentimentBar(s) {
  if (!s || !s.total) return '';
  const p = (n) => ((n / s.total) * 100).toFixed(1);
  return `<div class="senti-bar"><i class="pos" style="width:${p(s.pos)}%"></i><i class="neu" style="width:${p(
    s.neu
